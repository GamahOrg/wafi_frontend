<div [formGroup]="feedbackForm">
  <div class="row row-gap-3">
    <div class="col-12">
      <h6 class="mb-2">هل يوجد ملاحظات على الطلب </h6>
      <!-- {{isWithNotes.value=='true' ? true : false}} -->
      <div class="form-check form-check-inline">
        <input class="form-check-input"
               type="radio"
               id="yes"
               value=true
               formControlName="IsWithNotes"
               [checked]="isWithNotes.value=='true'">
        <label class="form-check-label"
               for="yes">نعم</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input"
               type="radio"
               id="no"
               value=false
               formControlName="IsWithNotes"
               [checked]="isWithNotes.value=='false'">
        <label class="form-check-label"
               for="no">لا</label>
      </div>
    </div>
    <ng-container *ngIf="isWithNotes.value=='true'">
      <div class="col-12">
        <app-rich-text-editor id=""
                              (valueChanged)="onValueChange($event)"></app-rich-text-editor>
      </div>


      <div class="col-12">
        <div class="tab-data-section">
          <div class="row mb-3">
            <div class="col-12 col-lg-12">
              <div class="form-group mb-4">
                <div class="col-12 col-lg-12">
                  <app-file-uploader [data]="multipleFileUploaderData"
                                     (fileUploaded)="onLicenseProcessingLogFile($event)"></app-file-uploader>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </ng-container>


  </div>
</div>
