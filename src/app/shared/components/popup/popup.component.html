<div mat-dialog-title>
  <i class="icon" [ngClass]="popupData.iconClass" *ngIf="popupData.iconClass"></i>
  <h6 class="title">{{popupData.title}}</h6>
  <button *ngIf="!popupData.disableClose" class="btn btn-link p-0" mat-dialog-close tabindex="-1">
    <i class="material-icons">close</i>
  </button>
</div>

<div mat-dialog-content>
  <ng-container *ngComponentOutlet="popupData.component"></ng-container>
</div>

<div *ngIf="popupActionsButtons.length>0" mat-dialog-actions>
  <ng-container *ngFor="let button of popupActionsButtons">
    <button type="button" class="btn btn-link px-xl-4" *ngIf="button.isVisable && button.actionType === 'cancel'" [disabled]="button.isDisables" [ngClass]="{
          'ms-auto': popupData.cancelButtonPosition === 'end',
          'me-auto': popupData.cancelButtonPosition !== 'end'
          }" (click)="onClickOnPopupActionButton(button.actionType);">
      {{button.title}}
    </button>

    <button type="button" class="btn btn-primary" *ngIf="button.isVisable && button.actionType === 'confirm'" [disabled]="button.isDisables" (click)="onClickOnPopupActionButton(button.actionType);">
      {{button.title}}
    </button>
  </ng-container>
</div>
