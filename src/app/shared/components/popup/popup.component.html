    <ng-container *ngFor="let button of popupActionsButtons">
      <button mat-flat-button *ngIf="button.isVisable && button.actionType=='cancel'" [disabled]="button.isDisables" class="me-auto" (click)="onClickOnPopupActionButton(button.actionType)">
        {{button.title}}
      </button>

      <button mat-flat-button *ngIf="button.isVisable && button.actionType=='confirm'" [disabled]="button.isDisables" color="primary" (click)="onClickOnPopupActionButton(button.actionType)">
