<div class="no-data">
  <h6 class="title" *ngIf="showTitle">{{title}}</h6>

  <img src="assets/images/general/no-data-found.SVG" class="img-fluid" alt="">

  <p [ngClass]="useTitleClass ? 'title' : 'text'" *ngIf="showText">{{text}}</p>

  <div class="actions">
    <button *ngIf="showCompleteBtn" mat-flat-button color="primary" (click)="noDataButtonClicked()" class="mx-1">{{completeBtnTitle}}</button>
    <ng-container *ngFor="let button of noDataActionsButtons">
      <button mat-flat-button *ngIf="button.isVisable" [disabled]="button.isDisables" class="primary mx-1" color="primary" (click)="button.onclick()">
        {{button.title}}
      </button>
    </ng-container>
  </div>

</div>
