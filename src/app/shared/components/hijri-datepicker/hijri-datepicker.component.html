<div class="hijri-datepicker" [class.disabled]="disabled" (click)="$event.stopPropagation()" (document:click)="onDocumentClick($event)">
  <div class="input-group" [class.is-open]="isOpen" [class.disabled]="disabled" (click)="toggleCalendar()" #dateInput>
    <input type="text" [value]="displayValue" [placeholder]="placeholder" class="form-control" [disabled]="disabled" [readonly]="disabled" />

    <span class="input-group-text">
      <i class="hgi hgi-stroke hgi-calendar-03"></i>
    </span>
  </div>

  <div class="calendar-dropdown" *ngIf="isOpen" [style.top.px]="dropdownTop" [style.left.px]="dropdownLeft">
    <div class="calendar-header">
      <button type="button" class="nav-btn" (click)="previousMonth()">
        <i class="material-icons-outlined">chevron_right</i>
      </button>
      <div class="month-year">
        <span>{{ hijriMonths[currentHijriMonth] }} {{ currentHijriYear }}</span>
      </div>
      <button type="button" class="nav-btn" (click)="nextMonth()">
        <i class="material-icons-outlined">chevron_left</i>
      </button>
    </div>

    <div class="calendar-body">
      <div class="weekdays">
        <div class="weekday" *ngFor="let day of weekDays">{{ day }}</div>
      </div>

      <div class="days-grid">
        <div class="day-cell" *ngFor="let day of daysInMonth" [class.empty]="!day" [class.today]="day?.isToday" [class.selected]="day?.isSelected" (click)="selectDate(day)">
          <span *ngIf="day">{{ day.hijriDay }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
