<div class="file-upload">
  <div class="upload-drop-zone d-flex flex-column gap-2">
    <div class="upload-hints">
      <p>
        الصيغة {{data.allowedExtensionsText}} و {{
        data.maxFileSizeMB
        ? data.maxFileSizeMB + ' ميجا بايت'
        : data.size + ' كيلو بايت'
        }} بحد أقصى
      </p>
    </div>

    <div class="d-flex flex-column gap-2">
      <div class="d-flex flex-wrap justify-content-end align-items-center gap-2">
        <ng-container *ngIf="data.multiple; else singleInputFile">
          <input type="file" #fileInputMultiple hidden #InputMultipleFiles multiple (change)="selectFiles($event)" />
          <button type="button" class="btn btn-dark me-auto" (click)="InputMultipleFiles.click()">{{data.buttonText?data.buttonText: "تصفح الملفات" }}</button>
        </ng-container>
        <ng-template #singleInputFile>
          <input type="file" #fileInputSingle hidden #inputSingleFile accept="{{data.allowedExtensions?.join(',')}}" (change)="selectFiles($event)" />
          <button type="button" class="btn btn-dark me-auto" (click)="inputSingleFile.click()">{{data.buttonText?data.buttonText: "تصفح الملفات"}}</button>
        </ng-template>

        <ng-container *ngIf="selectedFilesName.length > 0">
          <button class="btn btn-primary" [disabled]="!selectedFiles" (click)="upload()">{{data.uploadAllLabel? data.uploadAllLabel : 'رفع الملفات'}}</button>
          <button class="btn btn-outline-secondary" [disabled]="!selectedFiles" (click)="deleteAll()">{{data.removeAllLabel?data.removeAllLabel:'مسح الكل'}}</button>
        </ng-container>
      </div>

      <div class="selected-file d-flex align-items-center gap-2" *ngFor="let fileName of selectedFilesName">
        <ng-container *ngIf="isSuccessfulUpload">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M10.0002 19.1668C15.0628 19.1668 19.1668 15.0628 19.1668 10.0002C19.1668 4.93755 15.0628 0.833496 10.0002 0.833496C4.93755 0.833496 0.833496 4.93755 0.833496 10.0002C0.833496 15.0628 4.93755 19.1668 10.0002 19.1668Z" fill="white" />
            <path fill-rule="evenodd" clip-rule="evenodd" d="M10.0002 19.1668C15.0628 19.1668 19.1668 15.0628 19.1668 10.0002C19.1668 4.93755 15.0628 0.833496 10.0002 0.833496C4.93755 0.833496 0.833496 4.93755 0.833496 10.0002C0.833496 15.0628 4.93755 19.1668 10.0002 19.1668ZM5.87534 9.26793C5.54991 9.59337 5.54991 10.121 5.87534 10.4464L8.23237 12.8035C8.5578 13.1289 9.08544 13.1289 9.41088 12.8035L14.1249 8.08942C14.4504 7.76398 14.4504 7.23634 14.1249 6.91091C13.7995 6.58547 13.2718 6.58547 12.9464 6.91091L8.82162 11.0357L7.05386 9.26793C6.72842 8.94249 6.20078 8.94249 5.87534 9.26793Z" fill="#067647" />
          </svg>
        </ng-container>

        <span class="file-name me-auto">{{fileName}}</span>
        <!-- <button type="button" class="btn btn-icon fs-6"><i class="hgi hgi-stroke hgi-rounded hgi-cancel-01"></i></button> -->
      </div>

      <div *ngIf="currentFile" class="progress">
        <div class="progress-bar progress-bar-striped bg-success progress-bar-animated" role="progressbar" attr.aria-valuenow="{{ progress }}" aria-valuemin="0" aria-valuemax="100" [ngStyle]="{ width: progress + '%' }">
          {{ progress }}%
        </div>
      </div>

      <p *ngIf="message" class="small text-success">
        {{ message }}
      </p>

      <p *ngIf="extensionErrorMessage" class="small text-danger">
        {{ extensionErrorMessage }}
      </p>
    </div>
  </div>
</div>
