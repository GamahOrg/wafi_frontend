<div class="file-upload">
  <div class="upload-drop-zone d-flex flex-column gap-2">
    <div class="upload-hints">
      <p>الصيغة {{data.allowedExtensionsText}} و {{this.data.size}} كيلو بايت بحد أقصى</p>
    </div>

    <div class="d-flex flex-column gap-2">
      <div class="d-flex flex-wrap justify-content-end align-items-center gap-2">
        <ng-container *ngIf="data.multiple; else singleInputFile">
          <input type="file" #fileInputMultiple hidden #InputMultipleFiles multiple (change)="selectFiles($event)" />
          <button type="button" class="btn btn-primary me-auto" (click)="InputMultipleFiles.click()">{{data.buttonText?data.buttonText: "تصفح الملفات" }}</button>
        </ng-container>
        <ng-template #singleInputFile>
          <input type="file" #fileInputSingle hidden #inputSingleFile accept="{{data.allowedExtensions?.join(',')}}" (change)="selectFiles($event)" />
          <button type="button" class="btn btn-primary me-auto" (click)="inputSingleFile.click()">{{data.buttonText?data.buttonText: "تصفح الملفات"}}</button>
        </ng-template>

        <ng-container *ngIf="selectedFilesName.length > 0">
          <button class="btn btn-primary" [disabled]="!selectedFiles" (click)="upload()">{{data.uploadAllLabel? data.uploadAllLabel : 'رفع الكل'}}</button>
          <button class="btn btn-outline-secondary" [disabled]="!selectedFiles" (click)="deleteAll()">{{data.removeAllLabel?data.removeAllLabel:'مسح الكل'}}</button>
        </ng-container>
      </div>

      <div class="selected-file d-flex align-items-center gap-2" *ngFor="let fileName of selectedFilesName">
        <span *ngIf="isSuccessfulUpload" class="icon-check"><i class="material-icons">check</i></span>
        <span class="file-name me-auto">{{fileName}}</span>
        <!-- <span class="icon-close cursor-pointer"><i class="material-icons">close</i></span> -->
      </div>

      <div *ngIf="currentFile" class="progress">
        <div class="progress-bar progress-bar-striped bg-success progress-bar-animated" role="progressbar" attr.aria-valuenow="{{ progress }}" aria-valuemin="0" aria-valuemax="100" [ngStyle]="{ width: progress + '%' }">
          {{ progress }}%
        </div>
      </div>

      <p *ngIf="message" class="small text-success">
        {{ message }}
      </p>

      <p *ngIf="extensionErrorMessage" class="small text-danger">
        {{ extensionErrorMessage }}
      </p>
    </div>
  </div>
</div>
