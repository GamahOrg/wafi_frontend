<div class="row gx-3">
  <div class="col-12 col-md-3">
    <div class="p-3 rounded-1 bg-white">
      <h6 class="mb-3 small fw-semibold"
          *ngIf="tabContent.tabTitle">{{tabContent.tabTitle}}</h6>
      <div class="nav nav-pills"
           role="tablist"
           aria-orientation="vertical">

        <div class="tabs-group"
             *ngFor="let tab of tabContent.tabsComponentList; index as i">
          <ng-container *ngIf="!tab.children">
            <button type="button"
                    class="nav-link"
                    [ngClass]="{ active: i == tabContent.activeTabIndex }"
                    [id]="tab.id"
                    data-bs-toggle="pill"
                    [attr.data-bs-target]="'#' + i"
                    role="tab"
                    [attr.aria-controls]="i"
                    [attr.aria-selected]="i ==  tabContent.activeTabIndex? 'true' : 'false'"
                    (click)="updateActiveTabIndex(i)"
                    *ngIf="tab.isVisible">
              <span>{{ tab.title}}</span>
              <span class="count"
                    *ngIf="tab.errNum">{{ tab.errNum }}</span>
              <span class="checked"
                    *ngIf="tab.errNum"><i class="material-icons">check</i></span>
            </button>
          </ng-container>

          <ng-container *ngIf="tab.children">
            <h6 class="nav-link mb-3">{{tab.title}}</h6>
            <ng-container *ngFor="let child of tab.children; index as idx">
              <button type="button"
                      class="nav-link child"
                      [ngClass]="{ active: i == tabContent.activeTabIndex && idx == activeChildIndex }"
                      [id]="child.id"
                      data-bs-toggle="pill"
                      [attr.data-bs-target]="'#' + i + '-' + idx"
                      role="tab"
                      [attr.aria-controls]="idx"
                      [attr.aria-selected]="i == tabContent.activeTabIndex && idx == activeChildIndex ? 'true' : 'false'"
                      (click)="updateActiveChildIndex(i, idx)"
                      *ngIf="child.isVisible">
                <span>{{ child.title}}</span>
                <span class="count"
                      *ngIf="child.errNum">{{ child.errNum }}</span>
                <span class="checked"
                      *ngIf="child.errNum"><i class="material-icons">check</i></span>
              </button>
            </ng-container>
          </ng-container>
        </div>

      </div>
    </div>
  </div>
  <div class="col-12 col-md-9">
    <div class="tab-content">

      <ng-container *ngFor="let tab of tabContent.tabsComponentList; index as i">
        <ng-container *ngIf="!tab.children">
          <div class="tab-pane"
               [ngClass]="{ 'show active': i ==  tabContent.activeTabIndex }"
               [id]="i"
               role="tabpanel"
               [attr.aria-labelledby]="tab.id">
            <ng-container *ngIf="tab.isVisible">
              <ng-container *ngIf="i == tabContent.activeTabIndex &&  tab.Component">
                <ng-container *ngComponentOutlet="tab.Component"></ng-container>
              </ng-container>
            </ng-container>
          </div>
        </ng-container>
        <ng-container *ngIf="tab.children">
          <ng-container *ngFor="let child of tab.children; index as idx">
            <div class="tab-pane"
                 [ngClass]="{ 'show active': i == tabContent.activeTabIndex && idx == activeChildIndex }"
                 [id]="i + '-' + idx"
                 role="tabpanel"
                 [attr.aria-labelledby]="child.id">
              <ng-container *ngIf="child.isVisible">
                <ng-container *ngIf="i == tabContent.activeTabIndex && idx == activeChildIndex && child.Component">
                  <ng-container *ngComponentOutlet="child.Component"></ng-container>
                </ng-container>
              </ng-container>
            </div>
          </ng-container>
        </ng-container>
      </ng-container>

    </div>
  </div>
</div>
