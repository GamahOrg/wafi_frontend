<div class="row gx-3">
  <div class="col-12 col-md-3">
    <div class="nav flex-column nav-pills" role="tablist" aria-orientation="vertical">
      <h6 class="mb-3 small" *ngIf="tabContent.tabTitle">{{tabContent.tabTitle}}</h6>
      <ng-container *ngFor="let tab of tabContent.tabsComponentList; index as i">
        <button 
        type="button"
        class="nav-link" [ngClass]="{ active: i == tabContent.activeTabIndex }"
        [id]="tab.id" data-bs-toggle="pill"
        [attr.data-bs-target]="'#' + i"
        role="tab"
        [attr.aria-controls]="i"
        [attr.aria-selected]="i ==  tabContent.activeTabIndex? 'true' : 'false'"
        (click)="updateActiveTabIndex(i)"
        *ngIf="tab.isVisible">
          <!-- <span class="icon"><i class="material-icons">list_alt</i></span> -->
          <span>{{ tab.title }}</span>
          <span class="count" *ngIf="tab.errNum">{{ tab.errNum }}</span>
          <span class="checked" *ngIf="tab.errNum"><i class="material-icons">check</i></span>
        </button>
      </ng-container>
    </div>
  </div>
  <div class="col-12 col-md-9">
    <div class="tab-content">

      <div *ngFor="let tab of tabContent.tabsComponentList; index as i" class="tab-pane" [ngClass]="{ 'show active': i ==  tabContent.activeTabIndex }" [id]="i" role="tabpanel" [attr.aria-labelledby]="tab.id">
        <ng-container *ngIf="tab.isVisible">
          <ng-container *ngIf="i == tabContent.activeTabIndex &&  tab.Component">
            <ng-container *ngComponentOutlet="tab.Component"></ng-container>
          </ng-container>
        </ng-container>
      </div>

    </div>
  </div>
</div>
