      <ng-container *ngIf="confirmationPopupData.popupType === 'warning'">
        <i class="hgi hgi-stroke hgi-alert-02"></i>
      </ng-container>
    </span>

    <h6 class="title" *ngIf="confirmationPopupData.title" [innerHTML]="confirmationPopupData.title"></h6>
  </div>

  <button class="btn btn-link p-0" (click)="onClickOnCancel()" mat-dialog-close tabindex="-1" aria-label="Close" *ngIf="!disableClose">
    <i class="material-icons">close</i>
  </button>
</div>

<div mat-dialog-content class="py-4">
  <div class="d-flex flex-column justify-content-center align-items-center gap-4">
    <ng-container *ngIf="confirmationPopupData.staticMessage">
      <p class="text" [innerHTML]=" confirmationPopupData.staticMessage">
        <!-- {{ confirmationPopupData.staticMessage }} -->
      </p>
    </ng-container>

    <ng-container *ngIf="confirmationPopupData.dynamicMessage">
      <p class="text">
        {{ confirmationPopupData.dynamicMessage }}
      </p>
    </ng-container>

    <ng-container *ngIf="confirmationPopupData.secondeStaticMessage">
      <p class="text">
        {{ confirmationPopupData.secondeStaticMessage }}
      </p>
    </ng-container>

    <ng-container *ngIf="confirmationPopupData.alertText">
      <p class="text" [ngClass]="confirmationPopupData.alertClass">
        <i class="icon hgi hgi-stroke hgi-alert-circle"></i>
        {{ confirmationPopupData.alertText }}
      </p>
    </ng-container>

    <div class="d-flex justify-content-center align-items-center gap-3">
      <ng-container *ngIf="confirmationPopupData.showCloseButtonOnly; else defaultButtons">
        <button class="btn btn-{{confirmationPopupData.popupType}}" (click)="onClickOnCancel()">{{confirmationPopupData.closeButtonText ?? 'إغلاق'}}</button>
      </ng-container>
      <ng-template #defaultButtons>
        <button class="btn btn-link px-xl-4" (click)="onClickOnCancel()" *ngIf="!confirmationPopupData.hideCancelButton">إلغاء</button>
        <button class="btn btn-{{confirmationPopupData.popupType}}" (click)="onClickOnConfirm()">{{confirmationPopupData.acceptButtonText ?? 'حفظ '}}</button>
      </ng-template>
    </div>
  </div>
</div>
