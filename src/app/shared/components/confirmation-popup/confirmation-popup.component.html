<div class="confirmation-dialog-wrapper">
  <!-- Close Button -->
  <button class="close-button" (click)="onClickOnCancel()" aria-label="Close">
    <span>×</span>
  </button>

  <!-- Title -->
  <div class="dialog-title-section" *ngIf="confirmationPopupData.title">
    <h2 class="dialog-title">{{ confirmationPopupData.title }}</h2>
  </div>

  <!-- Content with Side Bar -->
  <div class="dialog-body">
    <div class="side-bar"></div>
    <div class="content-area">
      <div *ngIf="confirmationPopupData.staticMessage" class="content-text" [innerHTML]="confirmationPopupData.staticMessage">
      </div>
      <div *ngIf="confirmationPopupData.dynamicMessage" class="content-text">
        {{ confirmationPopupData.dynamicMessage }}
      </div>
      <div *ngIf="confirmationPopupData.secondeStaticMessage" class="content-text">
        {{ confirmationPopupData.secondeStaticMessage }}
      </div>
    </div>
  </div>

  <!-- Footer Buttons -->
  <div class="dialog-footer">
    <button class="btn-cancel" (click)="onClickOnCancel()">
      إلغاء
    </button>
    <button class="btn-save" (click)="onClickOnConfirm()">
      {{confirmationPopupData.acceptButtonText ?? 'حفظ البيانات'}}
    </button>
  </div>
</div>
