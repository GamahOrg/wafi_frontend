<div class="success-popup-wrapper">
  <div class="success-popup-container">
    <!-- Icon -->
    <div class="popup-icon-wrapper">
      <svg width="100" height="80" viewBox="0 0 100 80" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Left X -->
        <g opacity="0.3">
          <line x1="12" y1="12" x2="22" y2="22" stroke="#9CA3AF" stroke-width="4" stroke-linecap="round"/>
          <line x1="22" y1="12" x2="12" y2="22" stroke="#9CA3AF" stroke-width="4" stroke-linecap="round"/>
        </g>
        <!-- Right X -->
        <g opacity="0.3">
          <line x1="78" y1="12" x2="88" y2="22" stroke="#9CA3AF" stroke-width="4" stroke-linecap="round"/>
          <line x1="88" y1="12" x2="78" y2="22" stroke="#9CA3AF" stroke-width="4" stroke-linecap="round"/>
        </g>
        <!-- Center Checkmark with diamond background -->
        <g transform="translate(50, 40)">
          <!-- Diamond shape rotated 45 degrees -->
          <rect x="-15" y="-15" width="30" height="30" fill="#047857" transform="rotate(45)"/>
          <!-- Checkmark -->
          <path d="M-6 0 L-2 4 L6 -6" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </g>
      </svg>
    </div>

    <!-- Title -->
    <h2 class="popup-title">{{ title }}</h2>

    <!-- Message -->
    <p class="popup-message">
      سيتم إنشاء نسخة بنود جديدة 
    </p>

    <!-- Confirm Button -->
    <button class="confirm-button" (click)="onConfirm()">
      موافق
    </button>
  </div>
</div>
