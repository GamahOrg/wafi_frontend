<ng-container *ngIf="useSearch">
  <input type="text" class="form-control" (keydown.enter)="$event.preventDefault()" autocorrect="off" autocapitalize="off" spellcheck="off" type="text" #search>
</ng-container>

<google-map [center]="center" [zoom]="zoom" height="300px" width="100%" (mapClick)="mapClicked($event)">
  <map-marker *ngFor="let pos of markerPositions" [position]="pos" [options]="markerOptions" (mapDragend)="markerDragEnd($event)"></map-marker>
</google-map>
