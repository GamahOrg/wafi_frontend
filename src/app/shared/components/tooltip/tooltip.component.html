<div class="tooltip-wrapper" [ngClass]="[color]">
    <button *ngIf="type === 'button'" type="button" class="toggler btn btn-{{color}}">{{text}}</button>
    <span *ngIf="type === 'icon'" class="toggler icon"><i class="material-icons text-{{color}}">{{text}}</i></span>

    <div class="content-wrapper" [ngClass]="[currentLang]">
        <div class="content" [ngClass]="[currentLang]">
            <p class="text">{{tooltipText}}</p>
        </div>
    </div>
</div>
