<accordion [closeOthers]="AccordionContent.oneAtATime"
           [isAnimated]="AccordionContent.isAnimated">
  <ng-container *ngFor="let accordion of AccordionContent.accordionComponentList, index as i">

    <accordion-group [attr.heading]="accordion.title"
                     [id]="accordion.id"
                     [isDisabled]="accordion.disabled"
                     [isOpen]="false"
                     (isOpenChange)="onClickOnTitle($event, accordion)"
                     *ngIf="accordion.isVisible">

      <div class="accordion-heading"
           accordion-heading
           (click)="[accordion.isViewed = true, updateisRendered(i)]">
        <h6 class="title me-auto">
          <span class="icon"
                *ngIf="accordion.icon"><i [ngClass]="accordion.icon"></i></span>
          <span>{{accordion.title}}</span>
        </h6>

        <span *ngIf="accordion?.['isViewed'] !== undefined">
          {{ accordion.isViewed ? "تم" : "عرض" }}
        </span>

        <span class="opened">
          <i class="hgi hgi-stroke hgi-arrow-up-01"></i>
        </span>

        <span class="closed">
          <i class="hgi hgi-stroke hgi-arrow-down-01"></i>
        </span>
      </div>

      <ng-container *ngIf="accordion.isRendered">
        <ng-container *ngComponentOutlet="accordion.component"></ng-container>
      </ng-container>

    </accordion-group>
  </ng-container>

</accordion>
