<form [formGroup]="feedbackForm">
  <h6 class="form-title">هل يوجد ملاحظات على الطلب </h6>
  <div class="row row-gap-3">
    <div class="col-12">
      <!-- {{isWithNotes.value=='true' ? true : false}} -->
      <div class="row g-2">
        <div class="col-xl-6">
          <label class="form-check" for="yes">
            <input class="form-check-input" type="radio" id="yes" value=true formControlName="IsWithNotes" [checked]="isWithNotes.value=='true'">
            <label class="form-check-label" for="yes">نعم</label>
          </label>
        </div>
        <div class="col-xl-6">
          <label class="form-check" for="no">
            <input class="form-check-input" type="radio" id="no" value=false formControlName="IsWithNotes" [checked]="isWithNotes.value=='false'">
            <label class="form-check-label" for="no">لا</label>
          </label>
        </div>
      </div>
    </div>
    <div class="col-12" *ngIf="isWithNotes.value=='true'">
      <app-rich-text-editor id="" (valueChanged)="onValueChange($event)"></app-rich-text-editor>
    </div>
  </div>
</form>
