<div [formGroup]="feedbackForm">
    <div class="row row-gap-3">
        <div class="col-12">
            <h6 class="mb-2">هل يوجد ملاحظات على الطلب </h6>
            <!-- {{isWithNotes.value=='true' ? true : false}} -->
            <div class="form-check form-check-inline">
                <input class="form-check-input"
                       type="radio"
                       id="yes"
                       value=true
                       formControlName="IsWithNotes"
                       [checked]="isWithNotes.value=='true'">
                <label class="form-check-label"
                       for="yes">نعم</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input"
                       type="radio"
                       id="no"
                       value=false
                       formControlName="IsWithNotes"
                       [checked]="isWithNotes.value=='false'">
                <label class="form-check-label"
                       for="no">لا</label>
            </div>
        </div>
        <div class="col-12"
             *ngIf="isWithNotes.value=='true'">
            <app-rich-text-editor id=""
                                  (valueChanged)="onValueChange($event)"></app-rich-text-editor>
        </div>
    </div>
</div>
