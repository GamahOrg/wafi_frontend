<div class="d-flex flex-column h-100">
  <app-pilot-launch-hint></app-pilot-launch-hint>

  <div class="content flex-fill">
    <div class="abstract top end">
      <img src="assets/images/auth/abstract-hor.svg" alt="" />
    </div>
    <div class="abstract top start">
      <img src="assets/images/auth/abstract-hor.svg" alt="" />
    </div>
    <div class="abstract bottom">
      <img src="assets/images/auth/abstract-hor.svg" alt="" />
    </div>

    <div class="row justify-content-center align-items-center h-100">
      <div class="col-xl-6">
        <div class="card auth-card">
          <div class="card-body">

            <h2 class="title">{{ localization.pleaseChoose }}</h2>
            <h6 class="or">{{ localization.or }}</h6>

            <div class="cards">
              <div class="card">
                <div class="card-body">
                  <h5 class="card-title">
                    <img src="/assets/images/general/REGA_LOGO_Dark.svg" alt="" />
                    {{ localization.wafi }}
                  </h5>
                  <a class="btn btn-primary w-100" (click)="navigateToWafiLogin()">{{
                    localization.enter
                    }}</a>
                </div>
              </div>
              <div class="card rega">
                <div class="card-body">
                  <h5 class="card-title">
                    <img src="/assets/images/general/REGA_LOGO_Dark.svg" alt="" />
                    {{ localization.realEstateContributions }}
                  </h5>
                  <a class="btn btn-primary w-100" (click)="navigateToRealEstateContributionsLogin()">{{ localization.enter }}</a>
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>
