<div class="d-flex flex-column h-100">
  <app-pilot-launch-hint></app-pilot-launch-hint>

  <div class="content flex-fill">
    <div class="abstract top end">
      <img src="assets/images/auth/abstract-hor.svg" alt="" />
    </div>
    <div class="abstract top start">
      <img src="assets/images/auth/abstract-hor.svg" alt="" />
    </div>
    <div class="abstract bottom">
      <img src="assets/images/auth/abstract-hor.svg" alt="" />
    </div>

    <!-- Hero Section -->
    <div class="hero-section">
      <div class="particles"></div>
      <div class="hero-content">
        <div class="hero-logo">
          <img src="/assets/images/real-estate-contributions/general/logo-rega-wide-white.svg" alt="REGA Logo" />
        </div>
        <h1 class="hero-title">{{ localization.welcomeToREGA }}</h1>
        <p class="hero-subtitle">{{ localization.chooseYourPlatform }}</p>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <div class="container">
        <div class="platform-cards">
          <!-- WAFI Card -->
          <div class="platform-card wafi-card" (click)="navigateToWafiLogin()">
            <div class="card-content">
              <div class="card-icon">
                <img src="/assets/images/general/off-plan-logo.png" alt="Off Plan" />
              </div>
              <h3 class="card-title">{{ localization.wafi }}</h3>
              <p class="card-description">{{ localization.wafiDescription }}</p>
              <button class="btn btn-primary">
                {{ localization.enter }}
              </button>
            </div>
            <div class="card-background"></div>
          </div>

          <!-- Real Estate Contributions Card -->
          <div class="platform-card reca-card" (click)="navigateToRealEstateContributionsLogin()">
            <div class="card-content">
              <div class="card-icon">
                <img src="/assets/images/general/musahmat-logo.png" alt="Real Estate Contributions" />
              </div>
              <h3 class="card-title">{{ localization.realEstateContributions }}</h3>
              <p class="card-description">{{ localization.recaDescription }}</p>
              <button class="btn btn-primary">
                {{ localization.enter }}
              </button>
            </div>
            <div class="card-background"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
