<div class="d-flex flex-column h-100">
  <app-pilot-launch-hint></app-pilot-launch-hint>
  <app-auth-topbar></app-auth-topbar>

  <div class="content flex-fill">
    <div class="abstract top start">
      <img src="assets/images/auth/abstract-hor.svg" alt="" />
    </div>
    <div class="abstract top end">
      <img src="assets/images/auth/abstract-ver.svg" alt="" />
    </div>
    <div class="abstract bottom end">
      <img src="assets/images/auth/abstract-hor.svg" alt="" />
    </div>

    <div class="row justify-content-center align-items-center h-100">
      <div class="col-xl-6 col-xxl-5">
        <div class="card auth-card">
          <div class="logo mt-3">
            <img src="assets/images/real-estate-contributions/general/logo-rega-wide-2.svg" alt="" class="logo-img" />
          </div>
          <div class="card-body">
            <ng-content></ng-content>
          </div>

          <div class="card-footer">
            <div class="d-flex justify-content-center align-items-center gap-3">
              <span>هل تريد تقديم شكوى أو بلاغ؟</span>
              <a [routerLink]="[complaintRequest]" class="btn btn-outline-danger" id="link-complaintRequest">اضغط هنا</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <app-real-estate-contribution-footer></app-real-estate-contribution-footer>
</div>
