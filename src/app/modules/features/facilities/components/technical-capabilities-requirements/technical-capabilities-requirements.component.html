<form class="basicInfoFormIndependentRealEstateDeveloper" id="form-basicInfoFormIndependentRealEstateDeveloper" *ngIf="technicalCapabilities">

  <div class="tab-data-header">
    <h6 class="title">المشروعات</h6>
  </div>

  <div class="tab-data-section">
    <div class="form-group">
      <label class="form-label">هل لديك خبرات سابقة <span class="required-star">*</span></label>
      <div class="row g-3">
        <div class="col-xl-2">
          <label class="form-check" for="yes">
            <input class="form-check-input" type="radio" name="prevExpert" [value]="true" [checked]="technicalCapabilities?.isPreviousExperienceExist === true" (change)="onPreviousExperienceChange(true)" id="yes">
            <label class="form-check-label" for="yes">نعم</label>
          </label>
        </div>
        <div class="col-xl-2">
          <label class="form-check" for="no">
            <input class="form-check-input" type="radio" name="prevExpert" [value]="false" [checked]="technicalCapabilities?.isPreviousExperienceExist === false" (change)="onPreviousExperienceChange(false)" id="no">
            <label class="form-check-label" for="no">لا</label>
          </label>
        </div>
        <div class="col-xl-auto" *ngIf="technicalCapabilities.isPreviousExperienceExist">
          <button type="button" mat-flat-button color="primary" *ngIf="canUpdate" (click)="displayAddQualificationProjectComponent()"> اضافة مشروع</button>
        </div>
      </div>
    </div>

    <hr class="my-4">

    <div class="row row-gap-4">
      <div class="col-12 col-md-12 col-lg-12" *ngIf="technicalCapabilities.isPreviousExperienceExist">
        <div class="table-responsive">
          <table class="table table-light">
            <thead>
              <tr>
                <th>اسم المشروع</th>
                <th>مالك المشروع</th>
                <th>التصنيف الأساسي</th>
                <th>التصنيف الفرعي</th>
                <th>وحدات المشروع</th>
                <th>الاجراءات</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let project of technicalCapabilities.projects">
                <td>{{ project.projectName }}</td>
                <td>{{ project.projectOwner }}</td>
                <td>{{ project.projectCategory?.categoryName }}</td>
                <td>{{ project.projectSubCategory?.subCategoryName }}</td>
                <td>
                  <span *ngFor="let type of project.projectsProjectTypes; let last = last">
                    {{ type.projectType.typeName }}<span *ngIf="!last"> , </span>
                  </span>
                </td>
                <td>
                  <div class="d-flex align-items-center justify-content-end column-gap-2">
                    <button class="btn-icon btn btn-secondary" *ngIf="canUpdate" (click)="displayEditQualificationProjectComponent(project)">
                      <i class="hgi hgi-stroke hgi-pencil-edit-02"></i>
                    </button>
                    <button class="btn-icon btn btn-danger" *ngIf="canUpdate" (click)="deleteProject(project)">
                      <i class="hgi hgi-stroke hgi-delete-03"></i>
                    </button>
                  </div>
                </td>
              </tr>
              <tr *ngIf="technicalCapabilities.projects && technicalCapabilities.projects.length === 0">
                <td colspan="5">لا يوجد بيانات</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</form>
<app-no-data (onNoDataButtonClicked)="displaySaveTechnicalCapabilitiesRequirementsComponent()" [showCompleteBtn]="canUpdate" *ngIf="!technicalCapabilities"></app-no-data>
