<form [formGroup]="nationalAddressesForm" id="form-nationalAddressesForm">
    <div class="row align-items-end row-gap-3 mb-3">
    <div class="col-12 col-lg-6">
        <label for="" class="form-label">نوع محل الوساطة</label>
        <div class="col-12">
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio"  [value]="1" id="control-brokerDocumentTypeId"  formControlName="brokerDocumentTypeId">
                <label class="form-check-label" >صك ملكية</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio"  [value]="2" id="control-brokerDocumentTypeId" formControlName="brokerDocumentTypeId">
                <label class="form-check-label">عقد إيجار</label>
            </div>
        </div>
    </div>
    <div class="col-12 col-lg-6">
        <label for="" class="form-label">رقم محل الوساطة
        </label>
        <input type="text" class="form-control" id="control-documentNumber" formControlName="documentNumber">
    </div>
    </div>
    <div class="row align-items-end row-gap-3 mb-3">
        <div class="col-12 col-lg-6">
            <label for="" class="form-label">رقم المبنى</label>
            <input type="text" class="form-control" id="control-buildingNumber" formControlName="buildingNumber">
            <div class="invalid-feedback d-block" *ngIf="controls.buildingNumber?.hasError('required') && showValidation">حقل مطلوب</div>
        </div>
        <div class="col-12 col-lg-6">
            <label for="" class="form-label">اسم الشارع</label>
            <input type="text" class="form-control" id="control-streetName" formControlName="streetName">
            <div class="invalid-feedback d-block" *ngIf="controls.streetName?.hasError('required') && showValidation">حقل مطلوب</div>
        </div>
    </div>

    <div class="row align-items-end row-gap-3 mb-3">
        <div class="col-12 col-lg-6">
            <label for="" class="form-label">اسم الحي</label>
            <input type="text" class="form-control" id="control-neighborhoodName" formControlName="neighborhoodName">
            <div class="invalid-feedback d-block" *ngIf="controls.neighborhoodName?.hasError('required') && showValidation">حقل مطلوب</div>
        </div>
        <div class="col-12 col-lg-6">
            <label for="" class="form-label">الرمز البريدي</label>
            <input type="text" class="form-control" id="control-postalCode" formControlName="postalCode">
            <div class="invalid-feedback d-block" *ngIf="controls.postalCode?.hasError('required') && showValidation">حقل مطلوب</div>
        </div>
    </div>

    <div class="row align-items-end row-gap-3 mb-3">
        <div class="col-12 col-lg-6">
            <label for="" class="form-label">رقم الوحدة</label>
            <input type="text" class="form-control" id="control-unitNumber" formControlName="unitNumber">
            <div class="invalid-feedback d-block" *ngIf="controls.unitNumber?.hasError('required') && showValidation">حقل مطلوب</div>
        </div>
        <div class="col-12 col-lg-6">
            <label for="" class="form-label">الرمز الإضافي</label>
            <input type="text" class="form-control" id="control-additionalNumber" formControlName="additionalNumber">
        </div>
    </div>

    <div class="row align-items-end row-gap-3 mb-3">
        <div class="col-12 col-lg-6">
            <label for="" class="form-label">اسم المنطقة</label>
            <select class="form-select" formControlName="areasId" id="control-areasId">
                <option label="-- اختار اسم المنطقة --"></option>
                <option *ngFor="let area of areasDropDownList" [value]="area.id">{{area.areaName}}</option>
            </select>
            <div class="invalid-feedback d-block" *ngIf="controls.areasId?.hasError('required') && showValidation">حقل مطلوب</div>
        </div>
        <div class="col-12 col-lg-6">
            <label for="" class="form-label">اسم المدينة</label>
            <select class="form-select" formControlName="citiesId" id="control-citiesId">
                <option  label="-- اختار اسم المدينة --"></option>
                <option *ngFor="let city of citiesDropDownList" [value]="city.id">{{city.cityName}}</option>
            </select>
            <div class="invalid-feedback d-block" *ngIf="controls.citiesId?.hasError('required') && showValidation">حقل مطلوب</div>
        </div>

    </div>


    <!-- <div mat-dialog-actions align="end">
        <button type="button" mat-flat-button color="primary" (click)="save()" [disabled]="nationalAddressesForm.invalid">حفظ البيانات</button>
    </div> -->
</form>
