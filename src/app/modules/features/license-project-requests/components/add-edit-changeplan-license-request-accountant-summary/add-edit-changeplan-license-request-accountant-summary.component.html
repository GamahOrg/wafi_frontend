<form class="d-flex flex-column h-100" [formGroup]="changePlanForCharteredAccountantForm"
id="form-licenseProjectProblemLogForm">
<div class="tab-data-section bg-white p-5">
  <div class="row mb-3">
  
  <div class="col-12 col-lg-6">
    <div class="form-group mb-4">
      <label class="form-label">التكاليف الإجمالية للمشروع (غير شاملة ثمن الأرض) مُحدثة لتاريخ الطلب</label>
      <input type="number" id="control-totalProjectCosts" class="form-control" formControlName="totalProjectCosts">
      <div class="invalid-feedback d-block" *ngIf="controls.totalProjectCosts?.hasError('required') && showValidation">
        حقل مطلوب
      </div>
  
    </div>
    
  </div> 
  <div class="col-12 col-lg-6">
    <div class="form-group mb-4">
      <label class="form-label">رصيد حساب الضمان</label>
      <input type="number" id="control-escrowAccountBalance" class="form-control" formControlName="escrowAccountBalance">
      <div class="invalid-feedback d-block" *ngIf="controls.escrowAccountBalance?.hasError('required') && showValidation">
        حقل مطلوب
      </div>
  
    </div>
  </div> 
  <div class="col-12 col-lg-6">
    <div class="form-group mb-4">
<div class="page-content">
    <div class="form-check">
        <input class="form-check-input"
               type="checkbox" id="control-isProjectStartedCharteredAccountant"
               formControlName="isProjectStartedCharteredAccountant" />
        <label class="form-check-label"
               for="isProjectStartedCharteredAccountant">
              لم يتم البدأ في المشروع
        </label>
    </div>

</div>
</div>
</div>
  <div class="col-12 col-lg-12" *ngIf="!controls.isProjectStartedCharteredAccountant.value">
    <div class="form-group mb-4">
      <div class="key">آخرتقرير مالي</div>
      <div class="value">
        <span class="icon material-icons-outlined">content_copy</span>
        <a *ngIf="licenseProjectRequestChangePlanFull && licenseProjectRequestChangePlanFull.lastFinancialReport" id="link-buyersApprovalLetterFile"
          [href]="baseUrl +licenseProjectRequestChangePlanFull.lastFinancialReport.filePath" target="_blank">
          {{licenseProjectRequestChangePlanFull.lastFinancialReport.fileDescription}}</a>
      </div>
      <app-file-uploader [data]="singleFilesUploaderData"
        (fileUploaded)="onExistLastFinancialReportFilesUploaded($event)"></app-file-uploader>
      <div class="invalid-feedback d-block"
        *ngIf="showValidation && !controls.isProjectStartedCharteredAccountant.value">
        حقل مطلوب
      </div>
    </div>
  </div>
  <div class="col-12 col-lg-6">
    <div class="form-group mb-4">
<div class="page-content">
    <div class="form-check">
        <input class="form-check-input"
               type="checkbox" id="control-isThereUnitsSold"
               formControlName="isThereUnitsSold" />
        <label class="form-check-label"
               for="isThereUnitsSold">
               لا يوجد وحدات مباعة
        </label>
    </div>

</div>
</div>
</div>
  <div class="col-12 col-lg-12" *ngIf="!controls.isThereUnitsSold.value">
    <div class="form-group mb-4">
      <div class="key">قائمة الوحدات المباعة</div>
      <div class="value">
        <span class="icon material-icons-outlined">content_copy</span>
        <a *ngIf="licenseProjectRequestChangePlanFull && licenseProjectRequestChangePlanFull.soldUnitsAttachment" id="link-approvalLetterForStartEndDate"
          [href]="baseUrl +licenseProjectRequestChangePlanFull.soldUnitsAttachment.filePath" target="_blank">
          {{licenseProjectRequestChangePlanFull.soldUnitsAttachment.fileDescription}}</a>
      </div>
      <app-file-uploader [data]="singleFilesUploaderData"
        (fileUploaded)="onExistSoldUnitsAttachmentFilesUploaded($event)"></app-file-uploader>
      <div class="invalid-feedback d-block"
        *ngIf="showValidation && !controls.isThereUnitsSold.value">
        حقل مطلوب
      </div>
    </div>
  </div>
</div> 
</div>
</form>
