  <div class="tab-data-section bg-white p-5">
    <div class="row row-gap-4">
      <div class="col-12 col-lg-6">
        <div class="key">نسبة انجاز المشروع</div>
        <div class="value">{{ projectDetails?.achievementRate }}</div>
      </div>
      <div class="col-12 col-lg-6">
        <div class="key">اخر تقرير هندسي</div>
        <a
          *ngIf="projectDetails?.lastEngineeringReport != null"
          [href]="baseUrl + projectDetails?.lastEngineeringReport?.filePath"
          id="link-lastEngineeringReportFile"
          target="_blank"
        >
          {{ projectDetails?.lastEngineeringReport?.fileDescription }}
        </a>
      </div>
    </div>
  </div>
