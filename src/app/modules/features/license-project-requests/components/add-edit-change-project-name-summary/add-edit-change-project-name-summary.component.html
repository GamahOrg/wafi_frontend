<div class="card">

    <div class="card-header">
      <h6 class="card-title"*ngIf="!isEditMode">طلب تغيير اسم المشروع أو الشركة المرخص</h6>
    </div>
  
    <div class="card-body">
      <form class="d-flex flex-column h-100" [formGroup]="changeLicenseProjectNameForm"
        id="form-changeLicenseProjectNameForm">
        <div class="tab-data-section bg-white p-5">
          <div class="row mb-3">
            <div class="col-12 col-lg-6">
              <div class="form-group mb-4">
                <label class="key">الأسم الجديد</label>
                <input type="text" id="control-projectName" class="form-control"
                  formControlName="projectName" placeholder="الأسم الجديد">
                <div class="invalid-feedback d-block"
                  *ngIf="controls.projectName?.hasError('required') && showValidation">
                  حقل مطلوب
                </div>
  
              </div>
            </div>
           
             <div class="row mb-3">
              <div class="col-12 col-lg-6">
                <div class="form-group mb-4">
                  <div class="value">
                    <span class="icon material-icons-outlined">content_copy</span>
                    <div class="key">نموذج الطلب، موضحاً به أسباب طلب التغيير</div>
                  </div>
                  <app-file-uploader [data]="singleFilesUploaderData"
                    (fileUploaded)="onExistApplicationFormFilesUploaded($event)"></app-file-uploader>
                  <div class="invalid-feedback d-block" *ngIf="showValidation && !applicationFormFileId">
                    حقل مطلوب
                  </div>
                </div>
              </div>
  
              <div class="col-12 col-lg-6">
                <div class="form-group mb-4">
                  <div class="value">
                    <span class="icon material-icons-outlined">content_copy</span>
                    <div class="key">نموذج عقد البيع/التأجير متضمناً الاسم الجديد للمشروع</div>
                  </div>
                  <app-file-uploader [data]="singleFilesUploaderData"
                    (fileUploaded)="onExistSalesOrRentalContractFilesUploaded($event)"></app-file-uploader>
                  <div class="invalid-feedback d-block" *ngIf="showValidation && !salesOrRentalContractId">
                    حقل مطلوب
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
