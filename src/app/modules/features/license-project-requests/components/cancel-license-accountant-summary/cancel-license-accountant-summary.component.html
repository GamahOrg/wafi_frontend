<div class="tab-data-header">
  <i class="icon hgi hgi-stroke hgi-profile"></i>
  <h6 class="title">
    البيانات من المحاسب القانونى (يتم ادخال البيانات من قبل المحاسب القانونى)
  </h6>

  <button
    *ngIf="showButton"
    (click)="openClearanceAccountDialog()"
    class="opposite-title btn btn-outline-primary"
  >
    <span class="material-icons">edit</span>
  </button>
</div>

<div class="tab-data-section bg-white p-5">
  <div class="row row-gap-4">
    <div class="col-12 col-lg-6">
      <div class="key">رصيد حساب الضمان</div>
      <div class="value">{{ projectDetails.escrowAccountBalance }}</div>
    </div>
    <div class="col-12 col-lg-6">
      <div class="key">اخر تقرير مالي</div>
      <span *ngIf="projectDetails.lastEngineeringReport != null"

        class="delete"
        (click)="deletFile(projectDetails.lastFinancialReport?.id)"
        ><i class="material-icons text-danger">close</i></span
      >
      <span class="icon material-icons-outlined">content_copy</span>

      <a
        *ngIf="projectDetails.lastFinancialReport != null"
        [href]="baseUrl + projectDetails.lastFinancialReport.filePath"
        id="link-lastFinancialReport"
        target="_blank"
      >
        {{ projectDetails.lastFinancialReport.fileDescription }}
      </a>
    </div>
    <div class="col-12 col-lg-6">
      <div class="key">قائمة بالوحدات عقارية المباعة</div>
      <div
        *ngFor="
          let file of projectDetails.licenseProjectSoldUnitAttachmentFiles
        "
      >
        <span class="delete" (click)="deletFile(file?.id)"
          ><i class="material-icons text-danger">close</i></span
        >
        <span class="icon material-icons-outlined">content_copy</span>

        <a
          *ngIf="projectDetails.licenseProjectSoldUnitAttachmentFiles != null"
          [href]="baseUrl + file.filePath"
          id="link-licenseProjectSoldUnitAttachmentFiles"
          target="_blank"
        >
          {{ file.fileDescription }}
        </a>
      </div>
    </div>
  </div>
</div>
