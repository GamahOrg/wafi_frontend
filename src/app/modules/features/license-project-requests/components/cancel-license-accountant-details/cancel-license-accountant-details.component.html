  <div class="tab-data-section bg-white p-5">
    <div class="row row-gap-4">
      <div class="col-12 col-lg-6">
        <div class="key">رصيد حساب الضمان</div>
        <div class="value">{{ projectDetails.escrowAccountBalance | number:'1.2-2' }}</div>
      </div>
      <div class="col-12 col-lg-6">
        <div class="key">اخر تقرير مالي</div>
        <a
          *ngIf="projectDetails.lastFinancialReport != null"
          [href]="baseUrl + projectDetails.lastFinancialReport.filePath"
          id="link-lastFinancialReport"
          target="_blank"
        >
          {{ projectDetails.lastFinancialReport.fileDescription }}
        </a>
      </div>
      <div class="col-12 col-lg-6">
        <div class="key">قائمة بالوحدات عقارية المباعة</div>
        <div
          *ngFor="
            let file of projectDetails.licenseProjectSoldUnitAttachmentFiles
          "
        >
          <a
            *ngIf="projectDetails.licenseProjectSoldUnitAttachmentFiles != null"
            [href]="baseUrl + file.filePath"
            id="link-licenseProjectSoldUnitAttachmentFiles"
            target="_blank"
          >
            {{ file.fileDescription }}
          </a>
        </div>
      </div>
    </div>
  </div>
