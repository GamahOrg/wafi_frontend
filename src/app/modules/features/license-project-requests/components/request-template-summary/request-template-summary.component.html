<div class="tab-data-header">
    <i class="icon hgi hgi-stroke hgi-profile"></i>
    <h6 class="title">بيانات الطلب</h6>
  
    <button
      *ngIf="showButton"
      class="opposite-title btn btn-outline-primary"
      (click)="openDialog()"
    >
      <span class="material-icons">edit</span>
    </button>
  </div>
  <div class="tab-data-section bg-white p-5">
    <div class="col-12 col-lg-6">
      <div class="key">اسم المشروع</div>
      <div class="value">
        {{ changeRequestDetails && changeRequestDetails[0].header.projectName }}
      </div>
    </div>
    <br>
    <div class="row row-gap-4">  
      <div class="col-12 col-lg-6" *ngFor="let changeRequestDetail of changeRequestDetails">
        <div class="key">{{changeRequestDetail.licenseProjectRequestTemplateFile.displayName}}</div>
        <div class="value">
          <a
            [href]="baseUrl + changeRequestDetail?.file?.filePath"
            target="_blank"
          >
            {{ changeRequestDetail?.file?.fileDescription }}
          </a>
        </div>
      </div>
    </div>
  </div>
