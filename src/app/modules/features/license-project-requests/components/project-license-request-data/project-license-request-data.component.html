
<ng-container *ngIf="selectedRequest && selectedRequest.licenseProjectRequestTypeId" [ngSwitch]="selectedRequest.licenseProjectRequestTypeId">
  
  <app-cancel-license-main-data-details *ngSwitchCase="licenseProjectRequestTypeEnum.CancelLicense"></app-cancel-license-main-data-details>
  <app-reactivaite-license-main-data-details *ngSwitchCase="licenseProjectRequestTypeEnum.ReActivateLicense"></app-reactivaite-license-main-data-details>
  <app-changeplan-license-request-main-data-details *ngSwitchCase="licenseProjectRequestTypeEnum.ChangePlan"></app-changeplan-license-request-main-data-details>
  <app-change-engineer-main-data-details *ngSwitchCase="licenseProjectRequestTypeEnum.ChangeEngineering"></app-change-engineer-main-data-details>
  <app-withdraw-surplus-before-project-end-request-main-data-details *ngSwitchCase="licenseProjectRequestTypeEnum.WithdrawSurplusBeforeProjectEnd"></app-withdraw-surplus-before-project-end-request-main-data-details>
  <app-change-license-project-space-or-units-reques-main-data-details *ngSwitchCase="licenseProjectRequestTypeEnum.IncreaseOrDecreaseUnitsNumberOrProjectArea"></app-change-license-project-space-or-units-reques-main-data-details>
  <app-change-license-project-buyer-or-tenant-contract-request-main-data-details *ngSwitchCase="licenseProjectRequestTypeEnum.ChangeApprovedBuyerOrTenantContractsOfProject"></app-change-license-project-buyer-or-tenant-contract-request-main-data-details>
  <app-change-project-name-main-data-details *ngSwitchCase="licenseProjectRequestTypeEnum.ChangeProjectName"></app-change-project-name-main-data-details>
  <app-adding-delegator-main-data-details *ngSwitchCase="licenseProjectRequestTypeEnum.AddingDelegator"></app-adding-delegator-main-data-details>
  <app-removing-delegator-main-data-details *ngSwitchCase="licenseProjectRequestTypeEnum.RemovingDelegator"></app-removing-delegator-main-data-details>
  <app-change-or-add-license-project-unit-model-request-main-data-details *ngSwitchCase="licenseProjectRequestTypeEnum.ChangeOrAddLicenseProjectUnitModel"></app-change-or-add-license-project-unit-model-request-main-data-details>
  <app-change-chartered-accountant-details *ngSwitchCase="licenseProjectRequestTypeEnum.ChangeAccountant"></app-change-chartered-accountant-details>
  <app-change-account-keeper-request-details *ngSwitchCase="licenseProjectRequestTypeEnum.ChangeAccountKeeper"></app-change-account-keeper-request-details>
  <app-change-parties-agreement-request-details *ngSwitchCase="licenseProjectRequestTypeEnum.ChangePartiesAgreement"></app-change-parties-agreement-request-details>
  <app-transfer-amounts-between-subaccounts-in-escrow-account-details *ngSwitchCase="licenseProjectRequestTypeEnum.TransferAmountsBetweenSubAccountsInEscrowAccount"></app-transfer-amounts-between-subaccounts-in-escrow-account-details>
  <app-objection-to-supervision-and-followup-costs-request-details *ngSwitchCase="licenseProjectRequestTypeEnum.ObjectionToSupervisionAndFollowUpCosts"></app-objection-to-supervision-and-followup-costs-request-details>
  <app-lifting-the-mark-on-the-property-title-deed-request-details *ngSwitchCase="licenseProjectRequestTypeEnum.LiftingTheMarkOnThePropertyTitleDeed"></app-lifting-the-mark-on-the-property-title-deed-request-details>
  <app-request-template-details *ngSwitchDefault></app-request-template-details>

</ng-container>
