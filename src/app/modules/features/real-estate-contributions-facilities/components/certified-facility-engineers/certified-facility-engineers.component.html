<div class="tab-data-header">
    <i class="icon hgi hgi-stroke hgi-profile"></i>
    <h6 class="title">{{ pageTitle }}</h6>

    <button class="opposite-title btn btn-outline-primary" (click)="openDialog('')"><span class="material-icons">add</span></button>
</div>

<div class="tab-data-section">
    <div class="table-responsive">
        <table class="table table-light" *ngIf="models && models.length>0">
            <thead>
                <tr>
                    <th>اسم الموظف</th>
                    <th>رقم الهوية</th>
                    <th>رقم العضوية</th>
                    <th>حاصل علي تدريب</th>
                    <th class="w-25"></th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let eng of models">
                    <td>{{eng.engineerName}}</td>
                    <td>{{eng.identityNumber}}</td>
                    <td>{{eng.membershipNumber}}</td>
                    <td>{{ eng.hasCourses ? 'نعم' : 'لا' }}</td>
                    <td>
                        <div class="d-flex align-items-center justify-content-end column-gap-2">
                         <button mat-icon-button color="warn" (click)="delete(eng.id)"><mat-icon>delete</mat-icon></button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
