<ng-template #noData>
  <app-no-data [showCompleteBtn]="false" [showTitle]="true" title="لا توجد بيانات" text="لا توجد بيانات محاسبي المكتب المعتمدين"></app-no-data>
</ng-template>

<ng-container *ngIf="certifiedEngineers && certifiedEngineers.length > 0; else noData">
  <div class="table-responsive">
    <table class="table table-light">
      <thead>
        <tr>
          <th>الاسم</th>
          <th>رقم الهوية</th>
          <th>رقم العضوية</th>
          <th>حاصل على تدريب</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let eng of certifiedEngineers">
          <td>{{ eng?.engineerName}}</td>
          <td>{{ eng?.identityNumber }}</td>
          <td>{{ eng?.membershipNumber }}</td>
          <td>{{ eng?.hasCourses ? 'نعم' : 'لا'}}</td>
        </tr>
      </tbody>
    </table>
  </div>
</ng-container>
