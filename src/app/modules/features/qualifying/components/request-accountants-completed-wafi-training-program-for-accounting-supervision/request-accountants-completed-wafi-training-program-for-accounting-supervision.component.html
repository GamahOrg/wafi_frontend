<div class="tab-data-section">
  <div class="table-responsive">
    <table
      class="table table-light mb-3"
      *ngIf="
        QualificationQualificatedAccountants &&
        QualificationQualificatedAccountants.length > 0
      "
    >
      <thead>
        <tr>
          <th>اسم المحاسب</th>
          <th>شهادة التدريب</th>
          <th class="w-25"></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let acc of QualificationQualificatedAccountants">
          <td>{{ acc?.qualificationCertifiedEngineer?.engineerName }}</td>
          <td>
            <div class="value">
              <span class="icon material-icons-outlined">content_copy</span>
              <a [href]="acc?.trainingCertificateFile?.filePath" target="_blank">
                {{ acc?.trainingCertificateFile?.fileDescription }}</a
              >
            </div>
          </td>
          <td>
            <div
              class="d-flex align-items-center justify-content-end column-gap-2"
            ></div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
