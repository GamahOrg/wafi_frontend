<app-no-data *ngIf="!technicalCapabilities" [showTitle]="false" [text]="'لا يوجد مشاريع'" [useTitleClass]="true" [showCompleteBtn]="false">
</app-no-data>

<ng-container *ngIf="technicalCapabilities">
  <h6 class="mb-3">بيانات المشروع</h6>

  <div class="table-responsive" *ngIf="technicalCapabilities.isPreviousExperienceExist">
    <table class="table table-light">
      <thead>
        <tr>
          <th>اسم المشروع</th>
          <th>اسم المالك</th>
          <th>التصنيف الأساسي</th>
          <th>التصنيف الفرعي</th>
          <th>نوع المشروع</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let project of technicalCapabilities.projects">
          <td>{{ project.projectName }}</td>
          <td>{{ project.projectOwner }}</td>
          <td>{{ project.projectCategory?.categoryName }}</td>
          <td>{{ project.projectSubCategory?.subCategoryName }}</td>
          <td>
            <span *ngFor="let type of project.projectsProjectTypes; let last = last">
              {{ type.projectType.typeName }}<span *ngIf="!last"> , </span>
            </span>
          </td>
        </tr>
        <tr *ngIf="technicalCapabilities.projects && technicalCapabilities.projects.length === 0">
          <td colspan="5">لا يوجد بيانات</td>
        </tr>
      </tbody>
    </table>
  </div>
</ng-container>
