<ng-container>

  <form class="d-flex flex-column h-100" [formGroup]="projectBasicDataForm" id="form-projectBasicDataForm">
    <div class="tab-data-header">
      <i class="icon hgi hgi-stroke hgi-profile"></i>
      <h6 class="title">{{ localization.title }}</h6>
    </div>
    <div class="tab-data-section">
      <div class="row row-gap-3">

        <div class="col-12 col-lg-6">
          <div class="form-group">
            <label class="form-label">{{ localization.name }}</label>
            <input type="text" id="control-name" placeholder="{{ localization.name }}" class="form-control" formControlName="name" [disabled]="true" [readonly]="true" />
          </div>
        </div>

        <div class="col-12 col-lg-6">
          <div class="form-group">
            <label class="form-label">{{ localization.typeId }}</label>
            <select class="form-select" id="control-typeId" formControlName="typeId" [disabled]="true">
              <option [label]="localization.typeId"></option>
              <option *ngFor="let type of types" [ngValue]="type.id">
                {{ type.name }}
              </option>
            </select>
          </div>
        </div>

        <div class="col-12 col-lg-6">
          <div class="form-group">
            <label class="form-label">{{ localization.categoryId }}</label>
            <select class="form-select" id="control-categoryId" formControlName="categoryId" [disabled]="true">
              <option [label]="localization.categoryId"></option>
              <option *ngFor="let category of categories" [value]="category.id">
                {{ category.categoryName }}
              </option>
            </select>
          </div>
        </div>

        <div class="col-12 col-lg-6">
          <div class="form-group">
            <label class="form-label">{{ localization.subCategoryId }}</label>
            <select class="form-select" id="control-subCategoryId" formControlName="subCategoryId" [disabled]="true">
              <option [label]="localization.subCategoryId"></option>
              <option *ngFor="let subCategory of tempSubCategories" [value]="subCategory.id">
                {{ subCategory.subCategoryName }}
              </option>
            </select>
          </div>
        </div>

        <div class="col-12 col-lg-6">
          <div class="form-group">
            <label class="form-label">{{ localization.licenseNatureType }}</label>
            <select class="form-select" id="control-licenseNatureType" formControlName="licenseProjectNatureTypeId" [disabled]="true">
              <option *ngFor="let licenseNatureType of licenseNatureType" [value]="licenseNatureType.id" [selected]="licenseNatureType.id === licenseNatureTypeEnum.Units">
                {{ licenseNatureType.name }}
              </option>
            </select>

          </div>
        </div>

        <div class="col-12 col-lg-6">
          <div class="form-group">
            <label class="form-label">{{
              localization.licenseProjectScopeId
              }}</label>
            <select class="form-select" id="control-licenseProjectScopeId" formControlName="licenseProjectScopeId" [disabled]="true">
              <option [label]="localization.licenseProjectScopeId"></option>
              <option *ngFor="let scope of licenseProjectScopes" [value]="scope.id">
                {{ scope.name }}
              </option>
            </select>
          </div>
        </div>

        <div class="col-12 col-lg-6">
          <div class="form-group">
            <label class="form-label">{{ localization.startOn }}</label>
            <div class="input-group">
              <input bsDatepicker id="control-startOn" type="text" class="form-control" formControlName="startOn" value="{{ controls.startOn.value | date : 'yyyy-MM-dd' }}" [disabled]="true" [readonly]="true" />
              <span class="input-group-text"><i class="material-icons-outlined">calendar_today</i></span>
            </div>
          </div>
        </div>

        <div class="col-12 col-lg-6">
          <div class="form-group">
            <label class="form-label">{{ localization.endOn }}</label>
            <div class="input-group">
              <input bsDatepicker id="control-endOn" type="text" class="form-control" formControlName="endOn" value="{{ controls.endOn.value | date : 'yyyy-MM-dd' }}" [disabled]="true" [readonly]="true" />
              <span class="input-group-text"><i class="material-icons-outlined">calendar_today</i></span>
            </div>
          </div>
        </div>

        <div class="col-12 col-lg-6">
          <div class="form-group">
            <label class="form-label">{{ localization.HasStarted }}</label>
            <div class="row g-2">
              <div class="col-12 col-lg-6">
                <label class="form-check" for="control-yes">
                  <input class="form-check-input" type="radio" formControlName="isProjectStarted" name="isProjectStarted" id="control-yes" [value]="true" [disabled]="true" [readonly]="true" />
                  <label class="form-check-label">{{ localization.Yes }}</label>
                </label>
              </div>
              <div class="col-12 col-lg-6">
                <label class="form-check" for="control-no">
                  <input class="form-check-input" type="radio" name="isProjectStarted" formControlName="isProjectStarted" id="control-no" [value]="false" [disabled]="true" />
                  <label class="form-check-label">{{ localization.No }}</label>
                </label>
              </div>
            </div>
          </div>
        </div>

        <div class="col-12 col-lg-6" *ngIf="isProjectStarted()">
          <div class="form-group">
            <label class="form-label">{{ localization.achievementRate }}</label>
            <div class="input-group">
              <input type="number" id="control-achievementRate" class="form-control" formControlName="achievementRate" [disabled]="true" [readonly]="true" />
              <span class="input-group-text"><i class="material-icons-outlined">percent</i></span>
            </div>
          </div>
        </div>

        <div class="col-12 col-lg-12" *ngIf="isProjectStarted()">
          <div class="form-group">
            <label class="form-label">{{
              localization.engineeringConsultantReportFileId
              }}</label>
            <div class="col-12 col-lg-12" *ngIf="
                projectBasicData &&
                projectBasicData.engineeringConsultantReportFile
              ">
              <a [href]="
                  baseUrl +
                  projectBasicData.engineeringConsultantReportFile.filePath
                " id="link-engineeringConsultantReportFile" target="_blank">
                {{
                projectBasicData.engineeringConsultantReportFile
                .fileDescription
                }}</a>
            </div>
            <div class="col-12 col-lg-12" *ngIf="
                !projectBasicData ||
                !projectBasicData.engineeringConsultantReportFile
              ">
              <p class="text-muted">لا يوجد ملف مرفق</p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- <app-next-and-previus-buttons></app-next-and-previus-buttons> -->
  </form>
</ng-container>
