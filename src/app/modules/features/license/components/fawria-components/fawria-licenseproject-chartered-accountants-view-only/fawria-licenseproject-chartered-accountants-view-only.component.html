<ng-container *ngIf="form" [formGroup]="form">
  <div class="tab-data-header">
    <i class="icon hgi hgi-stroke hgi-profile"></i>
    <h6 class="title">
      {{ localizations.CharteredAccountantTitle }}
    </h6>
  </div>

  <div class="tab-data-section">
    <div class="row row-gap-4">
      <div class="col-xl-6">
        <div class="form-group">
          <label for="entity700Number" class="form-label">
            {{ localizations.CharteredAccountant }}
          </label>
          <div class="input-group">
            <input
              id="entity700Number"
              name="entity700Number"
              type="text"
              class="form-control"
              [ngClass]="{ 'is-invalid': errorMessage }"
              formControlName="entity700Number"
              [disabled]="true"
              [readonly]="true"
            />
          </div>
        </div>
      </div>
    </div>
  </div>

  <ng-container *ngIf="entity">
    <div class="tab-data-section">
      <div class="row row-gap-4">
        <div class="col-12 col-lg-6">
          <div class="key">
            <i class="icon hgi hgi-stroke hgi-building-06"></i>
            اسم الشركة
          </div>
          <div class="value">
            {{ x.facilityName }}
          </div>
        </div>
      </div>
    </div>

    <div class="tab-data-section">
      <h6 class="title">بيانات اتفاقية المحاسب</h6>

      <div class="row row-gap-4">
        <!-- Monitoring Period -->
        <div class="col-12 col-lg-6">
          <label for="financialReportApprovalPeriodInDays" class="form-label">
            مهلة المصادقة على التقرير المالي
          </label>
          <input
            id="financialReportApprovalPeriodInDays"
            name="financialReportApprovalPeriodInDays"
            type="number"
            class="form-control"
            formControlName="financialReportApprovalPeriodInDays"
            max="30"
            [disabled]="true"
            [readonly]="true"
          />
        </div>

        <!-- Contract Value -->
        <div class="col-12 col-lg-6">
          <label for="contractValue" class="form-label"> قيمة العقد </label>

          <div class="input-group">
            <input
              id="contractValue"
              name="contractValue"
              type="text"
              class="form-control"
              formControlName="contarctValue"
              appNumberFormat
              [disabled]="true"
              [readonly]="true"
            />
            <span class="input-group-text">
              <img
                src="assets/images/general/riyal-icon.svg"
                alt="ريال"
                class="riyal-icon"
              />
            </span>
          </div>
        </div>

        <!-- Payment Monitoring -->
        <div class="col-12 col-lg-6">
          <label for="paymentDeadline" class="form-label"> مهلة السداد </label>

          <input
            id="paymentDeadline"
            name="paymentDeadline"
            type="text"
            class="form-control"
            formControlName="paymentDeadline"
            [disabled]="true"
            [readonly]="true"
          />
        </div>

        <!-- Authorized Signatories -->
        <div class="col-12 col-lg-6">
          <label class="form-label"> المفوضين بالتوقيع على وثائق الصرف </label>

          <div
            class="form-control d-flex flex-wrap gap-1"
            style="min-height: 38px"
          >
            <ng-container
              *ngIf="getSelectedSignatories().length; else noDelegators"
            >
              <span
                class="badge bg-light text-dark border"
                *ngFor="let d of getSelectedSignatories()"
              >
                {{ d.fullName }}
              </span>
            </ng-container>

            <ng-template #noDelegators>
              <span class="text-muted">لا يوجد مفوضين</span>
            </ng-template>
          </div>

          <!-- Chips -->
          <div
            class="d-flex flex-wrap align-items-center gap-2 mt-2"
            *ngIf="getSelectedSignatories().length > 0"
          >
            <div class="chip" *ngFor="let s of getSelectedSignatories()">
              {{ s.fullName }}
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Payment Data Section -->
    <div class="tab-data-section">
      <h6 class="title">{{ localizations.PaymentData }}</h6>

      <div class="table-responsive">
        <table class="table table-light">
          <thead>
            <tr>
              <th scope="col">البند</th>
              <th scope="col">الكمية</th>
              <th scope="col">السعر للوحدة</th>
              <th scope="col">الوصف</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of paymentTableData; let i = index">
              <td>
                <input
                  type="text"
                  class="form-control table-input"
                  [(ngModel)]="item.item"
                  [ngModelOptions]="{ standalone: true }"
                  [disabled]="true"
                  [readonly]="true"
                />
              </td>
              <td>
                <input
                  type="number"
                  class="form-control table-input"
                  [(ngModel)]="item.quantity"
                  [ngModelOptions]="{ standalone: true }"
                  [disabled]="true"
                  [readonly]="true"
                />
              </td>
              <td>
                <div class="input-group">
                  <input
                    type="text"
                    class="form-control table-input"
                    [(ngModel)]="item.unitPrice"
                    appNumberFormat
                    [ngModelOptions]="{ standalone: true }"
                    [disabled]="true"
                    [readonly]="true"
                  />
                  <span class="input-group-text">
                    <img
                      src="assets/images/general/riyal-icon.svg"
                      alt="ريال"
                      class="riyal-icon"
                    />
                  </span>
                </div>
              </td>
              <td>
                <input
                  type="text"
                  class="form-control table-input"
                  [(ngModel)]="item.description"
                  [ngModelOptions]="{ standalone: true }"
                  [disabled]="true"
                  [readonly]="true"
                />
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </ng-container>
</ng-container>

<div class="mt-3" *ngIf="entity">
  <app-license-project-parties-additional-terms-view-only
    [TermsPartType]="TermsPartType.Accountant"
  ></app-license-project-parties-additional-terms-view-only>
</div>
