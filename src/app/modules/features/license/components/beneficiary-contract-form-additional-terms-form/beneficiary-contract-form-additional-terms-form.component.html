<ng-container>
    <form class="d-flex flex-column h-100" id="form-addingZoneForm"
          [formGroup]="beneficiaryContractFormAdditionalTermsForm">

        <div class="tab-data-section">
            <div class="row mb-3">
                <div class="col-12 col-lg-6">
                    <div class="form-group mb-4">
                        <label class="form-label">بند {{maxItemNumber}}</label>
                    </div>
                </div>

                <div class="col-12 col-lg-12">
                    <div class="form-group mb-4">
                        <label class="form-label">{{localization.itemTitle}}</label>
                        <input type="text"  id="control-itemText"
                               placeholder="{{localization.itemTitlePlaceholder}}"
                               class="form-control"
                               formControlName="itemTitle"/>
                        <mat-error *ngIf="controls.itemTitle?.hasError('required') && showValidation">{{localization.requiredErrorMsg}}</mat-error>
                    </div>
                </div>
                <div class="col-12 col-lg-12">
                    <div class="form-group mb-4">
                        <label class="form-label">{{localization.itemText}}</label>
                        <textarea type="text"  id="control-itemText"
                               placeholder="{{localization.itemTextPlaceholder}}"
                               class="form-control"
                               formControlName="itemText"></textarea>
                        <mat-error *ngIf="controls.itemText?.hasError('required') && showValidation">{{localization.requiredErrorMsg}}</mat-error>
                    </div>
                </div>


                <!-- Dynamic Additional Terms Section -->
                <div class="col-12" formArrayName="additionalTerms">
                    <h6 class="mb-3">البنود الإضافية</h6>
                    
                    <!-- Additional Terms List -->
                    <div *ngFor="let additionalTerm of additionalTermsArray.controls; let i = index" 
                         [formGroupName]="i" 
                         class="mb-3">
                        <div class="card">
                            <div class="card-body">
                                <!-- <div class="d-flex justify-content-between align-items-start mb-3"> -->
                                <div class="d-flex justify-content-end align-items-end mb-3">
                                    <!-- <h6 class="card-title mb-0">نص البند الإضافي {{maxItemNumber}}.{{i + 1}}</h6> -->
                                    <button type="button" 
                                            class="btn btn-danger btn-sm"
                                            (click)="removeAdditionalTerm(i)">
                                        <i class="hgi hgi-stroke hgi-delete-03"></i> {{localization.remove}}
                                    </button>
                                </div>
                                
                                <div class="form-group">
                                    <label class="form-label">{{localization.additionalTermText}}</label>
                                    <textarea class="form-control"
                                              [id]="'additional-term-' + i"
                                              [placeholder]="localization.additionalTermTextPlaceholder"
                                              rows="3"
                                              formControlName="itemText"></textarea>
                                    <mat-error *ngIf="getAdditionalTermGroup(i).get('itemText')?.hasError('required') && showValidation">
                                        {{localization.requiredErrorMsg}}
                                    </mat-error>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Empty State Message -->
                    <!-- <div *ngIf="additionalTermsArray.length === 0" class="text-center text-muted py-4">
                        <i class="fa fa-file-text fa-2x mb-2"></i>
                        <p class="mb-0">لم يتم إضافة أي بنود إضافية بعد</p>
                        <small>اضغط على "{{localization.addAdditionalTerm}}" لإضافة بند جديد</small>
                    </div> -->
                    <button type="button"
                            class="btn btn-add-term w-100 mb-3"
                            (click)="addAdditionalTerm()">
                        <i class="hgi hgi-stroke hgi-plus-sign me-2"></i>{{localization.addAdditionalTerm}}
                    </button>

                </div>


                <div class="col-12 col-lg-12">
                    <div class="page-content">
                        <div class="form-check">
                            <input class="form-check-input" id="control-additionalTermsAcknowledgment" type="checkbox"
                                formControlName="additionalTermsAcknowledgment" />
                            <label class="form-check-label" for="additionalTermsAcknowledgment">
                                أقر بعدم إضافة بنود إضافية تتعأرض مع البنود الأساسية للعقد التي تم اعدادها من قبل "البيع على الخارطة"
                                كما تم ذكرها فى نموذج العقد
                            </label>
                        </div>
                
                    </div>
                </div>

            </div>
        </div>
    </form>
</ng-container>
