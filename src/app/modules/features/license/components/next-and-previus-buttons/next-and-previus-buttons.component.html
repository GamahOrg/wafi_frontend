<div class="form-actions">
  <button class="btn btn-outline-primary" (click)="back()" *ngIf="previousBtnIsVisible">
    <span class="icon material-icons">arrow_forward</span>
    {{localization.previous}}
  </button>
  <button class="btn btn-outline-primary" *ngIf="saveAsDraftBtnIsVisible" (click)="saveAsDraft()">
    {{localization.saveAsDraft}}
  </button>
  <button class="btn btn-outline-primary" (click)="next()" *ngIf="nextBtnIsVisible">
    {{localization.next}}
    <span class="icon material-icons">arrow_back</span>
  </button>
   <button class="btn btn-primary" *ngIf="verifyBtnIsVisible" (click)="verify()">
    {{localization.verify}}
  </button>
</div>
