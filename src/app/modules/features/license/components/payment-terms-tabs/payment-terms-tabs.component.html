<div class="payment-terms-tabs-container">
  <!-- Page Header -->
  <div class="page-header">
    <div class="header-content">
      <!-- <button class="btn-back" (click)="goBack()" type="button">
        <i class="material-icons">arrow_forward</i>
      </button> -->
      <h5 class="title">الدفعات والشروط الإضافية</h5>
    </div>
  </div>

  <!-- Tab Navigation -->
  <ul class="nav nav-tabs mb-4" role="tablist">
    <li class="nav-item" *ngFor="let tab of tabs" role="presentation">
      <button
        class="nav-link"
        [class.active]="isTabActive(tab.index)"
        type="button"
        role="tab"
        [attr.aria-selected]="isTabActive(tab.index)"
        (click)="setActiveTab(tab.index)">
        {{ tab.title }}
      </button>
    </li>
  </ul>

  <!-- Tab Content -->
  <div class="tab-content">
    <!-- Business Payment Templates Tab -->
    <div
      class="tab-pane fade"
      [class.show]="isTabActive(1)"
      [class.active]="isTabActive(1)"
      role="tabpanel"
      *ngIf="isTabActive(1)">
      <app-business-payment-templates [isActive]="true" [isNew]="false" [isOpenedWhenComplated]="isOpenedWhenComplated"></app-business-payment-templates>
    </div>

    <!-- Additional Terms Tab -->
    <div
      class="tab-pane fade"
      [class.show]="isTabActive(0)"
      [class.active]="isTabActive(0)"
      role="tabpanel"
      *ngIf="isTabActive(0)">
      <app-beneficiary-contract-form-additional-terms [isActive]="true" [isNew]="false" [isOpenedWhenComplated]="isOpenedWhenComplated"></app-beneficiary-contract-form-additional-terms>
    </div>
  </div>
</div>
