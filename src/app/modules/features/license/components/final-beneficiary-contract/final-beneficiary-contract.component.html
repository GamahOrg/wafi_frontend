<form id="form-sysLicenseBeneficiaryContractForm" [formGroup]="sysLicenseBeneficiaryContractForm">
  <div class="tab-data-header">
    <i class="icon hgi hgi-stroke hgi-profile"></i>
    <h6 class="title">
      {{ 'عقد المستفيد النهائي' }}
    </h6>
  </div>

  <!-- PDF Viewer Container -->
  <div class="tab-data-section">
    <div class="d-flex flex-column gap-4">
      <app-pdf-viewer *ngIf="!isFullscreen" [pdfUrl]="selectedPdfUrl" [isLoading]="isLoadingPdf" [loadError]="pdfLoadError" [retryCallback]="retryGenerateContract" [loadingMessage]="'جاري تحميل العقد'" [loadingDescription]="'يرجى الانتظار بينما يتم تحميل عقد المستفيد النهائي'" [noContentMessage]="'لا يوجد عقد متاح'" [noContentDescription]="'لم يتم العثور على عقد المستفيد النهائي'" [errorMessage]="'حدث خطأ في تحميل العقد'">
      </app-pdf-viewer>

      <!-- Contract Files Section - Hide in fullscreen -->
      <ng-container *ngIf="!isFullscreen">
        <!-- Contract Approval -->
        <label class="form-check" for="beneficiaryContractFormApproval">
          <input type="checkbox" class="form-check-input" formControlName="beneficiaryContractFormApproval" id="beneficiaryContractFormApproval" />
          <label class="form-check-label" for="beneficiaryContractFormApproval">الموافقة على عقد المستفيد النهائي</label>
        </label>
      </ng-container>
    </div>
  </div>

  <!-- Navigation Buttons - Hide in fullscreen -->
  <app-next-and-previus-buttons *ngIf="!isFullscreen"></app-next-and-previus-buttons>
</form>
