<div class="d-flex flex-column h-100">
  <div class="tab-data-header">
    <i class="icon hgi hgi-stroke hgi-profile"></i>
    <h6 class="title">{{localization.title}}</h6>
    <button class="opposite-title btn btn-outline-primary"
            (click)="openDialog()"><span class="material-icons">add</span></button>
  </div>
  <div class="tab-data-section">
    <div class="row row-gap-4"
         *ngIf="detachedUnits && detachedUnits.length>0">
      <div class="col-12 ">
        <div class="table-responsive">
          <table class="table table-light">
            <thead>
              <tr>
                <th>{{localization.subUnitsType}}</th>
                <th>{{localization.subUnitCount}}</th>
                <th>{{localization.actions}}</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let subUnit of detachedUnits; let i = index;">
                <td>{{getSubUnitName(subUnit)}}</td>
                <td>{{subUnit.subUnitCount}}</td>
                <td>
                  <div class="d-flex align-items-center justify-content-end column-gap-2">
                    <button mat-icon-button
                            color="warn"
                            (click)="deleteSubUnit(subUnit.id, i)"><mat-icon>delete</mat-icon></button>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <app-next-and-previus-buttons></app-next-and-previus-buttons>
</div>
