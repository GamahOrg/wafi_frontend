<ng-container *ngIf="validationError?.tabs && validationError?.tabs?.length">
  <div class="my-auto"
       *ngIf="getGeneralErrorTab()">
    <p class="fs-5 text-danger text-center"
       *ngFor="let err of generalErrorTab?.tabErrors">
      {{ err.errorMessage }}
    </p>
  </div>
  <div class="d-flex flex-column gap-2 py-3"
       *ngIf="checkNotGeneralErrorTabsExist()">
    <p class="error-title text-danger">
      {{ 'عذرا لن يتم استكمال طلبك نأمل اكمال بيانات المشروع أولا' }}
    </p>
    <div class="card"
         *ngFor="let tab of tabsComponentList; index as i">
      <div class="card-body" *ngIf="tab.isVisible">
        <div class="icon"><i class="material-icons">list_alt</i></div>
        <div class="info">
          <h6 class="title">{{ tab.title }}</h6>
          <p *ngIf="tab.errNum === 0"
             class="mt-2 opacity-50 status-text">{{ 'جميع البيانات مكتملة' }}</p>
          <ng-container *ngIf="tab.errNum !== 0">
            <p class="mt-2 opacity-50 status-text"
               *ngFor="let errMsg of tab.tabErrors">
              {{errMsg.errorMessage}}
            </p>
          </ng-container>
        </div>
        <div class="symbol">
          <ng-container *ngIf="tab.errNum !== 0">
            <span class="count">{{ tab.errNum }}</span>
            <span class="status-text text-danger">{{ 'غير مكتمل' }}</span>
          </ng-container>
          <ng-container *ngIf="tab.errNum === 0">
            <span class="checked"><i class="material-icons">check</i></span>
            <span class="status-text text-success">{{ 'مكتمل' }}</span>
          </ng-container>
        </div>
      </div>
    </div>
  </div>
</ng-container>
