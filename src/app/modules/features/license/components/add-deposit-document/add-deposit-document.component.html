<form [formGroup]="formGroup">
  <div class="row row-gap-4">

    <div class="col-12 col-lg-6">
      <div class="form-group">
        <label for="mainItemId" class="form-label"><span class="required-star">*</span> المصدر</label>
        <select id="mainItemId" formControlName="mainItemId" class="form-select" (change)="onMainItemChange($event)">
          <option *ngFor="let item of mainItemsDto" [value]="item.id">
            {{ item.name }}
          </option>
        </select>
        <div class="invalid-feedback d-block" *ngIf="(controls.mainItemId?.hasError('required') || controls.mainItemId?.value === 0) && showValidation">حقل مطلوب</div>
        <!--<div class="invalid-feedback d-block" *ngIf="controls.mainItemId?.hasError('required') && showValidation">حقل مطلوب</div>-->
      </div>
    </div>

    <div class="col-12 col-lg-6" *ngIf="showOtherField">
      <div class="form-group">
        <label for="paymentTypeId" class="form-label"><span class="required-star">*</span> ألية الدفع</label>
        <select id="paymentTypeId" formControlName="paymentTypeId" class="form-select" (change)="onLicenseProjectBuyerTypeIdChange($event)">
          <option *ngFor="let item of licenseBaymentType" [value]="item.id">
            {{ item.name }}
          </option>
        </select>
        <div class="invalid-feedback d-block" *ngIf="controls.paymentTypeId?.hasError('required') && showValidation">حقل مطلوب</div>
      </div>
    </div>

    <div class="col-12 col-lg-6" *ngIf="showBankTypes">
      <div class="form-group">
        <label for="bankId" class="form-label"><span class="required-star">*</span> البنوك المرخصة</label>
        <select id="bankId" formControlName="bankId" class="form-select">
          <option *ngFor="let item of banksDto" [value]="item.id">
            {{ item.name }}
          </option>
        </select>
        <div class="invalid-feedback d-block" *ngIf="controls.bankId?.hasError('required') && showValidation">حقل مطلوب</div>
      </div>
    </div>

    <div class="col-12 col-lg-6" *ngIf="showDescriptionField">
      <div class="form-group">
        <label for="mianItemDescription" class="form-label">وصف المصدر</label>
        <input id="mianItemDescription" formControlName="mianItemDescription" type="text" class="form-control" />
      </div>
    </div>

    <div class="col-12 col-lg-6">
      <div class="form-group">
        <label for="referenceNumber" class="form-label"><span class="required-star">*</span> الرقم المرجعى للايداع</label>
        <input id="referenceNumber" formControlName="referenceNumber" type="text" class="form-control" />
        <div class="invalid-feedback d-block" *ngIf=" controls.referenceNumber?.hasError('required') && showValidation">حقل مطلوب</div>
      </div>
    </div>

    <div class="col-12 col-lg-6">
      <div class="form-group">
        <label for="depositDate" class="form-label"><span class="required-star">*</span> تاريخ الإيداع</label>
        <div class="input-group">
          <input bsDatepicker id="control-depositDate" type="text" class="form-control" formControlName="depositDate" value="{{ controls.depositDate.value | date : 'yyyy-MM-dd' }}" />
          <span class="input-group-text"><i class="material-icons-outlined">calendar_today</i></span>
        </div>
        <div class="invalid-feedback d-block" *ngIf="controls.depositDate?.hasError('required') && showValidation">هذا الحقل مطلوب</div>
      </div>
    </div>

    <div class="col-12 col-lg-6">
      <div class="form-group">
        <label class="form-label">رقم الحساب</label>
        <input class="form-control" [value]="licenseProjectAccounts.accountNumber" disabled readonly />
      </div>
    </div>

    <div class="col-12 col-lg-6">
      <div class="form-group">
        <label for="amount" class="form-label"><span class="required-star">*</span> اجمالي مبلغ الايداع</label>
        <input id="amount" formControlName="amount" type="number" class="form-control" (input)="calcAccounts()" />
        <div class="invalid-feedback d-block" *ngIf="(controls.amount?.hasError('required') || controls.amount?.value === 0)  && showValidation">حقل مطلوب</div>
      </div>
    </div>

    <div class="col-12 col-lg-6">
      <div class="form-group">
        <label for="checkNumber" class="form-label"><span class="required-star">*</span> نوع الايداع</label>
        <select class="form-select" formControlName="sysDepositTypeId">
          <option label="اختر نوع الايداع" disabled></option>
          <option *ngFor="let type of sysDepositTypeList" [value]="type.id">
            {{ type.name }}
          </option>
        </select>
        <div class="invalid-feedback d-block" *ngIf="(controls.sysDepositTypeId?.hasError('required') || controls.sysDepositTypeId?.value === 0 ) && showValidation">حقل مطلوب</div>
      </div>
    </div>

    <div class="col-12 col-lg-6">
      <div class="form-group">
        <label for="checkNumber" class="form-label"><span class="required-star">*</span> رقم الحوالة / الشيك</label>
        <input id="checkNumber" formControlName="checkNumber" type="text" class="form-control" />
        <div class="invalid-feedback d-block" *ngIf="controls.checkNumber?.hasError('required') && showValidation">حقل مطلوب</div>
      </div>
    </div>

    <div class="col-12 col-lg-6">
      <div class="form-group">
        <label class="form-label">حساب التكاليف الانشائية</label>
        <input class="form-control" [value]="licenseProjectAccounts.constructionCostsAccountNumber" disabled readonly />
      </div>
    </div>

    <div class="col-12 col-lg-6">
      <div class="form-group">
        <label class="form-label"><span class="required-star">*</span> مبلغ الايداع في حساب التكاليف الانشائية</label>
        <input id="constructionCostsAmount" formControlName="constructionCostsAmount" type="number" class="form-control" [readOnly]="controls.mainItemId.value === licenseProjectDepositDocumentMainItemEnum.collectionFromClients" />
        <div class="invalid-feedback d-block" *ngIf="(controls.constructionCostsAmount?.hasError('required') || controls.constructionCostsAmount?.value === 0) && showValidation">
          حقل مطلوب
        </div>
      </div>
    </div>

    <div class="col-12 col-lg-6">
      <div class="form-group">
        <label for="amount" class="form-label">المبلغ المتوفر في الحساب قبل الايداع</label>
        <input class="form-control" [value]="licenseProjectAccounts.constructionCostsAvailableAmount" disabled readonly />
      </div>
    </div>

    <div class="col-12 col-lg-6">
      <div class="form-group">
        <label for="amount" class="form-label">المبلغ المتوفر في الحساب بعد الايداع</label>
        <input class="form-control" [value]="(licenseProjectAccounts.constructionCostsAvailableAmount) + (controls.constructionCostsAmount.value || 0) | number:'1.2-2'" disabled readonly />
      </div>
    </div>

    <div class="col-12 col-lg-6">
      <div class="form-group">
        <label class="form-label">حساب الادارى والتسويقى</label>
        <input class="form-control" [value]="licenseProjectAccounts.administrativeAndMarketingAccountNumber" disabled readonly />
      </div>
    </div>

    <div class="col-12 col-lg-6">
      <div class="form-group">
        <label for="administrativeAndMarketingAmount" class="form-label"><span class="required-star">*</span> مبلغ الايداع في حساب الاداري والتسويقي </label>
        <input id="administrativeAndMarketingAmount" formControlName="administrativeAndMarketingAmount" type="number" class="form-control" [readOnly]="controls.mainItemId.value === licenseProjectDepositDocumentMainItemEnum.collectionFromClients" />
        <div class="invalid-feedback d-block" *ngIf="(controls.administrativeAndMarketingAmount?.hasError('required') || controls.administrativeAndMarketingAmount?.value === 0) && showValidation">حقل مطلوب</div>
      </div>
    </div>

    <div class="col-12 col-lg-6">
      <div class="form-group">
        <label class="form-label">المبلغ المتوفر في الحساب قبل الايداع</label>
        <input class="form-control" [value]="licenseProjectAccounts.administrativeAndMarketingAvailableAmount" disabled readonly />
      </div>
    </div>

    <div class="col-12 col-lg-6">
      <div class="form-group">
        <label for="amount" class="form-label">المبلغ المتوفر في الحساب بعد الايداع</label>
        <input class="form-control" [value]="(licenseProjectAccounts.administrativeAndMarketingAvailableAmount) + (controls.administrativeAndMarketingAmount.value || 0) | number:'1.2-2'" disabled readonly />
      </div>
    </div>

    <ng-container *ngIf="controls.mainItemId.value === licenseProjectDepositDocumentMainItemEnum.collectionFromClients">
      <div class="col-12 col-lg-6">
        <div class="form-group">
          <label class="form-label">حساب الحفظ</label>
          <input class="form-control" [value]="licenseProjectAccounts.custodyAccountNumber" disabled readonly />
        </div>
      </div>

      <div class="col-12 col-lg-6">
        <div class="form-group">
          <label for="escrowAccountAmount" class="form-label"><span class="required-star">*</span> مبلغ الايداع في حساب الحفظ</label>
          <input id="escrowAccountAmount" formControlName="escrowAccountAmount" type="number" class="form-control" [readOnly]="controls.mainItemId.value === licenseProjectDepositDocumentMainItemEnum.collectionFromClients" />
          <div class="invalid-feedback d-block" *ngIf="controls.escrowAccountAmount?.hasError('required') && showValidation">حقل مطلوب</div>
        </div>
      </div>
    </ng-container>

    <ng-container *ngIf="controls.mainItemId.value === licenseProjectDepositDocumentMainItemEnum.collectionFromClients">
      <div class="col-12 col-lg-6">
        <div class="form-group">
          <label class="form-label">المبلغ المتوفر في الحساب قبل الايداع</label>
          <input class="form-control" [value]="licenseProjectAccounts.custodyAvailableAmount" disabled readonly />
        </div>
      </div>

      <div class="col-12 col-lg-6">
        <div class="form-group">
          <label for="amount" class="form-label">المبلغ المتوفر في الحساب بعد الايداع</label>
          <input class="form-control" [value]="(licenseProjectAccounts.custodyAvailableAmount) + (controls.escrowAccountAmount.value || 0) | number:'1.2-2'" disabled readonly />
        </div>
      </div>
    </ng-container>


    <div class="col-12 col-lg-6" *ngIf="showOtherField">
      <div class="form-group">
        <label for="licenseProjectBuyerId" class="form-label"><span class="required-star">*</span> اسم المشتري</label>
        <select id="licenseProjectBuyer" formControlName="licenseProjectBuyer" class="form-select" [(ngModel)]="selectedBuyer" (change)="onBuyerSelect()">
          <option *ngFor="let buyer of buyerDto" [ngValue]="buyer">
            {{ buyer.name }}
          </option>
        </select>
        <div class="invalid-feedback d-block" *ngIf=" controls.licenseProjectBuyer?.hasError('required') && showValidation">حقل مطلوب</div>
      </div>
    </div>

    <div class="col-12 col-lg-6" *ngIf="showOtherField && showBuyerDetails">
      <div class="form-group">
        <label for="buyerType" class="form-label">سجل المشترين</label>
        <select id="licenseProjectBuyerId" formControlName="licenseProjectBuyerId" class="form-select" (change)="onBuyerTypeSelect($event)">
          <option label="اختر سجل المشترين" disabled></option>
          <option *ngFor="let buyerType of buyerDetailsDto" [value]="buyerType.id">
            {{
            buyerType.licenseProjectBuyerType.id === licenseBuyerTypeEnum.Lands
            ? buyerType.licenseProjectBuyerType.name + " - " + buyerType.blockCode
            : buyerType.licenseProjectBuyerType.name + " - " + buyerType.unitCode
            }}
          </option>
        </select>
      </div>
    </div>

    <div class="col-12 col-lg-6" *ngIf="showOtherField && showBuyerDetails && showBuyerType">
      <div class="form-group">
        <label for="installmentId" class="form-label">الدفعات</label>
        <select id="installmentId" formControlName="installmentId" class="form-select">
          <option label="اختر الدفعات" disabled></option>
          <option *ngFor="let payment of buyerBusinessPaymentInstallementsList" [value]="payment.id">
            {{payment.installmentNumber}}
          </option>
        </select>


      </div>
    </div>

    <div class="col-12 col-lg-6" *ngIf="showOtherField && showBuyerDetails && showBuyerType">
      <div class="form-group">
        <label class="form-label">رقم الهوية</label>
        <input class="form-control" [value]="selectedBuyerType?.nidNumber" disabled readonly />
      </div>
    </div>

    <div class="col-12 col-lg-6" *ngIf="showOtherField && showBuyerDetails && showBuyerType">
      <div class="form-group">
        <label class="form-label">رقم البلوك او العمارة</label>
        <input class="form-control" [value]="selectedBuyerType?.blockCode" disabled readonly />
      </div>
    </div>

    <div class="col-12 col-lg-6" *ngIf="showOtherField && showBuyerDetails && showBuyerType">
      <div class="form-group">
        <label class="form-label">رقم العقد</label>
        <input class="form-control" [value]="selectedBuyerType?.contractNumber" disabled readonly />
      </div>
    </div>

    <!-- <div class="col-12 col-lg-6" *ngIf="showOtherField && showBuyerDetails && showBuyerType">
      <div class="form-group">
        <label for="batchNumber" class="form-label"><span class="required-star">*</span> رقم الدفعة</label>
        <input id="batchNumber" formControlName="batchNumber" type="text" class="form-control" />
        <div class="invalid-feedback d-block" *ngIf="controls.batchNumber?.hasError('required') && showValidation">حقل مطلوب</div>
      </div>
    </div> -->

    <div class="col-12 col-lg-6">
      <div class="form-group">
        <label for="statment" class="form-label"><span class="required-star">*</span> البيان</label>
        <textarea id="statment" formControlName="statment" class="form-control"></textarea>
        <div class="invalid-feedback d-block" *ngIf="controls.statment?.hasError('required') && showValidation">حقل مطلوب</div>
      </div>
    </div>
  </div>
</form>
