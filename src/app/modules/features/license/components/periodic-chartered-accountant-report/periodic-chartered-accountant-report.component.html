<div class="page" *ngIf="!showAddComponant">
  <div class="page-header mb-3" *ngIf="!isViewingDetails">
    <div class="page-title justify-content-between">
      <h6 class="title">قائمة التقارير</h6>
      <button type="button" class="btn btn-primary" (click)="addReport()">إضافة تقرير</button>
    </div>
  </div>
  <app-periodic-chartered-accountant-report-list (viewingDetails)="isViewingDetails = $event"></app-periodic-chartered-accountant-report-list>
</div>

<ng-container *ngIf="showAddComponant">
  <app-add-periodic-chartered-accountant-report (dataEmitter)="receiveData($event)"></app-add-periodic-chartered-accountant-report>
</ng-container>
