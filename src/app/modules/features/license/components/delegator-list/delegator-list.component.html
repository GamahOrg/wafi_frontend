<div class="d-flex flex-column h-100">

  <div class="tab-data-header">
    <div class="icon"><span class="material-icons">list_alt</span></div>
    <h6 class="title">قائمةالمفوضون بالتوقيع على وثيقة الصرف</h6>
    <!-- <button class="edit-icon btn btn-outline-primary" (click)="openDialog()"><span class="material-icons">add</span></button> -->
  </div>

  <form class="d-flex flex-column h-100" [formGroup]="licenseProjectDelegatorForm " id="form-licenseProjectDelegatorForm">
    <div class="tab-data-section">
      <div class="row mb-3">
        <div class="col-12 col-lg-6">
          <div class="form-group mb-4">
            <label class="form-label">اختر مفوض</label>
            <select class="form-select" id="control-delegatorCustomerId" aria-label="Default select example" formControlName="delegatorCustomerId">
              <option selected disabled>اختر مفوض</option>
              <option *ngFor="let customer of subCustomerList" [ngValue]="customer.id">
                {{customer.fullName}}
              </option>
            </select>
            <mat-error *ngIf="controls.delegatorCustomerId?.hasError('required') && showValidation">حقل مطلوب </mat-error>
          </div>
        </div>
        <div class="col-6 col-lg-6">
          <div class="form-group mb-4">
            <div class="key">نموذج التوقيع</div>
            <app-file-uploader [data]="singleFileUploaderData" (fileUploaded)="delegatorSignModelFileUploaded($event)"></app-file-uploader>
          </div>
          <div class="invalid-feedback d-block" *ngIf="controls.signModelFileId?.hasError('required') && showValidation">حقل
            مطلوب
          </div>
        </div>

        <div class="page-content">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="control-delegatorAcknowledgment" formControlName="delegatorAcknowledgment" />
            <label class="form-check-label" for="delegatorAcknowledgment">
              نقر نحن "{{facility?.facilityName}}" قد فوضنا السيد
              "{{customerName}}"
              بالتوقيع على وثيقة الصرف الخاصة بحساب الضمان
              رقم "{{accountKeeper?.accountNumber}}" المفتوح في بنك "{{accountKeeper?.sysBank?.name}}" الخاص
              بهذا المشروع
              وهو المعتمد من قبلنا في مواجهة الهيئة العامة للعقاروجميع الأطراف ذات العلاقة.
            </label>
          </div>
          <div class="invalid-feedback d-block" *ngIf="!controls.delegatorAcknowledgment.value && showValidation">حقل مطلوب
          </div>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-end">
      <button type="submit" class="btn btn-outline-primary" (click)="save()">
        حفظ وإضافة جديد
      </button>
    </div>
    <!-- <button class="edit-icon btn btn-outline-primary"><span class="material-icons">add</span> حفظ وإضافة جديد</button> -->
  </form>

  <div class="tab-data-section mt-3">
    <div class="table-responsive">
      <table class="table table-light" *ngIf="licenseProjectDelegators && licenseProjectDelegators.length>0">
        <thead>
          <tr>
            <th>اسم المفوض </th>
            <th>رقم هوية المفوض</th>
            <th>نموذج التوقيع</th>
            <th>العمليات</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let delegator of licenseProjectDelegators; let i = index;">
            <td>{{delegator.delegatorCustomer?.fullName}}</td>
            <td>{{delegator.delegatorCustomer?.nidnumber}}</td>
            <td>
              <span class="icon material-icons-outlined">content_copy</span>
              <a *ngIf="delegator && delegator.delegatorSignModelFile" target="_blank" [href]="baseUrl + delegator.delegatorSignModelFile.filePath">
                {{delegator.delegatorSignModelFile.fileDescription}}</a>
            </td>

            <td>
              <div class="d-flex align-items-center justify-content-end column-gap-2">
                <button mat-icon-button color="warn" (click)="deleteDelegator(i)"><mat-icon>delete</mat-icon></button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <app-next-and-previus-buttons></app-next-and-previus-buttons>
  
  <!-- <div class="form-actions mt-auto">
        <button class="btn btn-outline-primary"
        (click)="back()">{{localization.previous}}</button>
        <button class="btn btn-outline-primary"
                (click)="next()">{{localization.next}}</button>
    </div> -->
</div>
