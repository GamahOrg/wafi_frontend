<div class="tab-data-header">
  <i class="icon hgi hgi-stroke hgi-profile"></i>
  <h6 class="title">قائمةالمفوضون بالتوقيع على وثيقة الصرف</h6>
</div>

<div class="tab-data-section">
  <form [formGroup]="licenseProjectDelegatorForm " id="form-licenseProjectDelegatorForm">
    <div class="row row-gap-4">
      <div class="col-12 col-lg-6">
        <div class="form-group">
          <label class="form-label"><span class="required-star">*</span> اختر مفوض</label>
          <select class="form-select" id="control-delegatorCustomerId" aria-label="Default select example" formControlName="delegatorCustomerId">
            <option [ngValue]="null" disabled hidden>يرجى الاختيار</option>
            <option *ngFor="let customer of subCustomerList" [ngValue]="customer.id">
              {{customer.fullName}}
            </option>
          </select>
          <mat-error *ngIf="controls.delegatorCustomerId?.hasError('required') && showValidation">حقل مطلوب </mat-error>
        </div>
      </div>
      <div class="col-6 col-lg-6">
        <div class="form-group">
          <label class="form-label"><span class="required-star">*</span> نموذج التوقيع</label>
          <app-file-uploader [data]="singleFileUploaderData" (fileUploaded)="delegatorSignModelFileUploaded($event)"></app-file-uploader>
          <div class="invalid-feedback d-block" *ngIf="controls.signModelFileId?.hasError('required') && showValidation">حقل مطلوب</div>
        </div>
      </div>
      <div class="col-12">
        <div class="form-group">
          <label class="form-check form-check-normal" for="control-delegatorAcknowledgment">
            <input class="form-check-input" type="checkbox" id="control-delegatorAcknowledgment" formControlName="delegatorAcknowledgment" />
            <label class="form-check-label" for="control-delegatorAcknowledgment">
              نقر نحن "{{facility?.facilityName}}" قد فوضنا السيد "{{customerName}}" بالتوقيع على وثيقة الصرف الخاصة بحساب الضمان رقم "{{accountKeeper?.accountNumber}}" المفتوح في بنك "{{accountKeeper?.sysBank?.name}}" الخاص بهذا المشروع
              وهو المعتمد من قبلنا في مواجهة الهيئة العامة للعقاروجميع الأطراف ذات العلاقة.
            </label>
          </label>
          <div class="invalid-feedback d-block" *ngIf="!controls.delegatorAcknowledgment.value && showValidation">حقل مطلوب
          </div>
        </div>
      </div>
      <div class="col-12">
        <div class="d-flex justify-content-end">
          <button type="submit" class="btn btn-outline-primary" (click)="save()">حفظ وإضافة جديد</button>
        </div>
      </div>
    </div>
  </form>
</div>

<div class="tab-data-section" *ngIf="licenseProjectDelegators && licenseProjectDelegators.length>0">
  <div class="table-responsive">
    <table class="table table-light">
      <thead>
        <tr>
          <th>اسم المفوض </th>
          <th>رقم هوية المفوض</th>
          <th>نموذج التوقيع</th>
          <th>العمليات</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let delegator of licenseProjectDelegators; let i = index;">
          <td>{{delegator.delegatorCustomer?.fullName}}</td>
          <td>{{delegator.delegatorCustomer?.nidnumber}}</td>
          <td>
            <span class="icon material-icons-outlined">content_copy</span>
            <a *ngIf="delegator && delegator.delegatorSignModelFile" target="_blank" [href]="baseUrl + delegator.delegatorSignModelFile.filePath">
              {{delegator.delegatorSignModelFile.fileDescription}}</a>
          </td>

          <td>
            <div class="d-flex align-items-center justify-content-end column-gap-2">
              <button mat-icon-button color="warn" (click)="deleteDelegator(i)"><mat-icon>delete</mat-icon></button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<app-next-and-previus-buttons></app-next-and-previus-buttons>
