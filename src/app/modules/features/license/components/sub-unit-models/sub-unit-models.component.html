<div class="tab-data-section"
     *ngIf="selectedSubUnit">
    <div class="tab-data-section-title-subtitle">
        <h6 class="title">
            إجمالي عدد النماذج المضافة
            {{models.length}}

            <button class="btn btn-link"
                    (click)="openDialog(undefined)">
                <span class="material-icons-outlined">add_circle_outline</span>
                إضافة نموذج جديد
            </button>
        </h6>
    </div>

    <div class="table-responsive"
         *ngIf="models && models.length">
        <table class="table table-light">
            <thead>
                <tr>
                    <th>اسم النموذج</th>
                    <!--<th>المساحه الاجماليه</th>
                    <th> مساحة مسطح ابناء</th>-->
                    <th> عدد الوحدات</th>
                    <th> ملفات التصاميم</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let model of models">
                    <td>{{model.name}}</td>
                    <!--<td>{{model.space}}</td>
                    <td>{{model.buildingFlatSpace}}</td>-->
                    <td>{{model.unitsCount}}</td>
                    <td>
                        <div class="value"  *ngFor="let file of model.licenseProjectModelDesignFiles">
                            <span class="icon material-icons-outlined">content_copy</span>
                            <a *ngIf="file && file.designFile"  id="link-file" [href]="baseUrl + file.designFile.filePath" target="_blank">
                                {{file.designFile.fileDescription}}</a>
                        </div>
                    </td>
                    

                    <td>
                        <div class="table-actions">
                            <div class="menu-trigger">
                                <button mat-mini-fab
                                        [matMenuTriggerFor]="tableActions">
                                    <mat-icon>more_vert</mat-icon>
                                </button>
                            </div>
                            <mat-menu #tableActions="matMenu">
                                <button mat-menu-item
                                        (click)="openDialog(model)">
                                    <mat-icon color="primary">edit</mat-icon>
                                    <span>تعديل البيانات</span>
                                </button>
                                <button mat-menu-item
                                        (click)="delete(model.id)">
                                    <mat-icon color="warn">delete</mat-icon>
                                    <span>حذف نموذج</span>
                                </button>
                            </mat-menu>
                        </div>
                        <!-- <div class="d-flex align-items-center justify-content-end column-gap-2">
                            <button mat-icon-button
                                    color="primary"
                                    (click)="openDialog(model)"><mat-icon>edit</mat-icon></button>
                            <button mat-icon-button
                                    color="warn"
                                    (click)="delete(model.id)"><mat-icon>delete</mat-icon></button>
                        </div> -->
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
