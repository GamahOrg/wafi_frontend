
<form class="d-flex flex-column h-100" [formGroup]="addInfrastructureRatesForm" id="form-addInfrastructureRatesForm">

  <div class="tab-data-section">
    <div class="row mb-3">
      
      <div class="col-12 col-lg-6">
        <div class="form-group mb-4">
          <label class="form-label">  مقاول البنية التحتية</label>
          <input type="text" id="control-infrastructureContractor" class="form-control" formControlName="infrastructureContractor"
            placeholder="مقاول البنية التحتية">
          <div class="invalid-feedback d-block" *ngIf="controls.infrastructureContractor?.hasError('required') && showValidation">
            حقل مطلوب
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-6">
      <div class="form-group mb-4">
        <label class="form-label">  استشاري أعمال البنية التحتية</label>
        <input type="text" id="control-infrastructureConsultant" class="form-control" formControlName="infrastructureConsultant"
          placeholder="استشاري أعمال البنية التحتية">
        <div class="invalid-feedback d-block" *ngIf="controls.infrastructureConsultant?.hasError('required') && showValidation">
          حقل مطلوب
        </div>
      </div>
      </div> 

      <div class="col-12 col-lg-6">
      <div class="form-group mb-4">
        <label class="form-label">تكلفة أعمال البنية التحتية </label>
        <input type="text" id="control-infrastructureCost" class="form-control" formControlName="infrastructureCost"
          placeholder="تكلفة أعمال البنية التحتية ">
        <div class="invalid-feedback d-block" *ngIf="controls.infrastructureCost?.hasError('required') && showValidation">
          حقل مطلوب
        </div>
        <mat-error *ngIf="controls.infrastructureCost?.hasError('pattern')">من فضلك قم بأدخال رقم صحيح</mat-error>
      
      </div>
      </div>

    </div>
  </div> 

</form>
