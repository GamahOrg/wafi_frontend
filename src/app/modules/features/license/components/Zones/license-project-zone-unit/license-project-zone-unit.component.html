<form [formGroup]="addEditUnitForm" id="form-addEditUnitForm">
  <div class="row row-gap-4">
    <div class="col-12 col-lg-6">
      <div class="form-group">
        <label for="" class="form-label"><span class="required-star">*</span> {{ localization.UnitType }}</label>
        <div class="row g-2">
          <div class="col-12 col-lg-6" *ngFor="let type of UnitType">
            <label class="form-check" [for]="type.id">
              <input class="form-check-input" type="radio" id="control-unitTypeId" [id]="type.id" [value]="type.id" formControlName="unitTypeId" (change)="onUnitTypeChange(type.id)" [attr.disabled]="isBlockDisabled(type) ? true : null" />
              <label class="form-check-label" [for]="type.id">{{
                type.name
                }}</label>
            </label>
          </div>
        </div>
        <div class="invalid-feedback d-block" *ngIf="controls.unitTypeId.errors?.['required'] && showValidation">
          حقل مطلوب
        </div>
      </div>
    </div>

    <div class="col-12 col-lg-6">
      <div class="form-group">
        <label for="" class="form-label"><span class="required-star">*</span> {{ localization.projectBuildingBlockType }}</label>
        <select class="form-select" id="control-projectBuildingBlockType" aria-label="Default select example" formControlName="buildingBlockTypeId">
          <option [ngValue]="null" disabled hidden>يرجى الاختيار</option>
          <option *ngFor="let item of projectBuildingBlockType" [value]="item.id">
            {{ item.name }}
          </option>
        </select>
        <div class="invalid-feedback d-block" *ngIf="controls.buildingBlockTypeId.errors?.['required'] && showValidation">
          حقل مطلوب
        </div>
      </div>
    </div>

    <div class="col-12 col-lg-6">
      <div class="form-group">
        <label for="" class="form-label"><span class="required-star">*</span> {{ localization.unitCode }}</label>
        <input type="text" class="form-control" id="control-code"  formControlName="code" />
        <div class="invalid-feedback d-block" *ngIf="controls.code.errors?.['required'] && showValidation">
          حقل مطلوب
        </div>
      </div>
    </div>

    <div class="col-12 col-lg-6">
      <div class="form-group">
        <label for="" class="form-label"><span class="required-star">*</span> {{ localization.stageNo }}</label>
        <select class="form-select" id="control-stageNumberId" aria-label="Default select example" formControlName="stageNumberId">
          <option [ngValue]="null" disabled hidden>يرجى الاختيار</option>
          <option *ngFor="let stage of stageNumber" [value]="stage.id">
            {{ stage.name }}
          </option>
        </select>
        <div class="invalid-feedback d-block" *ngIf="controls.stageNumberId.errors?.['required'] && showValidation">
          حقل مطلوب
        </div>
      </div>
    </div>

    <div class="col-12 col-lg-6">
      <div class="form-group">
        <label for="" class="form-label"><span class="required-star">*</span>{{ localization.constructionStartOn }}</label>
        <div class="input-group">
          <input bsDatepicker id="control-constructionStartOn" type="text" class="form-control" formControlName="constructionStartOn"  value="{{
              controls.constructionStartOn.value
                ? (controls.constructionStartOn.value | date : 'yyyy-MM-dd')
                : null
            }}" />
          <span class="input-group-text"><i class="hgi hgi-stroke hgi-calendar-03"></i></span>
        </div>
        <div class="invalid-feedback d-block" *ngIf="controls.constructionStartOn.errors?.['required'] && showValidation">
          حقل مطلوب
        </div>
        <mat-error class="mt-2" *ngIf="
            addEditUnitForm.errors &&
            addEditUnitForm.errors!['dateInvalid'] &&
            showValidation
          ">{{ localization.dateValidator }}</mat-error>
      </div>
    </div>

    <div class="col-12 col-lg-6">
      <div class="form-group">
        <label for="" class="form-label"><span class="required-star">*</span>{{ localization.constructionEndOn }}</label>
        <div class="input-group">
          <input bsDatepicker id="control-constructionEndOn" type="text" class="form-control" formControlName="constructionEndOn"  value="{{
              controls.constructionEndOn.value
                ? (controls.constructionEndOn.value | date : 'yyyy-MM-dd')
                : null
            }}" />
          <span class="input-group-text"><i class="hgi hgi-stroke hgi-calendar-03"></i></span>
        </div>
        <div class="invalid-feedback d-block" *ngIf="controls.constructionEndOn.errors?.['required'] && showValidation">
          حقل مطلوب
        </div>
      </div>
    </div>

    <div class="col-12 col-lg-6">
      <div class="form-group">
        <label for="" class="form-label"><span class="required-star">*</span> {{ localization.deed }}</label>
        <select class="form-select" id="control-licenseProjectDeedId" aria-label="Default select example" formControlName="licenseProjectDeedId">
          <option [ngValue]="null" disabled hidden>يرجى الاختيار</option>
          <option *ngFor="let item of projectDeedsDDLList" [value]="item.id">
            {{ item.name }}
          </option>
        </select>
        <div class="invalid-feedback d-block" *ngIf="controls.licenseProjectDeedId.errors?.['required'] && showValidation">
          حقل مطلوب
        </div>
      </div>
    </div>

    <div class="col-12 col-lg-6">
      <div class="form-group">
        <label for="" class="form-label"><span class="required-star">*</span> {{ localization.designFile }}</label>
        <div class="value m-3" *ngIf="controls.designFileId.value && selectedProjectUnit && selectedProjectUnit.designFile">
          <span class="icon material-icons-outlined">content_copy</span>
          <a [href]="baseUrl + selectedProjectUnit.designFile?.filePath" target="_blank">
            {{selectedProjectUnit.designFile?.fileDescription}}
          </a>
        </div>
        <app-file-uploader (fileUploaded)="onDesignFileUploaded($event)" [data]="singleFileUploaderData"></app-file-uploader>
        <div class="invalid-feedback d-block" *ngIf="controls.designFileId.errors?.['required'] && showValidation">
          حقل مطلوب
        </div>
      </div>
    </div>

  </div>
</form>
