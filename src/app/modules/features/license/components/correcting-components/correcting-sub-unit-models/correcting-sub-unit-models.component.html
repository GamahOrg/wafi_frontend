<ng-container *ngIf="selectedSubUnit">
  <div class="d-flex justify-content-between align-items-center gap-3 mb-4">
    <h6 class="title">إجمالي عدد النماذج المضافة {{models.length}}</h6>
  </div>

  <div class="table-responsive" *ngIf="models && models.length">
    <table class="table table-light">
      <thead>
        <tr>
          <th colspan="2">اسم النموذج</th>
          <th> عدد الوحدات</th>
          <th> ملفات التصاميم</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let model of models">
          <td>{{model.name}}</td>
          <td>
            <span class="tag tag-info">
              {{ model.isPrevious ? 'سابقة' : 'جديدة' }}
            </span>
          </td>
          <td>{{model.unitsCount}}</td>
          <td>
            <div class="value" *ngFor="let file of model.licenseProjectModelDesignFiles">
              <a *ngIf="file && file.designFile" id="link-file" [href]="baseUrl + file.designFile.filePath" target="_blank">
                {{file.designFile.fileDescription}}</a>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</ng-container>
