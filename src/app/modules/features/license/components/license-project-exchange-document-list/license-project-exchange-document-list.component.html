<button type="button" class="btn btn-primary my-4" (click)="openDialog('')">إضافة </button>

<div class="row row-gap-4">
    <div class="table-responsive mb-3" *ngIf="reqList.totalCount > 0">
        <table class="table">
            <thead>
                <tr>
                     <th scope="col"> الوثيقة</th> 
                    <th scope="col">تاريخ الصرف</th>
                    <th scope="col">المبلغ</th>
                    <th scope="col"> تاريخ الاعتماد</th>
                    <th scope="col">رقم الدفعة</th>
                    <th scope="col">البند الرئيسي</th>
                    <th scope="col">العمليات</th>
                   
                </tr>
            </thead>
            <tbody *ngFor="let comdata of reqList.results;let i=index;">
                <tr>
                    
                    <td>
                        <div class="d-flex align-items-center column-gap-2">
                            {{comdata.documnetNumber}}
                        </div>
                    </td>
                    <td>
                        <div class="d-flex align-items-center column-gap-2">
                            {{comdata.exchangeDate| date:'yyyy-MM-dd'}}
                        </div>
                    </td>
                    <td>
                        <span class="d-flex align-items-center column-gap-2">{{comdata.amount}}</span>
                    </td>
                    <td>
                        <div class="d-flex align-items-center column-gap-2">
                            {{comdata.approvalDate| date:'yyyy-MM-dd'}}
                        </div>
                    </td>
                   
                    <td>
                        <div class="d-flex align-items-center column-gap-2">
                            {{comdata.batchNumber}}
                        </div>
                    </td>
                    <td>
                        <div class="d-flex align-items-center column-gap-2">
                            {{comdata.mainItem.name}}</div>
                    </td>
                    <td>
                       <button type="button" class="btn btn-outline-primary mx-4" (click)="openDialog(comdata.id)">تعديل </button>
                       <button type="button"  class="btn btn-outline-primary" (click)="showDetailDialog(comdata.id)">التفاصيل</button> 

                     </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-auto" *ngIf="reqList.totalCount > 0">
        <app-pagination></app-pagination>
    </div>
    <ng-container *ngIf="reqList.totalCount === 0">
        <div class="mt-4">
            <app-no-data [showCompleteBtn]="false"></app-no-data>
        </div>
    </ng-container>
</div>
