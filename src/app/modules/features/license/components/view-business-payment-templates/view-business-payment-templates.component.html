<div class="business-payment-templates">


  <!-- Empty State -->
  <div class="empty-state" *ngIf="paymentTemplates.length === 0" >
    <div class="empty-illustration">
      <!-- Chat/Message Illustration matching Figma -->
      <svg width="400" height="280" viewBox="0 0 400 280" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Background circles -->
        <circle cx="200" cy="140" r="130" fill="#E8F4F8" opacity="0.3"/>
        <circle cx="200" cy="140" r="100" fill="#E8F4F8" opacity="0.5"/>
        <circle cx="200" cy="140" r="70" fill="#E8F4F8" opacity="0.7"/>

        <!-- Main chat bubble -->
        <g transform="translate(120, 70)">
          <!-- Large chat bubble -->
          <path d="M0 20 Q0 0 20 0 L140 0 Q160 0 160 20 L160 80 Q160 100 140 100 L40 100 L20 120 L20 100 Q0 100 0 80 Z" fill="#E8F4F8"/>

          <!-- Chat lines -->
          <line x1="20" y1="25" x2="140" y2="25" stroke="#B8D4E0" stroke-width="3" stroke-linecap="round"/>
          <line x1="20" y1="40" x2="120" y2="40" stroke="#B8D4E0" stroke-width="3" stroke-linecap="round"/>
          <line x1="20" y1="55" x2="130" y2="55" stroke="#B8D4E0" stroke-width="3" stroke-linecap="round"/>
          <line x1="20" y1="70" x2="110" y2="70" stroke="#B8D4E0" stroke-width="3" stroke-linecap="round"/>

          <!-- Small chat bubble -->
          <g transform="translate(40, -30)">
            <path d="M0 15 Q0 0 15 0 L80 0 Q95 0 95 15 L95 35 Q95 50 80 50 L25 50 L15 60 L15 50 Q0 50 0 35 Z" fill="#D1E9F0"/>
            <circle cx="25" cy="20" r="3" fill="white"/>
            <circle cx="47" cy="20" r="3" fill="white"/>
            <circle cx="69" cy="20" r="3" fill="white"/>
          </g>

          <!-- Typing indicator (teal bubble) -->
          <g transform="translate(100, 50)">
            <circle cx="30" cy="25" r="25" fill="#006A6C"/>
            <circle cx="20" cy="20" r="2.5" fill="white"/>
            <circle cx="30" cy="20" r="2.5" fill="white"/>
            <circle cx="40" cy="20" r="2.5" fill="white"/>
          </g>
        </g>
      </svg>
    </div>

    <h2 class="empty-title">لا يوجد خطط دفع</h2>
  </div>

  <!-- Payment Installments Table -->
<div class="payment-data-section" *ngIf="paymentTemplates.length > 0">
  
  <div class="payment-content-wrapper">
    <!-- Right Sidebar: Templates List -->
    <div class="templates-sidebar">
      <div 
        class="template-item"
        [class.active]="selectedTemplateId === template.id"
        *ngFor="let template of paymentTemplates"
        (click)="selectTemplate(template.id)">
        <span class="template-name">{{ template.modelTitle }}</span>
      </div>
    </div>

    <!-- Main Content: Payment Table -->
    <div class="payment-main-content">

      <!-- Refunds Input Field -->
      <div class="refunds-section" *ngIf="selectedTemplate">
        <label for="refunds">عدد الدفعات المستردة: </label>
        <label id="refunds">{{selectedTemplate.refunds}}</label>
      </div>

      <!-- Payment Table -->
      <div class="payment-table">
        <table>
          <thead>
            <tr>
              <th>رقم الدفعة</th>
              <th>نسبة الاستقطاع</th>
              <th>نسبة الإنجاز</th>
              <th>وصف الدفعة</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let payment of paymentInstallments; let i = index">
              <td class="payment-number">{{ i + 1 }}</td>
              <td>{{ payment.deductionPercentage }}%</td>
              <td>{{ payment.rentPercentage }}%</td>
              <td class="payment-description">{{ payment.description }}</td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
  </div>

</div>
