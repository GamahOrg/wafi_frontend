<h6 class="title">{{header}}</h6>
<ng-container [formGroup]="form" id="form-form" *ngIf="form">
  <div class="row row-gap-4">
    <div class="col-12 col-lg-6">
      <div class="form-group">
        <label for="cityId" class="form-label"><span class="required-star">*</span> {{localizations.City}}</label>
        <select id="cityId" id="control-cityId" name="cityId" class="form-select" formControlName="cityId">
          <option [ngValue]="null" disabled hidden>يرجى الاختيار</option>
          <option *ngFor="let city of (cities$ | async)?.data" [ngValue]="city.id">
            {{ city.cityName }}
          </option>
        </select>
        <div class="invalid-feedback d-block" *ngIf="form.controls['cityId'].hasError('required') && form.controls['cityId'].touched">{{localizations.CityRequired}}</div>
      </div>
    </div>

    <div class="col-12 col-lg-6">
      <div class="form-group">
        <label for="workDaysCount" class="form-label"><span class="required-star">*</span> {{localizations.NumberOfWorkDaysForAgreement}}</label>
        <input name="workDaysCount" id="control-workDaysCount" type="number" class="form-control" formControlName="workDaysCount">
        <div class="invalid-feedback d-block" *ngIf="form.controls['workDaysCount'].hasError('required') && form.controls['workDaysCount'].touched">{{localizations.NumberOfWorkDaysForAgreementRequired}}</div>
        <div class="invalid-feedback d-block" *ngIf="form.controls['workDaysCount'].hasError('min') && form.controls['workDaysCount'].touched">{{localizations.MinValueError}}</div>
      </div>
    </div>

    <div class="col-12 col-lg-12">
      <div class="form-group">
        <label for="optionalTerms" class="form-label"><span class="required-star">*</span> {{localizations.OptionalTerms}}</label>
        <app-rich-text-editor [form]="form" id="optionalTerms" controlName="optionalTerms">
        </app-rich-text-editor>
        <div class="invalid-feedback d-block" *ngIf="form.controls['optionalTerms'].hasError('required') && form.controls['optionalTerms'].touched">{{localizations.OptionalTermsRequired}}</div>
      </div>
    </div>
  </div>
</ng-container>
