<form class="d-flex flex-column h-100">
  <!-- PDF Viewer Container -->
  <app-pdf-viewer
    *ngIf="!isFullscreen"
    [pdfUrl]="selectedPdfUrl"
    [isLoading]="isLoadingPdf"
    [loadError]="pdfLoadError"
    [retryCallback]="retryGenerateContract"
    [loadingMessage]="'جاري تحميل العقد'"
    [loadingDescription]="'يرجى الانتظار بينما يتم تحميل عقد المستفيد النهائي'"
    [noContentMessage]="'لا يوجد عقد متاح'"
    [noContentDescription]="'لم يتم العثور على عقد المستفيد النهائي'"
    [errorMessage]="'حدث خطأ في تحميل العقد'">
  </app-pdf-viewer>

  <!-- Contract Files Section - Hide in fullscreen -->
  <div class="contract-files-section" *ngIf="!isFullscreen">
    <!-- Contract Approval -->
    <div class="contract-approval">
      <div class="form-check">
        <input
        disabled
          type="checkbox"
          [value]="sysLicenseBeneficiaryContractFormListDto.isApprove"
          id="beneficiaryContractFormApproval"
          class="form-check-input"
        />
        <label for="beneficiaryContractFormApproval" class="form-check-label">
          <i class="material-icons">check_circle</i>
          الموافقة على عقد المستفيد النهائي
        </label>
      </div>
    </div>
  </div>
</form>
