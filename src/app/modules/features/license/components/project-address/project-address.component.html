<form [formGroup]="projectAddressForm" id="form-projectAddressForm">
  <div class="tab-data-header">
    <i class="icon hgi hgi-stroke hgi-profile"></i>
    <h6 class="title">{{localization.title}}</h6>
  </div>
  <div class="tab-data-section">
    <div class="row row-gap-4">
      <div class="col-12 col-lg-6">
        <div class="form-group">
          <label class="form-label"><span class="required-star">*</span> {{localization.area}}</label>
          <select class="form-select" id="control-areasId" formControlName="areasId">
            <option [ngValue]="null" disabled hidden>يرجى الاختيار</option>
            <option *ngFor="let area of areas" [value]="area.id">{{area.areaName}}</option>
          </select>
          <div class="invalid-feedback d-block" *ngIf="controls.areasId?.hasError('required') && showValidation">{{localization.requiredErrorMsg}}</div>
        </div>
      </div>
      <div class="col-12 col-lg-6">
        <div class="form-group">
          <label class="form-label"><span class="required-star">*</span> {{localization.city}}</label>
          <select class="form-select" id="control-citiesId" formControlName="citiesId">
            <option [ngValue]="null" disabled hidden>يرجى الاختيار</option>
            <option *ngFor="let city of tempCities" [value]="city.id">{{city.cityName}}</option>
          </select>
          <div class="invalid-feedback d-block" *ngIf="controls.citiesId?.hasError('required') && showValidation">{{localization.requiredErrorMsg}}</div>
        </div>
      </div>
      <div class="col-12 col-lg-6">
        <div class="form-group">
          <label class="form-label"><span class="required-star">*</span> {{localization.neighborhood}}</label>
          <input type="text" id="control-neighborhoodName" class="form-control" formControlName="neighborhoodName">
          <div class="invalid-feedback d-block" *ngIf="controls.neighborhoodName?.hasError('required') && showValidation">{{localization.requiredErrorMsg}}</div>
        </div>
      </div>
      <div class="col-12 col-lg-6">
        <div class="form-group">
          <label class="form-label"><span class="required-star">*</span> {{localization.street}}</label>
          <input type="text" id="control-streetName" class="form-control" formControlName="streetName">
          <div class="invalid-feedback d-block" *ngIf="controls.streetName?.hasError('required') && showValidation">{{localization.requiredErrorMsg}}</div>
        </div>
      </div>
      <div class="col-12">
        <div class="form-group">
          <label class="form-label"><span class="required-star">*</span> {{localization.location}}</label>
          <app-google-maps *ngIf="longitude && latitude" [longitude]="longitude" [latitude]="latitude" [useSearch]="true" (locationSelected)="setLocationOnMapChanges($event)"></app-google-maps>
          <div class="invalid-feedback d-block" *ngIf="controls.latitude?.hasError('required') && showValidation">{{localization.requiredErrorMsg}}</div>
        </div>
      </div>
    </div>
  </div>

  <app-next-and-previus-buttons></app-next-and-previus-buttons>
</form>
