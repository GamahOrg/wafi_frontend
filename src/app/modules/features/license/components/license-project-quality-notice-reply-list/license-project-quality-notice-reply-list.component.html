     <button type="button" class="btn btn-primary" (click)="openAddReplayFromProjectMangerDialog()">إضافة رد </button>
   
   </div>

         <table class="table table-light">
           
           <tbody>
             <tr *ngFor="let replay of licenseProjectQualityNoticeReplyList">

                 {{replay.notes}}
               </td>
               
             </tr>
           </tbody>
         </table>
       </div>
     </div>
