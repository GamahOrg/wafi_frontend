
<button type="button" class="btn btn-primary my-4" (click)="openEditProjectBusinessCaseDialog('')">إضافة حالة أعمال </button>

<div class="row row-gap-4">
    <div class="table-responsive mb-3" *ngIf="reqList.totalCount > 0">
        <table class="table">
            <thead>
                <tr>
                    <th scope="col">التاريخ المتوقع لبدء العمل</th>
                    <th scope="col">العمليات</th>
                </tr>
            </thead>
            <tbody *ngFor="let comdata of reqList.results;let i=index;">
                <tr>
                    <td>
                        <div class="d-flex align-items-center column-gap-2">
                            {{comdata.projectExpectedWorkStartDate | date:'yyyy-MM-dd'}}
                        </div>
                    </td>
                    <td>
                         <button type="button" class="btn btn-outline-primary mx-4" *ngIf="comdata.externalStatusId===licenseProjectEngineeringRequestStatus.CustomerFeedback && comdata.ownerTypeId===ownerTypes.ProjectManager" (click)="openEditProjectBusinessCaseDialog(comdata.id)">تعديل </button>
                        
                        <button type="button" class="btn btn-outline-primary" (click)="getProjectBusinessCaseDetails(comdata.id)">عرض </button>
                     </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-auto" *ngIf="reqList.totalCount > 0">
        <app-pagination></app-pagination>
    </div>
    <ng-container *ngIf="reqList.totalCount === 0">
        <div class="mt-4">
            <app-no-data [showCompleteBtn]="false"></app-no-data>
        </div>
    </ng-container>
</div>
