
<div class="row row-gap-4">
  <div class="col-12">
    <div class="form-group">
      <label class="form-label"><span class="required-star">*</span> {{ 'المفوضين علي وثيقة الصرف للمطور' }}</label>
      <div class="dropdown multi-select">
        <div class="form-select dropdown-toggle" role="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
          يرجي الاختيار
        </div>
        <ul class="dropdown-menu">
          <li *ngFor="let delegator of availableDeveloperDelegators">
            <div class="dropdown-item form-check form-check-normal">
              <input class="form-check-input" type="checkbox" [id]="'dId-'+delegator.id" [checked]="isDeveloperSelected(delegator.id)" (click)="$event.stopPropagation()" (change)="toggleDeveloperDelegator(delegator);">
              <label class="form-check-label" [for]="'dId-'+delegator.id">{{ delegator.fullName }}</label>
            </div>
          </li>
          <li *ngIf="availableDeveloperDelegators.length === 0">
            <span class="dropdown-item text-muted">لا توجد خيارات متاحة</span>
          </li>
        </ul>
      </div>
      <div class="d-flex flex-wrap align-items-center gap-2 mt-2" *ngIf="this.selectedDeveloperDelegators.length > 0">
        <div class="chip" *ngFor="let delegator of selectedDeveloperDelegators">
          {{ delegator.fullName }}
          <button type="button" class="btn-icon btn btn-dark" (click)="removeDeveloperDelegator(delegator.id)" aria-label="Remove">
            <i class="hgi hgi-stroke hgi-cancel-01"></i>
          </button>
        </div>
      </div>

     
    </div>
  </div>

  <div class="col-12">
    <div class="form-group">
      <label class="form-label"><span class="required-star">*</span> {{ 'المفوضين علي وثيقة الصرف للاستشاري الهندسي' }}</label>
