          <div class="phase" *ngFor="let step of licenseRequestHeaderProcessingStepList; let i = index" [ngClass]="{
            'completed':getCompleted(step.stepStatusId),
            'current': getCurrentStatus(step),
            'pending': step.stepStatusId == stepStatus.PendingApproval,
            'rejected': getRejectStatus(step.stepStatusId)
          }">

            <div class="number-area">
              <span class="number">{{ i + 1 }}</span>
            </div>

            <div class="info-area">
              <h6 class="title">{{step.step.name}}</h6>
              <div class="info">
                <span class="status">{{step.stepStatus.name}}</span>
                <div class="date">
                  <i class="hgi hgi-stroke hgi-calendar-03"></i>
                  <span>{{(step.endAt | date: 'dd/MM/yyyy') || '--/--/----'}}</span>
                </div>
              </div>

              <button *ngIf="step.stepId==stepType.SendAgreementsToDeedOwners" type="button" class="btn btn-sm btn-primary w-100 mt-2" (click)="openProjectPartiesStatus(true)">تفقد حالة أطراف المشروع</button>
