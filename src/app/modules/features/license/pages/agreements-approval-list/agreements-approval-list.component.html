<div class="page">
  <div class="page-title">
    <h6 class="title">{{ 'اتفاقيات التطوير العقارى' }}</h6>
  </div>

  <!-- Agreements List -->
  <div *ngIf="agreementsList.results && agreementsList.results.length > 0" class="table-responsive mt-3">
    <table class="table table-light">
      <thead>
        <tr>
          <th>اسم المشروع</th>
          <th>المطور</th>
          <th>احدث تاريخ إرسال</th>
          <th>حالة الاتفاقية</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let agreement of agreementsList.results; let i = index">
          <td>{{ agreement.projectName }}</td>
          <td>{{ agreement.facilityName }}</td>
          <td>{{ agreement.latestAgreementDate | date : "dd/MM/yyyy" }}</td>
          <td class="text-nowrap">
            <div class="d-flex align-items-center">
              <span class="status-pill" [ngClass]="getApprovalClass(agreement)">
                {{ agreement.agreementStatusDisplayName }}
              </span>
            </div>
          </td>
          <td class="text-nowrap">
            <div class="table-actions">
              <button class="btn btn-outline-primary" (click)="viewDetails(agreement)">
                عرض الاتفاقية
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div *ngIf="agreementsList.results && agreementsList.results.length > 0" class="mt-3">
    <app-pagination></app-pagination>
  </div>

  <!-- Empty State -->
  <ng-container *ngIf="!isLoading && (!agreementsList.results || agreementsList.results.length === 0)">
    <div class="mt-4">
      <app-no-data [showCompleteBtn]="false" [showText]="true" [text]="'لا توجد اتفاقيات متاحة'"></app-no-data>
    </div>
  </ng-container>
</div>

<!-- Loading State -->
<div *ngIf="isLoading" class="loading-state">
  <div class="spinner"></div>
  <p>جاري التحميل...</p>
</div>
