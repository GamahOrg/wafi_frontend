<div class="col-12" *ngIf="!availabilityToUpdate">
  <div class="buttona bg-white px-3 py-2 mb-1 d-flex justify-content-end">
    <div>
      <button
        type="button"
        mat-flat-button
        color="primary"
        (click)="send()"
        [disabled]="!disabledSend || requestSubmittedSuccessfully"
      >
        {{ localization.send }}
      </button>
      &nbsp;
      <button
        type="button"
        [disabled]="requestSubmittedSuccessfully"
        class="btn btn-outline-primary"
        (click)="openApprovalDialog()"
      >
        {{ localization.approvalDecisions }}
      </button>
    </div>
  </div>
</div>
<app-license-request-timeline></app-license-request-timeline>

<app-tabs></app-tabs>
