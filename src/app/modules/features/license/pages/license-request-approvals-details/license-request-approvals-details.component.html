            <!-- National Address Section (for DeedOwner) -->
            <div class="col-12" *ngIf="selectedApproval?.approvalRole == aprovalRole.DeedOwner && !selectedApproval?.isApproved && !selectedApproval?.approvedOn">
                <div class="address-section" [class.has-error]="addressValidationAttempted && !Form.controls.nationalAddress.value">
                    <h5 class="section-title mb-3">
                        العنوان الوطنى للمالك
                        <span class="text-danger">*</span>
                    </h5>

                    <!-- Loading State -->
                    <div class="text-center py-3" *ngIf="isLoadingAddresses">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">جاري التحميل...</span>
                        </div>
                        <p class="mt-2">جاري تحميل العناوين...</p>
                    </div>

                    <!-- Address Options -->
                    <div class="address-selection" *ngIf="!isLoadingAddresses && ownerAddresses.length > 0">
                        <div class="address-option" *ngFor="let addressItem of ownerAddresses">
                            <input
                                type="radio"
                                [id]="'owner-address-' + addressItem.id"
                                name="ownerAddress"
                                [value]="addressItem.id"
                                [(ngModel)]="selectedAddressId"
                                [ngModelOptions]="{standalone: true}"
                                (change)="onAddressSelect(addressItem.id)"
                                class="form-check-input">
                            <label [for]="'owner-address-' + addressItem.id" class="address-label">
                                <span class="address-text">{{ addressItem.address }}</span>
                            </label>
                        </div>
                    </div>

                    <!-- No Addresses Message -->
                    <div class="alert alert-warning" *ngIf="!isLoadingAddresses && ownerAddresses.length === 0">
                        <i class="bi bi-exclamation-triangle"></i>
                        لا توجد عناوين وطنية مسجلة. يرجى تسجيل عنوانك الوطني أولاً.
                    </div>

                    <!-- Validation Message -->
                    <div class="alert alert-danger mt-3" *ngIf="!isLoadingAddresses && ownerAddresses.length > 0 && addressValidationAttempted && !Form.controls.nationalAddress.value">
                        <i class="bi bi-exclamation-circle-fill"></i>
                        <strong>حقل مطلوب:</strong> يجب اختيار العنوان الوطني للمالك قبل الموافقة
                    </div>
                </div>
            </div>

            <div class="form-actions mt-auto" *ngIf="!selectedApproval?.isApproved && !selectedApproval?.approvedOn">
                <button mat-flat-button color="primary" (click)="updateIsApproved(true); saveApproval()" [disabled]="isSaving">
                  <span *ngIf="!isSaving">موافق</span>
                  <span *ngIf="isSaving">جاري الحفظ...</span>
                </button>
                <button mat-flat-button color="warn" (click)="openRejectionDialog()" [disabled]="isSaving">
                  <span *ngIf="!isSaving">غير موافق</span>
                  <span *ngIf="isSaving">جاري الحفظ...</span>
                </button>
              </div>
              <div class="form-actions mt-auto" *ngIf="selectedApproval?.isApproved">
                <button *ngIf="false" mat-flat-button color="primary" (click)="updateApproval()" [disabled]="isUpdating">
                  <span *ngIf="!isUpdating">تعديل</span>
                  <span *ngIf="isUpdating">جاري التعديل...</span>
                </button>
              </div>
        </div>
    </div>
</form>
