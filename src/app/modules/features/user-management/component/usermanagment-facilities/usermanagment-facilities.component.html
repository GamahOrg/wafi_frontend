<button type="button" class="btn btn-primary mb-2" (click)="addFacility()">اضافة منشأة</button>

<div class="row row-gap-4">
    <div class="table-responsive mb-3">
        <table class="table">
            <thead>
                <tr>
                       <th scope="col">اسم الشركة  </th>
                       <th scope="col">كود الشركة  </th>
                        <th scope="col">السجل التجاري</th>
                        <th scope="col">تاريخ بداية التسجيل</th>
                        <th scope="col">تاريخ نهاية التسجيل</th>
                        <th scope="col">العمليات</th>
                </tr>
            </thead>
            <tbody *ngFor="let facility of reqList.results">
                <tr>
                    <td>
                        <div class="d-flex align-items-center column-gap-2">
                            {{facility.facilityName}}
                        </div>
                    </td>
                    <td>
                        <div class="d-flex align-items-center column-gap-2">
                            {{facility.facilityCode}}
                        </div>
                    </td>
                    <td>
                        <span class="text-dark">{{facility.commercialRegisterNumber}}</span>
                    </td>
                    <td>
                        <span class="text-dark">{{facility.commercialRegisterStartDate | date:'MMM d, y'}}
                        </span>
                    </td>
                    <td>
                        <span class="text-dark">{{facility.commercialRegisterEndDate | date:'MMM d, y'}}
                        </span>
                    </td>
                    <td>
                        <button type="button" class="btn btn-primary" (click)="assignSubCustomerOnFacility(facility)">تعين مفوضين على المنشأه</button>

                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-auto">
        <app-pagination></app-pagination>
    </div>
    <ng-container *ngIf="reqList.totalCount === 0">
        <div class="mt-4">
            <app-no-data [showCompleteBtn]="false"></app-no-data>
        </div>
    </ng-container>
</div>
