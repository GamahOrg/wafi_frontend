<form
  class="d-flex flex-column h-100"
  [formGroup]="sysLicenseBeneficiaryContractForm"
  id="form-sysLicenseBeneficiaryContractForm"
>
  <div class="tab-data-header">
    <i class="icon hgi hgi-stroke hgi-profile"></i>
    <h6 class="title">عقد المستفيد النهائي</h6>
  </div>

  <div class="tab-data-section">
    <!-- <div class="table-responsive">
            <table class="table table-light"
                   *ngIf="sysLicenseBeneficiaryContractFormListDto && sysLicenseBeneficiaryContractFormListDto.sysLicenseBeneficiaryContractFormDtos && sysLicenseBeneficiaryContractFormListDto.sysLicenseBeneficiaryContractFormDtos.length>0">
                <thead>
                    <tr>
                        <th>اسم الملٝ</th>
                        <th> نوع الملٝ</th>
                        <th>رابط الملٝ</th>

                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let file of sysLicenseBeneficiaryContractFormListDto.sysLicenseBeneficiaryContractFormDtos">
                        <td>{{file?.description}}</td>
                        <td>{{file?.contractFormFile?.fileType}}</td>
                        <td>{{file?.contractFormFile?.filePath}}</td>
                    </tr>
                </tbody>
            </table>
        </div> -->

    <div class="row row-gap-3">
      <div class="col-12 col-lg-12">
        <ng-container
          *ngIf="
            sysLicenseBeneficiaryContractFormListDto &&
            sysLicenseBeneficiaryContractFormListDto.sysLicenseBeneficiaryContractFormDtos &&
            sysLicenseBeneficiaryContractFormListDto
              .sysLicenseBeneficiaryContractFormDtos.length > 0
          "
        >
          <div
            class="file-bar"
            *ngFor="
              let file of sysLicenseBeneficiaryContractFormListDto.sysLicenseBeneficiaryContractFormDtos
            "
          >
            <div class="details">
              <span class="material-icons-outlined">picture_as_pdf</span>
              {{ file?.description }}
            </div>
            <div class="actions">
              <a
                [download]="file?.description"
                [href]="baseUrl + file?.contractFormFile?.filePath"
                class="btn btn-outline-primary"
                target="_blank"
              >
                <span class="material-icons-outlined">picture_as_pdf</span> عرض
                الملف
              </a>
              <!-- <button class="certificateBtn"
                                    styleSheetFile="assets/styles/certificate.css"
                                    printSectionId="print-section"
                                    [printTitle]="qualificationRequestType(certificate.qualificationRequestType)"
                                    ngxPrint>
                                شهادة
                                {{qualificationRequestType(certificate.qualificationRequestType)}}
                            </button> -->
            </div>
          </div>
        </ng-container>
      </div>

      <div class="col-12 col-lg-12">
        <div class="form-check form-check-inline">
          <input
            type="checkbox"
            formControlName="beneficiaryContractFormApproval"
            id="control-beneficiaryContractFormApproval"
            class="form-check-input"
          />
          <label for="beneficiaryContractFormApproval" class="form-check-label"
            >الموافقة على عقد المستفيد</label
          >
        </div>
      </div>
    </div>
  </div>
  <h6 class="title">ملفات الاتفاقية</h6>
  <div class="col-12 col-lg-12">
    <div class="form-group mb-4">
      <div class="value" *ngFor="let proposedFile of savedBeneficiaryFiles">
        <span class="icon material-icons-outlined">content_copy</span>
        <a
          *ngIf="proposedFile && proposedFile.id"
          id="link-proposedScheduleFile"
          [href]="baseUrl + proposedFile.filePath"
          target="_blank"
        >
          {{ proposedFile.fileDescription }}</a
        >
        <span class="delete"
        (click)="deletFile(proposedFile.id)"><i
         class="icon material-icons text-danger">close</i></span>
      </div>
      <app-file-uploader
        [data]="multiFilesUploaderData"
        (fileUploaded)="onBeneficiaryFilesUploaded($event)"
      ></app-file-uploader>
    </div>
  </div>
  <app-next-and-previus-buttons></app-next-and-previus-buttons>
  <!-- <div class="form-actions mt-auto">
        <button class="btn btn-outline-primary"
                (click)="back()">{{localization.previous}}</button>
        <button type="button"
                class="btn btn-outline-primary"
                (click)="UpdateLicenseBeneficiaryContractForm()">{{localization.Save}}</button>

    </div> -->
</form>
