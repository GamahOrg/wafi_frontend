<form class="d-flex flex-column h-100" [formGroup]="addingZoneForm" id="form-addingZoneForm">
    <div class="row mb-3">
        <div class="col-12">
            <div class="form-group mb-4">
                <label class="form-label">{{localization.addingNewZone}}</label>
                <input type="text" id="control-code"
                       class="form-control"
                       formControlName="code" />
                <div class="form-text">{{localization.addingNewZoneHint}}</div>
            </div>
        </div>
    </div>
</form>
