<form class="d-flex flex-column"
      [formGroup]="licenseProjectSubUnitsForm" id="form-licenseProjectSubUnitsForm">
    <h6 class="form-title">
        {{localization.chooseUnitTitle}}
        <small>{{localization.chooseUnitTitleHint}}</small>
    </h6>
    <div class="row">
        <div class="col-12 col-lg-6">
            <div class="form-group mb-4">
                <label for=""
                       class="form-label">{{localization.subUnitsType}}</label>
                <select class="form-select" id="control-subUnitTypeId"
                        aria-label="Default select example"
                        formControlName="subUnitTypeId">
                    <option selected
                            disabled>{{localization.subUnitsType}} </option>
                    <option *ngFor="let type of subUnitType"
                            [value]="type.id">{{type.name}}</option>
                </select>
                <div class="invalid-feedback d-block"
                     *ngIf="SubUnitsFormControls.subUnitTypeId.errors?.['required'] && showValidation">
                    هذا الحقل مطلوب
                </div>
            </div>
        </div>

        <div class="col-12 col-lg-6">
            <div class="form-group mb-4">
                <label for=""
                       class="form-label">{{localization.subUnitCount}}</label>
                <input type="number" id="control-subUnitCount"
                       class="form-control"
                       [placeholder]="localization.subUnitCount"
                       formControlName="subUnitCount">
                <div class="invalid-feedback d-block"
                     *ngIf="SubUnitsFormControls.subUnitCount.errors?.['required'] && showValidation">
                    هذا الحقل مطلوب
                </div>
                <div class="invalid-feedback d-block"
                     *ngIf="SubUnitsFormControls.subUnitCount.errors?.['min'] && showValidation">قيمة الحقل يجب الا
                    تقل عن صفر</div>
            </div>
        </div>

    </div>

    <div class="row justify-content-end">
        <div class="col-12 col-lg-auto">
            <button class="btn btn-link" id="btn-addNewFormGroup"
                    (click)="addNewFormGroup()">
                <span class="material-icons-outlined">add_circle_outline</span>
                {{localization.addingNewUnit}}
            </button>
        </div>
    </div>
</form>

<div class="row row-gap-4"
     *ngIf="licenseProjectSubUnits.length > 0">
    <div class="col-12 ">
        <div class="table-responsive">
            <table class="table table-light">
                <thead>
                    <tr>
                        <th>{{localization.subUnitsType}}</th>
                        <th>{{localization.subUnitCount}}</th>
                        <th>{{localization.actions}}</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let subUnit of licenseProjectSubUnits; let i = index;">
                        <td>{{getSubUnitName(subUnit)}}</td>
                        <td>{{subUnit.subUnitCount}}</td>
                        <td>
                            <div class="d-flex align-items-center justify-content-end column-gap-2">
                                <button mat-icon-button id="btn-deleteSubUnit"
                                        color="warn"
                                        (click)="deleteSubUnit(i)"><mat-icon>delete</mat-icon></button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
