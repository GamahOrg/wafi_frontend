<div class="d-flex flex-column h-100">
  <div class="tab-data-header">
    <div class="icon"><span class="material-icons">list_alt</span></div>
    <h6 class="title">{{localization.title}}</h6>
    <button class="edit-icon btn btn-outline-primary"
            (click)="openDialog(undefined)"><span class="material-icons">add</span></button>
  </div>
  <div class="tab-data-section">
    <div class="table-responsive">
      <table class="table table-light">
        <thead>
          <tr>
            <th>الخدمه</th>
            <th> المده </th>
            <th> السعر </th>
            <th class="w-25"></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let service of additionalServices">
            <td>{{service?.sysLicenseProjectService?.name}}</td>
            <td>{{service?.period}}</td>
            <td>{{service?.price}}</td>

            <td>
              <div class="d-flex align-items-center justify-content-end column-gap-2">
                <!--                             <button mat-icon-button color="primary" (click)="openDialog(eng.id)"><mat-icon>edit</mat-icon></button>
     --> <button mat-icon-button
                        color="warn"
                        (click)="delete(service.id)"><mat-icon>delete</mat-icon></button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <app-next-and-previus-buttons></app-next-and-previus-buttons>
  <!-- <div class="form-actions mt-auto">
    <button class="btn btn-outline-primary"
            (click)="back()">{{localization.previous}}</button>
    <button class="btn btn-outline-primary"
            (click)="next()">{{localization.next}}</button>

  </div> -->

</div>
