


<div class="tab-data-section" *ngIf="years">
    <div class="row mb-3">
      <div class="col-12 col-lg-6">
      <select class="form-select" [(ngModel)]="currenrYear" (change)="onChangeYear($event)">
        <option [ngValue]="null" disabled hidden>يرجى الاختيار</option>
        <option *ngFor="let item of years" [value]="item">
          {{ item }}
        </option>
      </select>
    </div>
    <div class="col-12 col-lg-6">
      <button type="button" class="btn btn-primary" (click)="openAddEditEngineeringInfrastructureRatesDialog()" *ngIf="engineerinSupervisionPlannedReportAllowToEdit">تعديل بيانات البنيه التحتيه</button>
   </div>
    </div>
  </div> 
  <div class="tab-data-section">
    <div class="row mb-3">
    <table class="table table-light" style="width:100%">
  
      <tbody>
          <tr>
              <th> الشهر:</th>
              <td
              *ngFor="let detail of licenseProjectEngineeringSupervisionPlannedReportDetailDtoList
              let i=index;">
              {{detail.monthName}}</td>
          </tr>
          <tr>
              <th> نسبه الانجاز المخططه الشهريه : </th>
              <td
              *ngFor="let detail of licenseProjectEngineeringSupervisionPlannedReportDetailDtoList
              let i=index;">
              {{detail.infrastructureMonthlyPlannedCompletionRate}}</td>
          </tr>
          <tr>
              <th>نسبه الانجاز المخططه التراكميه:</th>
              <td
              *ngFor="let detail of licenseProjectEngineeringSupervisionPlannedReportDetailDtoList
              let i=index;">
              {{detail.cumulativeplannedcompletionpercentage}}</td>
          </tr>
      </tbody>
  </table>
    </div>
  </div>
  
  <h6 class="title">{{'بنود اشهر السنة'}}</h6>
  <div class="tab-data-section">
    <div class="row mb-3">
  
    <div class="table-responsive">
        <table class="table table-light" style="width:100%">
            <thead>
                <tr>
                    <th> الشهر</th>
                   <th>العمليات</th>
                   
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let detail of engineeringSupervisionPlannedReportDetailForInfrastructureMonthlyList
                let i=index;" >
                     <td>
                      {{detail.monthName}}
                    </td>
                     <td>
                      <button type="button" class="btn btn-primary" (click)="openAddEditModifyTermsDialog(detail)">تعديل البنود على الشهر</button>
  
                    </td>  
                     
                </tr>
            </tbody> 
        </table>
    </div>
    </div>
  </div>
