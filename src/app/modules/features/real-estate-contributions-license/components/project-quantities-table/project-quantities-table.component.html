<ng-container *ngIf="licenseProjectQuantitiesTableFileAndRelativeWeight">
  <div class="d-flex flex-column h-100">
    <div class="tab-data-header">
      <i class="icon hgi hgi-stroke hgi-filter-mail-square"></i>
      <h6 class="title">{{localization.title}}</h6>
    </div>
    <div class="tab-data-section">
      <div class="row mb-3">
        <div class="col-12 col-lg-12">
          <div class="form-group mb-4">
            <label class="form-label">{{localization.quantitiesTableFileId}}</label>
            <div class="col-12 col-lg-12">
              <div class="value"
                *ngFor="let quantityTableFile of licenseProjectQuantitiesTableFileAndRelativeWeight?.licenseProjectQuantitiesTableFileList">
                <ng-container *ngIf="quantityTableFile && quantityTableFile.quantitiesTableFile &&
                                 quantityTableFile.quantitiesTableFile.fileDescription">
                  <span class="icon material-icons-outlined">content_copy</span>
                  <a [href]="baseUrl + quantityTableFile.quantitiesTableFile.filePath" target="_blank">
                    {{quantityTableFile.quantitiesTableFile.fileDescription}}</a>
                    <span class="delete" (click)="deletFile(quantityTableFile.quantitiesTableFileId)"><i
                      class="icon material-icons text-danger">close</i></span>
                </ng-container>
              </div>
              <app-file-uploader [data]="multipleFileUploaderData"
                (fileUploaded)="onQuantitiesTableFileUploaded($event)"></app-file-uploader>
            </div>
          </div>
        </div>
      </div>
    </div>


    <div class="tab-data-section">
      <div class="table-responsive">
        <div class="tab-data-header">
          <i class="icon hgi hgi-stroke hgi-filter-mail-square"></i>
          <h6 class="title">{{localization.relativeWeight}}</h6>
        </div>
        <form [formGroup]="licenseProjectRelativeWeightForm" (ngSubmit)="save()"  id="form-licenseProjectRelativeWeightForm">
          <table class="table table-light mb-3">
            <thead>
              <tr>
                <th>البند</th>
                <th> النسبة </th>
              </tr>
            </thead>
            <tbody formArrayName="Rows">
              <tr *ngFor="let itemrow of formArr.controls
                let i=index;let l=last" [formGroupName]="i">
                <td>
                  <input formControlName="elementName" class="form-control">
                </td>
                <td>
                  <input formControlName="elementValue" class="form-control">
                </td>
                <td [hidden]="true">
                  <input formControlName="licenseRelativeWeightId" class="form-control">
                </td>
              </tr>
              <tr>
                <td>الاجمالي</td>
                <td>{{total}}</td>
              </tr>
            </tbody>
          </table>
        </form>
      </div>
    </div>
