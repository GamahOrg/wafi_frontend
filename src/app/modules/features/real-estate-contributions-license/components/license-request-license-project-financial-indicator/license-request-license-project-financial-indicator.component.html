<div class="table-responsive">
    <table class="table table-light" >
        <thead>
            <tr>
                <th> السنة</th>

                    <th>صافي الربح</th>

                    <td>{{financial.averageNetProfitLoss}}</td>
                    <td>{{financial.assetsYearToYear}}</td> -->

        </tbody>
