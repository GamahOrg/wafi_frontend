            <div class="col-12 col-lg-6">
                <div class="form-group mb-4">
                  <label class="form-label">اختر مفوض</label>
                  <select class="form-select"  id="control-delegatorCustomerId"
                   aria-label="Default select example" formControlName="delegatorCustomerId">
                    <option [ngValue]="null" disabled hidden>يرجى الاختيار</option>
                    <option *ngFor="let customer of subCustomerList" [ngValue]="customer.id">
                        {{customer.fullName}}
                    </option>
                  </select>
                  <mat-error
                  *ngIf="controls.delegatorCustomerId?.hasError('required') && showValidation">حقل مطلوب  </mat-error>
                </div>
              </div>
            <div class="col-12 col-lg-12">
                <div class="form-group mb-4">
                    <div class="key">نموذج التوقيع</div>
                    <app-file-uploader [data]="singleFileUploaderData"
                                       (fileUploaded)="delegatorSignModelFileUploaded($event)"></app-file-uploader>
                                       <mat-error  *ngIf="controls.signModelFileId?.hasError('required') && showValidation">حقل مطلوب  </mat-error>
                </div>
            </div>
            <div class="page-content">
                <div class="form-check">
                    <input class="form-check-input"
                           type="checkbox" id="control-delegatorAcknowledgment"
                          
                           formControlName="delegatorAcknowledgment" />
                    <label class="form-check-label"
                           for="delegatorAcknowledgment">
                        نقر نحن "{{facility?.facilityName}}" قد فوضنا السيد
                        "{{customerName}}"
                        بالتوقيع على وثيقة الصرف الخاصة بحساب الضمان
                        رقم "{{accountKeeper?.accountNumber}}" المفتوح في بنك "{{accountKeeper?.sysBank?.name}}" الخاص
                        بهذا المشروع
                        وهو المعتمد من قبلنا في مواجهة الهيئة العامة للعقاروجميع الأطراف ذات العلاقة.
                    </label>
                </div>

            </div>
