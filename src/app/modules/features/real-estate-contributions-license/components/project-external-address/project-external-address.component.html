<ng-container>
    <form class="d-flex flex-column h-100"
          [formGroup]="projectExternalAddressForm" id="form-projectExternalAddressForm">
        <div class="tab-data-header">
            <i class="icon hgi hgi-stroke hgi-profile"></i>
            <h6 class="title">{{localization.title}}</h6>
        </div>

        <div class="tab-data-section">
            <div class="row mb-3">
                <div class="col-12 col-lg-6">
                    <div class="form-group mb-4">
                        <label class="form-label">{{localization.address}}</label>
                        <input type="text" id="control-address"
                               class="form-control"
                               formControlName="address">
                        <mat-error
                                   *ngIf="controls.address?.hasError('required') && showValidation">{{localization.requiredErrorMsg}}</mat-error>
                    </div>
                </div>

                    </div>
                </div> -->

                    </div>
                </div> -->

        </div>
