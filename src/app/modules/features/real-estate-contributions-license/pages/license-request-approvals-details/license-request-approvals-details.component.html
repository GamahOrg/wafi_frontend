
<form class="d-flex flex-column h-100"
      [formGroup]="Form " id="form-Form">
      <div class="tab-data-section">
<!-- Marketer -->
<app-license-project-real-state-marketer-approval *ngIf="selectedApproval?.approvalRole == aprovalRole.Marketer"></app-license-project-real-state-marketer-approval>
<!--CharteredAccountant  -->
<app-license-project-chartered-accountant-approval *ngIf="selectedApproval?.approvalRole == aprovalRole.CharteredAccountant"></app-license-project-chartered-accountant-approval>
<!--SubDeveloper -->
<app-license-project-sub-developer-approval *ngIf="selectedApproval?.approvalRole == aprovalRole.SubDeveloper"></app-license-project-sub-developer-approval>
<!-- MainDeveloper -->
<app-license-project-main-real-state-developer-approval *ngIf="selectedApproval?.approvalRole == aprovalRole.MainDeveloper"></app-license-project-main-real-state-developer-approval>
<!-- EngineeringConsultant -->
<app-license-project-engineering-consultant-approval *ngIf="selectedApproval?.approvalRole == aprovalRole.EngineeringConsultant"></app-license-project-engineering-consultant-approval>
</div>
    <div class="tab-data-section">
        <div class="row mb-3">
            <div class="col-12 col-lg-6">
                <div class="form-group mb-4">
                  <label class="form-label">اختر مفوض</label>
                  <select class="form-select"  id="control-delegatorCustomerId"
                   aria-label="Default select example" formControlName="delegatorCustomerId">
                    <option [ngValue]="null" disabled hidden>يرجى الاختيار</option>
                    <option *ngFor="let customer of subCustomerList" [ngValue]="customer.id">
                        {{customer.fullName}}
                    </option>
                  </select>
                  <mat-error
                  *ngIf="controls.delegatorCustomerId?.hasError('required') && showValidation">حقل مطلوب  </mat-error>
                </div>
              </div>
              <div class="col-12 col-lg-6" *ngIf="!selectedApproval?.isApproved">
                <div class="row row-gap-3 mb-3">
                    <div class="col-12 col-lg-6">
                        <label for="isApproved" class="form-label"> موافق على كوني ضمن هذا المشروع</label>
                    </div>
                    <div class="col-12 col-lg-6">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" id="control-isApproved" type="radio" name="isApproved" id="yes" value="1" (click)="updateIsApproved(true)">
                            <label class="form-check-label" for="yes">نعم</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio"  id="control-isApproved" name="isApproved" id="no" value="0" (click)="updateIsApproved(false)">
                            <label class="form-check-label" for="no">لا</label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-actions mt-auto" *ngIf="!selectedApproval?.isApproved">
                <button mat-flat-button color="primary" (click)="saveApproval()">
                  حفظ
                </button>
              </div>
              <div class="form-actions mt-auto" *ngIf="selectedApproval?.isApproved">
                <button mat-flat-button color="primary" (click)="updateApproval()">
                  تعديل
                </button>
              </div>
        </div>
    </div>
</form>
