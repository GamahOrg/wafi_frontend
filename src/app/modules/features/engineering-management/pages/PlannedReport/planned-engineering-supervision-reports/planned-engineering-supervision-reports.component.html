<div class="page">
  <div class="page-header d-flex justify-content-between align-items-center gap-3 mb-3">
    <div class="page-title">
      <h6 class="title">القيم المخططة</h6>

      <span class="status-pill green" *ngIf="licenseProjectEngineeringDataTapStatus?.hasSupervisionPlannedReport && licenseProjectEngineeringDataTapStatus?.hasTimeSchedule">
        {{sysLicenseProjectEngineeringRequestStatus != null ? sysLicenseProjectEngineeringRequestStatus.name : ''}}
      </span>
    </div>

    <div class="d-flex align-items-center gap-2">
      <button type="button" class="btn btn-primary" (click)="openRequestApprovalComponentDialog()" *ngIf="licenseProjectEngineeringDataTapStatus?.hasSupervisionPlannedReport 
 && licenseProjectEngineeringDataTapStatus?.supervisionReportStatusId === licenseProjectEngineeringRequestStatus.Draft 
 && licenseProjectEngineeringDataTapStatus?.hasTimeSchedule">إرسال القيم المخططة</button>

      <button type="button" class="btn btn-primary" (click)="openCustomerNotesForEngineerRequestComponentDialog()" *ngIf="licenseProjectEngineeringDataTapStatus?.supervisionReportStatusId ===licenseProjectEngineeringRequestStatus.CustomerFeedback">استيفاء الملاحظات</button>
    </div>
  </div>

  <app-vertical-tabs *ngIf="licenseProjectEngineeringDataTapStatus?.hasSupervisionPlannedReport && licenseProjectEngineeringDataTapStatus?.hasTimeSchedule; else noData"></app-vertical-tabs>

  <ng-template #noData>
    <app-no-data [showCompleteBtn]="false" [noDataActionsButtons]="noDataActions" [title]="title"></app-no-data>
  </ng-template>
</div>
