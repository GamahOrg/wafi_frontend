<form [formGroup]="licenseProjectEngineeringSupervisionPlannedReportForm" id="form-licenseProjectEngineeringSupervisionPlannedReportForm">
  <div class="row">


    <div class="col-12 col-lg-6">
      <div class="form-group mb-4">
        <label class="form-label"><span class="required-star">*</span> المقاولون</label>
        <input type="text" id="control-contractor" class="form-control" formControlName="contractor">
        <div class="invalid-feedback d-block" *ngIf="controls.contractor?.hasError('required') && showValidation">
          حقل مطلوب
        </div>

      </div>
    </div>
    <div class="col-12 col-lg-6">
      <div class="form-group mb-4">
        <label class="form-label"><span class="required-star">*</span> التكلفه الانشائيه</label>
        <input type="text" id="control-expectedConstructionCost" class="form-control" formControlName="expectedConstructionCost">
        <div class="invalid-feedback d-block" *ngIf="controls.expectedConstructionCost?.hasError('required') && showValidation">
          حقل مطلوب
        </div>
        <mat-error *ngIf="controls.expectedConstructionCost?.hasError('pattern')">من فضلك قم بأدخال رقم صحيح</mat-error>

      </div>
    </div>
    <div class="col-12 col-lg-6">
      <div class="form-group mb-4">
        <label class="form-label"><span class="required-star">*</span> تاريخ بداية الأعمال التعاقدي</label>
        <div class="input-group">
          <input bsDatepicker type="text" id="control-contractualStartDate" class="form-control" formControlName="contractualStartDate" [value]="controls.contractualStartDate.value == '0001-01-01T00:00:00' ?'' : controls.contractualStartDate.value | date: 'dd/MM/yyyy' ">
          <span class="input-group-text"><i class="hgi hgi-stroke hgi-calendar-03"></i></span>
        </div>
        <mat-error *ngIf="controls.contractualStartDate?.hasError('required') && showValidation">حقل مطلوب</mat-error>

      </div>
    </div>
    <div class="col-12 col-lg-6">
      <div class="form-group mb-4">
        <label class="form-label"><span class="required-star">*</span> تاريخ نهاية الأعمال التعاقدي</label>
        <div class="input-group">
          <input bsDatepicker type="text" id="control-contractualFinishDate" class="form-control" formControlName="contractualFinishDate" [value]="controls.contractualFinishDate.value == '0001-01-01T00:00:00' ?'' : controls.contractualFinishDate.value | date: 'dd/MM/yyyy' ">
          <span class="input-group-text"><i class="hgi hgi-stroke hgi-calendar-03"></i></span>
        </div>
        <mat-error *ngIf="controls.contractualFinishDate?.hasError('required') && showValidation">حقل مطلوب</mat-error>
        <mat-error *ngIf="licenseProjectEngineeringSupervisionPlannedReportForm.hasError('dateRangeInvalid') && showValidation">تاريخ النهاية يجب أن يكون بعد تاريخ البداية</mat-error>
      </div>
    </div>
  </div>

  <h6 class="form-title mt-4">{{'المرفقات '}}</h6>

  <div class="row">
    <div class="col-12 col-lg-6">
      <div class="form-group mb-4">
        <label class="form-label"><span class="required-star">*</span> خريطه موقع عام</label>

        <ng-container *ngIf="masterLicenseProjectEngineeringSupervisionPlannedReport &&
         masterLicenseProjectEngineeringSupervisionPlannedReport.licenseProjectEngineeringSupervisionPlannedReportAttachments 
         && masterLicenseProjectEngineeringSupervisionPlannedReport.licenseProjectEngineeringSupervisionPlannedReportAttachments.length != 0">
          <div class="file-bar" *ngFor="let file of masterLicenseProjectEngineeringSupervisionPlannedReport.licenseProjectEngineeringSupervisionPlannedReportAttachments">
            <div class="details" *ngIf="file && file.generalSiteMapFile">
              <span class="icon material-icons-outlined">content_copy</span>
              <a id="link-file" [href]="baseUrl + file.generalSiteMapFile.filePath" target="_blank">{{file.generalSiteMapFile.fileDescription}}</a>
            </div>
          </div>
        </ng-container>

        <app-file-uploader [data]="mueltiFilesUploaderData" (fileUploaded)="onLicenseProjectEngineeringSupervisionPlannedReportAttachmentFilesUploaded($event)"></app-file-uploader>
        <div class="invalid-feedback d-block" *ngIf="(!licenseProjectEngineeringSupervisionPlannedReportAttachmentFiles || licenseProjectEngineeringSupervisionPlannedReportAttachmentFiles.length == 0) && showValidation">
          حقل مطلوب
        </div>
      </div>
    </div>
  </div>
</form>
