
<form class="d-flex flex-column h-100" [formGroup]="licenseProjectEngineeringSupervisionPlannedReportForm"
id="form-licenseProjectEngineeringSupervisionPlannedReportForm">



<div class="tab-data-section">
  <div class="row mb-3">
 

 <div class="col-12 col-lg-6">
  <div class="form-group mb-4">
    <label class="form-label">  المقاولون</label>
    <input type="text" id="control-contractor" class="form-control" formControlName="contractor"
      placeholder="المقاولون">
    <div class="invalid-feedback d-block" *ngIf="controls.contractor?.hasError('required') && showValidation">
      حقل مطلوب
    </div>

  </div>
</div> 
<div class="col-12 col-lg-6">
  <div class="form-group mb-4">
    <label class="form-label">  التكلفه الانشائيه</label>
    <input type="text" id="control-expectedConstructionCost" class="form-control" formControlName="expectedConstructionCost"
      placeholder=" التكلفه الانشائيه">
    <div class="invalid-feedback d-block" *ngIf="controls.expectedConstructionCost?.hasError('required') && showValidation">
      حقل مطلوب
    </div>
    <mat-error *ngIf="controls.expectedConstructionCost?.hasError('pattern')">من فضلك قم بأدخال رقم صحيح</mat-error>

  </div>
</div>
<div class="col-12 col-lg-6">
  <div class="form-group mb-4">
      <label class="form-label">تاريخ بداية الأعمال التعاقدي </label>
      <div class="input-group">
          <input bsDatepicker
                 type="text" id="control-contractualStartDate"
                 class="form-control"
                 placeholder="yyyy-mm-dd"
                 formControlName="contractualStartDate"
                 [value]="controls.contractualStartDate.value == '0001-01-01T00:00:00' ? getDateNow() : controls.contractualStartDate.value | date: 'dd/MM/yyyy' ">
          <span class="input-group-text"><i class="material-icons-outlined">calendar_today</i></span>
      </div>
      <mat-error *ngIf="controls.contractualStartDate?.hasError('required') && showValidation">حقل مطلوب</mat-error>
  </div>
</div>
<div class="col-12 col-lg-6">
  <div class="form-group mb-4">
      <label class="form-label">تاريخ نهاية الأعمال التعاقدي</label>
      <div class="input-group">
          <input bsDatepicker
                 type="text" id="control-contractualFinishDate"
                 class="form-control"
                 formControlName="contractualFinishDate"
                 [value]="controls.contractualFinishDate.value == '0001-01-01T00:00:00' ? getDateNow() : controls.contractualFinishDate.value | date: 'dd/MM/yyyy' ">
          <span class="input-group-text"><i class="material-icons-outlined">calendar_today</i></span>
      </div>
      <mat-error *ngIf="controls.contractualFinishDate?.hasError('required') && showValidation">حقل مطلوب</mat-error>
  </div>
</div> 
  </div>
</div> 
<h6 class="title">{{'المرفقات '}}</h6>
<div class="tab-data-section">
  <div class="row mb-3">
    <div class="col-12 col-lg-6">
      <div class="form-group mb-4">
        <div class="key">خريطه موقع عام</div>
        <div *ngIf="masterLicenseProjectEngineeringSupervisionPlannedReport &&
         masterLicenseProjectEngineeringSupervisionPlannedReport.licenseProjectEngineeringSupervisionPlannedReportAttachments 
         && masterLicenseProjectEngineeringSupervisionPlannedReport.licenseProjectEngineeringSupervisionPlannedReportAttachments.length != 0">
        <div class="value"
          *ngFor="let file of masterLicenseProjectEngineeringSupervisionPlannedReport.licenseProjectEngineeringSupervisionPlannedReportAttachments">
          <span class="icon material-icons-outlined">content_copy</span>
          <a *ngIf="file && file.generalSiteMapFile" id="link-file"
            [href]="baseUrl + file.generalSiteMapFile.filePath" target="_blank">
            {{file.generalSiteMapFile.fileDescription}}</a>
        </div>
      </div>
        <app-file-uploader [data]="mueltiFilesUploaderData"
          (fileUploaded)="onLicenseProjectEngineeringSupervisionPlannedReportAttachmentFilesUploaded($event)"></app-file-uploader>
        <div class="invalid-feedback d-block"
          *ngIf="(!licenseProjectEngineeringSupervisionPlannedReportAttachmentFiles || licenseProjectEngineeringSupervisionPlannedReportAttachmentFiles.length == 0) && showValidation">
          حقل مطلوب
        </div>
      </div>
    </div> 
  </div>
</div> 
</form>
