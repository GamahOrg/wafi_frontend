        <div class="col-12 col-lg-6">
          <div class="form-group mb-4">
            <label class="form-label"> وصف الخطر</label>
            <input type="text" id="control-description" class="form-control" formControlName="description"
              >
            <div class="invalid-feedback d-block" *ngIf="controls.description?.hasError('required') && showValidation">
              حقل مطلوب
            </div>
  
          </div>
        </div>
  
        <div class="col-12 col-lg-6">
          <div class="form-group mb-4">
            <label class="form-label"> نوع الخطر</label>
            <select class="form-select" formControlName="riskTypeId">
              <option [ngValue]="null" disabled hidden>يرجى الاختيار</option>
              <option *ngFor="let type of licenseProjectRiskTypeList" [value]="type.id">
                {{ type.name }}
              </option>
            </select>
            <div class="invalid-feedback d-block" *ngIf="controls.riskTypeId?.hasError('required') && showValidation">
              حقل مطلوب
            </div>
          </div>
        </div>
        <div class="col-12 col-lg-6">
          <div class="form-group mb-4">
            <label class="form-label">الأستمرارية</label>
            <select class="form-select" formControlName="continuityId">
              <option [ngValue]="null" disabled hidden>يرجى الاختيار</option>
              <option *ngFor="let continuity of continuityList" [value]="continuity.id">
                {{ continuity.name }}
              </option>
            </select>
            <div class="invalid-feedback d-block" *ngIf="controls.continuityId?.hasError('required') && showValidation">
              حقل مطلوب
            </div>
          </div>
        </div>
        <div class="col-12 col-lg-6">
          <div class="form-group mb-4">
            <label class="form-label">التأثير</label>
            <select class="form-select" formControlName="effect">
              <option [ngValue]="null" disabled hidden>يرجى الاختيار</option>
              <option *ngFor="let effect of effectList" [value]="effect">
                {{effect}}
              </option>
            </select>
            <div class="invalid-feedback d-block" *ngIf="controls.effect?.hasError('required') && showValidation">
              حقل مطلوب
            </div>
          </div>
        </div>
        <div class="col-12 col-lg-6">
          <div class="form-group mb-4">
            <label class="form-label">الاحتمالية</label>
            <select class="form-select" formControlName="probability">
              <option [ngValue]="null" disabled hidden>يرجى الاختيار</option>
              <option *ngFor="let probability of probabilityList" [value]="probability">
                {{probability}}
              </option>
            </select>
            <div class="invalid-feedback d-block" *ngIf="controls.probability?.hasError('required') && showValidation">
              حقل مطلوب
            </div>
          </div>
        </div>
        <div class="col-12 col-lg-6">
          <div class="form-group mb-4">
            <label class="form-label">الأولوية</label>
            <input type="text" id="control-priority" class="form-control" style="font-weight: bold;"
              formControlName="priority" readonly="readonly">
  
          </div>
        </div>
        <div class="col-12 col-lg-6">
          <div class="form-group mb-4">
            <label class="form-label"> وصف التأثير</label>
            <input type="text" id="control-effectDescription" class="form-control" formControlName="effectDescription"
              >
            <div class="invalid-feedback d-block"
              *ngIf="controls.effectDescription?.hasError('required') && showValidation">
              حقل مطلوب
            </div>
  
          </div>
        </div>
        <div class="col-12 col-lg-6">
          <div class="form-group mb-4">
            <label class="form-label">خطة الاستجابة واستراتيجية الاحتواء</label>
            <input type="text" id="control-responsePlanContainmentStrategy" class="form-control"
              formControlName="responsePlanContainmentStrategy">
            <div class="invalid-feedback d-block"
              *ngIf="controls.responsePlanContainmentStrategy?.hasError('required') && showValidation">
              حقل مطلوب
            </div>
  
          </div>
        </div>
  
        <div class="col-12 col-lg-6">
          <div class="form-group mb-4">
            <label class="form-label">مالك الحل</label>
            <select class="form-select" formControlName="solutionOwnerId">
              <option [ngValue]="null" disabled hidden>يرجى الاختيار</option>
              <option *ngFor="let owner of ownerTypeList" [value]="owner.id">
                {{ owner.name }}
              </option>
            </select>
            <div class="invalid-feedback d-block"
              *ngIf="controls.solutionOwnerId?.hasError('required') && showValidation">
              حقل مطلوب
            </div>
          </div>
        </div>
        <div class="col-12 col-lg-6">
          <div class="form-group">
            <label for="" class="form-label">الجهة المسؤولة عن الحل في حالة الحدوث</label>
            <mat-select formControlName="riskResponsiblePartyIds" multiple class="form-select">
              <mat-select-trigger>
                {{riskResponsiblePartyIds.value?.[0] || ''}}             
                <span *ngIf="(riskResponsiblePartyIds.value?.length || 0) > 1" class="example-additional-selection">
                  (+{{(riskResponsiblePartyIds.value?.length || 0) - 1}} {{riskResponsiblePartyIds.value?.length === 2 ?
                  'other' : 'others'}})
                </span>
              </mat-select-trigger>
              <mat-option *ngFor="let responsibleParty of responsiblePartyList" [value]="responsibleParty.id">{{
                responsibleParty.name }}</mat-option>
            </mat-select>
          </div>
        </div>
  
  
        <div class="col-12 col-lg-6">
          <div class="form-group mb-4">
            <label class="form-label">الحالة</label>
            <select class="form-select" formControlName="riskStatusId">
              <option [ngValue]="null" disabled hidden>يرجى الاختيار</option>
              <option *ngFor="let riskStatus of riskStatusList" [value]="riskStatus.id">
                {{ riskStatus.name }}
              </option>
            </select>
            <div class="invalid-feedback d-block" *ngIf="controls.riskStatusId?.hasError('required') && showValidation">
              حقل مطلوب
            </div>
          </div>
        </div>
      </div>
    </div>
  </form>
