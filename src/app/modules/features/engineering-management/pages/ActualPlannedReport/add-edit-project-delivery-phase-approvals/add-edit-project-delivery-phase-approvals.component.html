
<form class="d-flex flex-column h-100" [formGroup]="
    licenseProjectEngineeringStatusOfFundsRequiredFromEntitiesForm
  " id="form-licenseProjectEngineeringStatusOfFundsRequiredFromEntitiesForm">
    <div class="card com-reg-card position-relative z-2">
        <div class="card-body">
            <div class="tab-data-section">
                <div class="row mb-3">
                   
                    <div class="col-6 col-md-6">
                        <div class="form-group mb-4">
                            <label class="form-label">نوع الخدمة جهة الاعتماد</label>
                            <select class="form-select" formControlName="serviceTypeId"
                            [ngClass]="{'is-invalid': showValidation && controls.serviceTypeId.errors}">
                            <option [ngValue]="null" disabled hidden>يرجى الاختيار</option>
                            <option *ngFor="let service of licenseProjectEngineeringServiceTypeList" [value]="service.id">
                                {{service.name}}</option>
                        </select>
                            <div class="invalid-feedback d-block" *ngIf="
      controls.serviceTypeId?.hasError('required') && showValidation
    ">
                                حقل مطلوب
                            </div>
                        </div>
                    </div>

                    <div class="col-6 col-md-6">
                        <div class="form-group mb-4">
                            <label class="form-label">حالة الاعتماد /الموافقة</label>
                            <select class="form-select" formControlName="accreditationStatusId"
                            [ngClass]="{'is-invalid': showValidation && controls.accreditationStatusId.errors}">
                            <option [ngValue]="null" disabled hidden>يرجى الاختيار</option>
                            <option *ngFor="let status of licenseProjectEngineeringAccreditationStatusList" [value]="status.id">
                                {{status.name}}</option>
                        </select>
                            <div class="invalid-feedback d-block" *ngIf="
      controls.accreditationStatusId?.hasError('required') && showValidation
    ">
                                حقل مطلوب
                            </div>
                        </div>
                    </div>

                    <div class="col-12 col-lg-6">
                        <div class="form-group mb-4">
                            <label class="form-label">تاريخ أول تقديم</label>
                            <div class="input-group">
                                <input bsDatepicker
                                type="text" id="control-firstSubmissionDate"
                                       class="form-control"
                                       formControlName="firstSubmissionDate"
                                       value="{{ controls.firstSubmissionDate.value | date:'yyyy-MM-dd' }}">
                                <span class="input-group-text"><i class="hgi hgi-stroke hgi-calendar-03"></i></span>
                            </div>
                            <mat-error *ngIf="controls.firstSubmissionDate?.hasError('required') && showValidation">حقل مطلوب</mat-error>
                        </div>
                      </div>

                      <div class="col-12 col-lg-6">
                        <div class="form-group mb-4">
                            <label class="form-label">تاريخ اخر تقديم</label>
                            <div class="input-group">
                                <input bsDatepicker
                                type="text" id="control-lastSubmissionDate"
                                       class="form-control"
                                       formControlName="lastSubmissionDate"
                                       value="{{ controls.lastSubmissionDate.value | date:'yyyy-MM-dd' }}">
                                <span class="input-group-text"><i class="hgi hgi-stroke hgi-calendar-03"></i></span>
                            </div>
                            <mat-error *ngIf="controls.lastSubmissionDate?.hasError('required') && showValidation">حقل مطلوب</mat-error>
                        </div>
                      </div>

                      <div class="col-12 col-lg-6" *ngIf="controls.accreditationStatusId.value==accreditationStatus.Released || controls.accreditationStatusId.value==accreditationStatus.Certified">
                        <div class="form-group mb-4">
                            <label class="form-label">تاريخ الاعتماد النهائى</label>
                            <div class="input-group">
                                <input bsDatepicker
                                type="text" id="control-finalApprovalDate"
                                       class="form-control"
                                       formControlName="finalApprovalDate"
                                       value="{{ controls.finalApprovalDate.value | date:'yyyy-MM-dd' }}">
                                <span class="input-group-text"><i class="hgi hgi-stroke hgi-calendar-03"></i></span>
                            </div>
                            <mat-error *ngIf="(controls.accreditationStatusId.value==accreditationStatus.Released || controls.accreditationStatusId.value==accreditationStatus.Certified)&& !controls.finalApprovalDate.value  && showValidation">حقل مطلوب</mat-error>
                        </div>
                      </div>
                   

                  <div class="col-6 col-md-6">
                    <div class="form-group mb-4">
                        <label class="form-label">ملاحظات</label>
                        <textarea type="text" id="control-notes" class="form-control"
                            formControlName="notes"
                            ></textarea>
                        <div class="invalid-feedback d-block" *ngIf="
  controls.notes?.hasError('required') && showValidation
">
                            حقل مطلوب
                        </div>
                    </div>
                </div>
              </div>
        </div>
    </div>
    </div>
</form>
