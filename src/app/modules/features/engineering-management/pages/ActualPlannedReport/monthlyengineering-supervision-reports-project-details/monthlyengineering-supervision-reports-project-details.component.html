<div class="details-page">

  <div class="page-header d-flex justify-content-between align-items-center gap-3">
    <div class="page-title">
      <h6 class="title">تفاصيل المشروع</h6>
    </div>
  </div>

  <div class="page-section">
    <div class="row row-gap-4">
      <div class="col-xl-6">
        <label for="" class="form-label"> الزون</label>
        <select class="form-select" id="control-areasId" (change)="selected($event)">
          <option [ngValue]="null" disabled hidden>يرجى الاختيار</option>
          <option *ngFor="let zone of zoneslist" [value]="zone.id">{{zone.code}}</option>
        </select>
      </div>
    </div>

    <div class="table-responsive my-3" *ngIf="selectedZone">
      <table class="table table-light">
        <thead>
          <tr>
            <th>النوع</th>
            <th>رقم البلوك</th>
            <th>عدد الوحدات</th>
            <th>نوع الوحدات</th>
            <th class="w-0">نسب الإنجاز</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let unit of units.results">
            <td>{{unit.unitType}}</td>
            <td>{{unit.code}}</td>
            <td>{{unit.subUnitCount}}</td>
            <td>{{unit.subUnitTypes}}</td>
            <td class="text-nowrap">
              <div class="d-flex align-items-center gap-2">
                <button type="button" class="btn btn-outline-primary" *ngIf="actualValueReport?.supervisionPlannedReportStatusId==licenseProjectEngineeringRequestStatusEnum.Draft || actualValueReport?.supervisionPlannedReportStatusId==licenseProjectEngineeringRequestStatusEnum.New || actualValueReport?.supervisionPlannedReportStatusId==licenseProjectEngineeringRequestStatusEnum.CustomerFeedback" (click)="openAddEditeDialog(unit)">تحديث النسب</button>
                <button type="button" class="btn btn-primary" (click)="openDetailsDialog(unit)">عرض النسب</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="mt-auto">
      <app-pagination></app-pagination>
    </div>
  </div>
</div>
