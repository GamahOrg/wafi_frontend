<div class="tab-data-section" *ngIf="checkAddingRepling &&
     !checkAddingRepling.isClosed && checkAddingRepling.ownerTypeId===licenseProjectTimeScheduleOwnerType.ProjectManager">
     <button *ngIf="!isDeveloper" type="button" class="btn btn-primary" (click)="openAddReplayFromProjectMangerDialog()">إضافة رد </button>
   
   </div>
   
   <div class="tab-data-section"*ngIf="licenseProjectQualityNoticeReplyList && licenseProjectQualityNoticeReplyList.length > 0">
     <div class="table-responsive">
         <table class="table table-light">
           
           <tbody>
             <tr *ngFor="let replay of licenseProjectQualityNoticeReplyList">
                 
               <td>
                  <span *ngIf="replay.employeeeId==null">مدير المشروع</span>
                  <span *ngIf="replay.employeeeId!=null">الادارة الهندسية</span>
                  <span> {{replay.createdOn | date:'yyyy-MM-dd HH:mm'}}</span>
                  <p> {{replay.notes}}</p>
               </td>
               
             </tr>
           </tbody>
         </table>
       </div>
     </div>
