<div class="details-page">
  <div class="page-header d-flex justify-content-between align-items-center gap-3">
    <div class="page-title">
      <h6 class="title">البرنامج الزمني</h6>
      <span class="status-pill orange" *ngIf="!mainfileShecduleData">وجب التسجيل</span>
    </div>

    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-primary" *ngIf="mainfileShecduleData" (click)="updateTimeSchedule(true)">تحديث البرنامج الزمني</button>
    </div>
  </div>

  <div class="page-section mb-4">
    <div class="d-flex flex-column align-items-center gap-3" *ngIf="!mainfileShecduleData">
      <img src="assets/images/general/location.svg" alt="localization">
      <p class="text">تم إصدار رخصة المشروع ويجب رفع البرنامج الزمني “خط الأساس”</p>
      <button class="btn btn-primary" (click)="updateTimeSchedule(false)">إرسال البرنامج الزمني</button>
    </div>

    <div class="timeline" *ngIf="mainfileShecduleData">
      <div class="timeline-item">
        <div class="row row-gap-2">
          <div class="col-xl">
            <span class="label d-inline-block">خط الأساس</span>
            <span class="status-pill green" [ngClass]="{
              'red' : mainfileShecduleData.externalStatus?.id == statuesCode.UnderStudy,
              'green' : mainfileShecduleData.externalStatus?.id == statuesCode.Certified || mainfileShecduleData.externalStatus?.id == statuesCode.New,
              'orange' : mainfileShecduleData.externalStatus?.id == statuesCode.Compile
              }">{{mainfileShecduleData?.externalStatus?.name}}</span>
          </div>

          <div class="col-xl-auto">
            <button class="btn btn-outline-primary" (click)="getTimeShecduledDetails(mainfileShecduleData.id)">عرض التفاصيل</button>
          </div>
        </div>
      </div>
    </div>

    <div class="timeline" *ngIf="MonthlyfileShecduleData.results">
      <div class="timeline-item" *ngFor="let monthlyfiledata of monthlytimeschecduledprogram">
        <div class="row row-gap-2">
          <div class="col-xl">
            <span class="label d-inline-block"> البرنامج الزمني <small>({{monthlyfiledata.formatedmonthDate}})</small></span>
            <span>{{monthlyfiledata?.externalStatus?.name}}</span>
            <span class="status-pill green" [ngClass]="{
              'red' : mainfileShecduleData.externalStatus?.id == statuesCode.UnderStudy,
              'green' : mainfileShecduleData.externalStatus?.id == statuesCode.Certified || mainfileShecduleData.externalStatus?.id == statuesCode.New,
              'orange' : mainfileShecduleData.externalStatus?.id == statuesCode.Compile
              }">{{monthlyfiledata?.externalStatus?.name}}</span>
          </div>

          <div class="col-xl-auto">
            <button class="btn btn-outline-primary" (click)="getTimeShecduledDetails(monthlyfiledata.id)">عرض التفاصيل</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <app-pagination *ngIf="MonthlyfileShecduleData.results && MonthlyfileShecduleData.results.length > 0"></app-pagination>
</div>
