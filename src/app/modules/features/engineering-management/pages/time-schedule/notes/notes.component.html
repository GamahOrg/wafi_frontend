<div class="details-page">

  <div class="page-header d-flex justify-content-between align-items-center gap-3">
    <div class="page-title">
      <h6 class="title">ملاحظات على الطلب</h6>
    </div>

    <div class="d-flex align-items-center gap-2">
      <button type="button" class="btn btn-outline-primary" (click)="backToList()">رجوع للقائمة</button>
    </div>
  </div>

  <div class="page-section" *ngIf="LicenseProjectTimeScheduleStudyNote && LicenseProjectTimeScheduleStudyNote.length > 0">
    <div class="card" *ngFor="let notesData of LicenseProjectTimeScheduleStudyNote">
      <div class="card-body">
        <div class="results-wrapper">
          <div class="results-info">
            <h6 class="title">
              <span class="name">{{notesData.ownerTypeId == ownerTypes.ProjectManager? 'ملاحظات مدير المشروع ' : 'ملاحظات المهندس المسئول' }}</span>
            </h6>
            <span class="date">
              <i class="material-icons">calendar_month</i>
              {{notesData.createdOn | date:"MM/dd/yyyy"}}
            </span>
          </div>
          <div class="notes">
            <div class="note" [innerHTML]="notesData.notes"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <app-no-data [title]="'لا يوجد ملاحظات على الطلب'" [showText]="false" [showCompleteBtn]="false" *ngIf="LicenseProjectTimeScheduleStudyNote.length === 0"></app-no-data>
</div>
