<app-auth-layout [title]="title">
  <main class="form-signin" id="form-signin">
    <div class="text-center">
      <img
        class="mb-4"
        src="assets/images/auth/Password.svg"
        alt=""
        width="337"
        height="365"
      />
      <h1 class="h3 mb-3 fw-normal" style="color: #076f42">
        انشاء كلمة مرور جديدة
      </h1>
    </div>
    <form [formGroup]="newPassForm" id="form-newPassForm">
      <div class="form-group mb-4">
        <label for="email"> كلمة المرور الجديدة </label>
        <input
          type="password" id="control-password"
          class="form-control"
          formControlName="password"
          id="password"
          placeholder=" أكتب كلمة المرور الجديدة"
          [ngClass]="{
            'is-invalid': passwordControl.touched && passwordControl.errors
          }"
        />
        <div *ngIf="passwordControl.errors" class="invalid-feedback d-block">
          <div
            *ngIf="passwordControl.touched && passwordControl.errors?.['required']"
          >
            كلمة السر مطلوبة
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">تأكيد كلمة المرور الجديدة</label>
        <input
          type="confirmPassword"
          formControlName="confirmPassword" id="control-confirmPassword"
          placeholder=" أكتب كلمة المرور الجديدة"
          class="form-control"
          [ngClass]="{
            'is-invalid':
              confirmPasswordControl.touched && confirmPasswordControl.errors
          }"
        />
        <div
          *ngIf="
            confirmPasswordControl.touched && confirmPasswordControl.errors
          "
          class="invalid-feedback d-block"
        >
          <div *ngIf="confirmPasswordControl.errors?.['required']">
            تأكيد كلمة السر مطلوبة
          </div>
        </div>
      </div>
      <div
        *ngIf="passwordControl.touched && newPassForm.errors"
        class="invalid-feedback d-block"
      >
        <div *ngIf="newPassForm.errors?.['isMatchedError']">
          كلمة المرور وتأكيد كلمة المرور غير متطابقين
        </div>
      </div>

      <div class="text-center">
        <button
          class="w-50 btn btn-primary" id="btn-onSubmit"
          [disabled]="!newPassForm.valid"
          (click)="onSubmit()"
        >
          استمرار
        </button>
      </div>
    </form>
  </main>
</app-auth-layout>
