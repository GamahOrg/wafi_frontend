<app-login-layout>
  <form [formGroup]="loginForm" id="form-loginForm">
    <h5 class="mb-3">تسجيل الدخول / إنشاء حساب</h5>

    <div class="form-group mb-3">
      <label for="loginUserType" class="form-label">اختر نوع المستخدم:</label>
      <select id="loginUserType" formControlName="loginUserType" class="form-select">
        <option [value]="loginUserTypeEnum.wafiPartner">الدخول كأحد الشركاء(ملاك السجل التجاري)</option>
        <option [value]="loginUserTypeEnum.delegateWafiPartner">الدخول كمفوض لأحد الشركاء</option>
        <option [value]="loginUserTypeEnum.finalBeneficiary">الدخول للأفراد</option>
        <option [value]="loginUserTypeEnum.Employee">الدخول كأحد موظفين</option>
      </select>
      <div *ngIf="loginForm.get('loginUserType')?.invalid">
        <small class="text-danger">يجب اختيار نوع المستخدم.</small>
      </div>
    </div>

    <div class="form-group mb-3">
      <label for="username" class="form-label">رقم الهوية </label>
      <input type="text" formControlName="username" id="control-username" class="form-control" [ngClass]="{
            'is-invalid':
              (usernameControl.touched && usernameControl.errors) ||
              errorFeedback
          }" />
      <div *ngIf="usernameControl.errors && !errorFeedback" class="invalid-feedback">
        <div *ngIf="usernameControl.touched && usernameControl.errors?.['required']">
          نأمل اكمال البيانات
        </div>
        <div *ngIf="errorFeedback">نأمل اكمال البيانات</div>
      </div>
    </div>

    <div class="form-group mb-3" *ngIf="!isProduction">
      <label for="password" class="form-label">كلمة المرور</label>
      <div class="input-group">
        <input type="{{ !showPassword ? 'password' : 'text' }}" formControlName="password" id="control-password" class="form-control" [ngClass]="{
              'is-invalid': passwordControl.touched && passwordControl.errors
            }" />
        <span class="input-group-text" (click)="showPassword = !showPassword">
          <i class="material-icons-outlined">{{
            !showPassword ? "visibility" : "visibility_off"
            }}</i>
        </span>
      </div>
      <div *ngIf="passwordControl.touched && passwordControl.errors" class="invalid-feedback d-block">
        <div *ngIf="passwordControl.errors?.['required']">
          نأمل اكمال البيانات
        </div>
      </div>
    </div>

    <div class="invalid-feedback" *ngIf="errorFeedback">{{ errorFeedback }}</div>

    <!-- <div class="forgot-pass-link">
        <a [routerLink]="[fogotPassword]" id="link-fogotPassword">هل نسيت كلمة المرور؟</a>
      </div> -->

    <div class="actions mt-5">
      <button class="btn btn-primary" (click)="onSubmit()" id="btn-onSubmit">
        تسجيل الدخول
      </button>
    </div>
  </form>

  <div class="redir-link" *ngIf="!isProduction">
    اذا كنت لا تمتلك حسابا، قم
    <a [routerLink]="[registration]" id="link-registration">بإنشاء حساب</a>
  </div>
</app-login-layout>
