stages:
  - cached_build
  - build
  - deploy

variables:
  HARBOR_HOST: ${HARBOR_HOST}
  HARBOR_PROJECT: ${HARBOR_PROJECT}
  PRE_IMAGE_TAG_NAME: ${HARBOR_HOST}/${HARBOR_PROJECT}/${CI_PROJECT_NAME}
  FORCE_COLOR: 1
  # For docker image build
  APPLICATION_NAME: wafi_frontend
  IMAGE_TAG_NAME: ${PRE_IMAGE_TAG_NAME}/${APPLICATION_NAME}:${CI_COMMIT_SHORT_SHA}-${CI_COMMIT_BRANCH}
  # For gitops deployment
  # FILE_PATH: applications/rsd/environments/dev/deployment.yaml
  # TAG: "$IMAGE_TAG_NAME"
  # TAG_PATH: .spec.template.spec.containers[0].image

cached_build:
  # only on merge request and main branch
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
    - when: never
  image:
    name: harbor.rega.gov.sa/docker-hub-rega/node:22
    entrypoint: [""]
  variables:
    environment: ci
  stage: cached_build
  before_script:
    - npm install -g pnpm
  script: | # shell
    pnpm install

    echo "Building Angular application..."
    pnpm build

  cache:
    # Cache for node_modules based on lock file hash
    - key:
        files:
          - pnpm-lock.yaml
      paths:
        - node_modules/
      policy: pull-push

    # Cache for .next/cache per branch
    - key: "angular-cache"
      paths:
        - .angular
      policy: pull-push

  artifacts:
    name: "${CI_PROJECT_NAME}-${CI_COMMIT_REF_SLUG}"
    paths:
      - dist
    expire_in: 1 hour

include:
  # only update the yaml file on main branch
  - project: "rega-softwares/rega-devops"
    file: "pipelines/yaml-updater.yaml"
    rules:
      - if: '$CI_COMMIT_BRANCH == "main"'
        when: always
      - when: never
  - project: "rega-softwares/rega-devops"
    file: "pipelines/Kaniko.gitlab-ci.yml"
    # only on merge request and main branch
    rules:
      - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        when: always
      - if: '$CI_COMMIT_BRANCH == "main"'
        when: always
      - when: never
    needs:
      - job: cached_build
        artifacts: true
