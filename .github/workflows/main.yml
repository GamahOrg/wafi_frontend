name: Gitlab Sync

on:
  push:
    branches:
      - development   # only trigger when pushing to these branches
      - main
      - staging

jobs:
  sync:
    name: Gitlab Sync
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Push branch to GitLab
        env:
          GITLAB_URL: gitlab.rega.gov.sa/rega-softwares/wafi_frontend.git
          GITLAB_USER: ${{ github.actor }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Clean up any leftover remote from previous runs (self-hosted runner persists state)
          git remote remove target 2>/dev/null || true

          git remote add target "https://${GITLAB_USER}:${GITLAB_TOKEN}@${GITLAB_URL}"

          # Push ONLY the branch that triggered this workflow
          git push --force target "HEAD:refs/heads/${BRANCH}"

      - name: Cleanup credentials
        if: always()
        run: git remote remove target 2>/dev/null || true
