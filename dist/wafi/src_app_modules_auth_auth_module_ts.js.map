<div class="d-flex flex-column justify-content-between h-100">
  <app-pilot-launch-hint></app-pilot-launch-hint>
  <app-auth-topbar></app-auth-topbar>

  <div class="content flex-fill">
    <div class="abstract top ar">
      <img src="assets/images/auth/abstract-ver.svg" alt="" />
    </div>
    <div class="abstract bottom">
      <img src="assets/images/auth/abstract-hor.svg" alt="" />
    </div>

    <div class="position-relative z-2 h-100">
      <div class="row g-0 h-100">
        <div class="col-12 col-lg-6">
          <div class="form-side">
            <div class="logo">
              <!-- <img src="assets/images/general/logo-wide.svg"
                                 alt=""> -->
            </div>
            <ng-content></ng-content>
          </div>
        </div>
        <div class="col-12 col-lg-6">
          <div class="bg-side">
            <div class="titles">
              <h3 class="title">{{ title }}</h3>
              <h4 class="subtitle">{{ subtitle }}</h4>
            </div>
            <div class="logos justify-content-end">
              <!-- <img src="assets/images/general/logo-wide-white.svg"
                                 alt=""> -->
              <img
                src="assets/images/real-estate-contributions/general/logo-rega-wide-white.svg"
                alt=""
                class="logo-img"
              />
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <app-footer></app-footer>
</div>
<!-- <app-loader></app-loader> -->
