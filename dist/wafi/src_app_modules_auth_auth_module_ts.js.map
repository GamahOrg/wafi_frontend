<app-login-layout>
  <div class="register">
    <h6 class="form-title mb-4">{{'إنشاء حساب جديد'}}</h6>
    <form [formGroup]="registrationForm" id="form-registrationForm">
      <div class="form-group">
        <label for="nIdNumber"
               class="form-label">{{localization.NIDNumberDisplayName}}</label>
        <input type="text" id="control-nIdNumber"
               formControlName="nIdNumber"
               class="form-control"
               placeholder="اكتب {{localization.NIDNumberDisplayName}}"
               [ngClass]="{'is-invalid': controls.nIdNumber.errors && showValidation}" />

        <div *ngIf="controls.nIdNumber.errors && showValidation"
             class="invalid-feedback">
          <div>
            <ng-container *ngIf="controls.nIdNumber.errors?.['required']">
              {{localization.requiredErrorMsg}}
            </ng-container>
            <ng-container *ngIf="controls.nIdNumber.errors?.['pattern']">
              {{localization.pattern}}
            </ng-container>
            <ng-container *ngIf="controls.nIdNumber.errors?.['maxlength'] || controls.nIdNumber.errors?.['minlength']">
              {{localization.maxLengthErrorMsg}}
            </ng-container>
          </div>
        </div>
        <div *ngIf="RegistrationResponse?.status == RegistrationStatus.wrongId"
             class="invalid-feedback">
          <div>{{errorFeedback}}</div>
        </div>
      </div>


      <!-- <div class="form-group">
        <label for="birthday"
               class="form-label">{{controls.nIdType.value == nIdType.citizen ? localization.dateHejrie :
          localization.date}}</label>

      <div class="actions mt-5">
        <button class="btn btn-primary"
                (click)="onClickOnVerification()">{{localization.verification}}</button>

      </div>
    </form>

    <div class="redir-link">
      اذا كنت تمتلك حسابا، قم
      <a [routerLink]="[loginLink]">بتسجيل الدخول</a>
    </div>
  </div>
