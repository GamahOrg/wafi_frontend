<div class="row row-gap-4" *ngIf="reqList">
    <div class="col-12">
        <div class="filter">
            <div class="row">
                <!-- <div class="col-4">
                    <div class="input-group">
                        <span class="input-group-text" id="basic-addon1"><i
                                class="material-icons-outlined">search</i></span>
                        <input type="text" class="form-control" placeholder="بحث رقم الهوية" aria-label="search"
                            aria-describedby="basic-addon1" />
                    </div>
                </div>
                <div class="col-2">
                    <div class="criteria-wrapper">
                        <button type="button " class="toggle btn btn-primary">
                            <span class="d-flex align-items-center column-gap-1">
                                <i class="material-icons">filter_alt</i>
                                بحث
                            </span>
                        </button>
                    </div>
                </div> -->
                <div class="col-6 justify-content-end align-items-end">
                    <button type="button"  color="primary" mat-flat-button
                        class="addbtn  btn btn-outline-primary d-flex align-items-center column-gap-1 float-left"
                        (click)="openDialog()">
                        إضافة مفوض جديد
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="table-responsive mb-3" >
        <table class="table">
            <thead>
                <tr>
                    <th scope="col"> رقم الهوية</th>
                    <th scope="col"> رقم الجوال </th>
                    <th scope="col"> البريد الإلكتروني</th>
                    <th scope="col"> العمليات</th>
                </tr>
            </thead>
            <tbody *ngFor="let comdata of reqList.results;let i=index;trackBy:trackByFnMultipleFields">
                <tr>
                    <td>
                        <div class="d-flex align-items-center column-gap-2">
                            {{comdata.identityNumber}}
                        </div>
                    </td>
                    <td>
                        <span class="text-dark">{{comdata.mobileNumber}}</span>
                    </td>
                    <td>
                        <span class="text-dark">{{comdata.email}}
                        </span>
                    </td>
                    <td>
                        <div class="d-flex align-items-center">
                            <button class="btn btn-outline-primary m-2 edit" style="background-color: white;"><span
                                    class="material-icons  " (click)="openDialog(comdata.id)">edit</span></button>
                            <button class="btn stopbtn"><mat-icon class="material-icons"
                                    (click)="DeleteCommissioners(comdata.id)">delete</mat-icon></button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-auto">
        <app-pagination></app-pagination>
    </div>
    <ng-container *ngIf="reqList.totalCount === 0">
        <div class="mt-4">
            <app-no-data [showCompleteBtn]="false"></app-no-data>
        </div>
    </ng-container>
</div>
