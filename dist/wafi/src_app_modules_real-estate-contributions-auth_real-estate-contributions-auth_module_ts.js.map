<app-login-layout>
  <div class="login">
    <form [formGroup]="loginForm" id="form-loginForm">
      <div class="form-group mb-4">
        <div class="invalid-feedback">{{ errorFeedback }}</div>
        <label for="username" class="form-label"> رقم الهوية</label>
        <input
          type="text"
          formControlName="username"
          id="control-username"
          class="form-control"
          [ngClass]="{
            'is-invalid':
              (usernameControl.touched && usernameControl.errors) ||
              errorFeedback
          }"
        />
        <div
          *ngIf="usernameControl.errors && !errorFeedback"
          class="invalid-feedback"
        >
          <div
            *ngIf="usernameControl.touched && usernameControl.errors?.['required']"
          >
            نأمل اكمال البيانات
          </div>
          <div *ngIf="errorFeedback">نأمل اكمال البيانات</div>
        </div>
      </div>

      <div class="form-group mb-4">
        <label for="password" class="form-label">كلمة المرور</label>
        <div class="input-group">
          <input
            type="{{ !showPassword ? 'password' : 'text' }}"
            formControlName="password"
            id="control-password"
            class="form-control"
            [ngClass]="{
              'is-invalid': passwordControl.touched && passwordControl.errors
            }"
          />
          <span class="input-group-text" (click)="showPassword = !showPassword">
            <i class="material-icons-outlined">{{
              !showPassword ? "visibility" : "visibility_off"
            }}</i>
          </span>
        </div>
        <div
          *ngIf="passwordControl.touched && passwordControl.errors"
          class="invalid-feedback d-block"
        >
          <div *ngIf="passwordControl.errors?.['required']">
            نأمل اكمال البيانات
          </div>
        </div>
      </div>

      <div class="forgot-pass-link">
        <a [routerLink]="[fogotPassword]" id="link-fogotPassword"
          >هل نسيت كلمة المرور؟</a
        >
      </div>

      <div class="actions">
        <button class="btn btn-primary" (click)="onSubmit()" id="btn-onSubmit">
          تسجيل الدخول
        </button>
      </div>
    </form>

    <div class="redir-link">
      اذا كنت لا تمتلك حسابا، قم
      <a [routerLink]="[registration]" id="link-registration">بإنشاء حساب</a>
      <a
        target="_blank"
        href="https://rega.gov.sa/media/kwrbhkn2/%D9%86%D8%B8%D8%A7%D9%85-%D8%A7%D9%84%D9%85%D8%B3%D8%A7%D9%87%D9%85%D8%A7%D8%AA-%D8%A7%D9%84%D8%B9%D9%82%D8%A7%D8%B1%D9%8A%D8%A9.pdf"
        class="d-block text-center"
        id="realEstateContributionsSystemsAndRegulationsLink"
        >أنظمة ولوائح المساهمات عقارية</a
      >
    </div>
  </div>
</app-login-layout>
