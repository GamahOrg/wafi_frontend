<main class="form-signin"
      id="form-signin">
  <div class="text-center">
    <img class="mb-4"
         src="assets/images/auth/ForgotPass.svg"
         alt=""
         width="337"
         height="365" />

  </div>
  <form [formGroup]="forgotPassForm"
        id="form-forgotPassForm">
    <!-- <div class="form-group mb-4">
      <label for="username">كلمة المرور الجديدة</label>
      <input type="password"
             id="control-password"
             class="form-control"
             formControlName="password"
             id="username"
             placeholder="أكنب كلمة المرور الجديدة"
             [ngClass]="{
           'is-invalid': passwordControl.touched && passwordControl.errors
         }" />
      <div *ngIf="passwordControl.errors"
           class="invalid-feedback">
        <div *ngIf="passwordControl.touched && passwordControl.errors?.['required']">
          الرقم السري مطلوب
        </div>

      </div>
    </div> -->



    <div class="form-group mb-4">
      <label for="password"
             class="form-label">{{localization.Password}}</label>
      <div class="input-group">
        <input type="{{!showPassword? 'password' : 'text'}}"
               formControlName="password"
               id="control-password"
               class="form-control"
               [ngClass]="{'is-invalid': controls.password.touched && controls.password.errors }" />
        <span class="input-group-text"
              (click)="showPassword = !showPassword">
          <i class="material-icons-outlined">{{!showPassword? 'visibility' : 'visibility_off'}}</i>
        </span>
      </div>
      <div *ngIf="controls.password.touched && controls.password.errors "
           class="invalid-feedback d-block">
        <div *ngIf="controls.password.errors?.['required']">{{localization.requiredErrorMsg}}</div>
        <div *ngIf="controls.password.errors?.['pattern']">{{localization.noArabicLettersError}}</div>
      </div>
    </div>
    <div class="form-group mb-4">
      <label for="confirmPassword"
             class="form-label">{{localization.ConfirmPassword}}</label>
      <div class="input-group">
        <input type="{{!showPassword? 'password' : 'text'}}"
               formControlName="confirmPassword"
               id="control-confirmPassword"
               class="form-control"
               [ngClass]="{'is-invalid': controls.confirmPassword.touched && controls.confirmPassword.errors }" />
        <span class="input-group-text"
              (click)="showPassword = !showPassword">
          <i class="material-icons-outlined">{{!showPassword? 'visibility' : 'visibility_off'}}</i>
        </span>
      </div>
      <div *ngIf="controls.confirmPassword.touched && controls.confirmPassword.errors"
           class="invalid-feedback d-block">
        <div *ngIf="controls.confirmPassword.errors?.['required']">{{localization.requiredErrorMsg}}</div>
        <div *ngIf="controls.confirmPassword.errors?.['pattern']">{{localization.noArabicLettersError}}</div>
      </div>
      <div class="invalid-feedback d-block"
           *ngIf="controls.confirmPassword.touched && controls.confirmPassword.touched && forgotPassForm.errors?.['isMatchedError']">
        {{localization.isMatchedError}}</div>
    </div>
    <div class="text-center">
      <button class="w-50 btn btn-primary"
              id="btn-onSubmit"
              [disabled]="!forgotPassForm.valid"
              (click)="onSubmit()">
        استمرار
      </button>
    </div>
  </form>
</main>
