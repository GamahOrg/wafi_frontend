<div class="page">
  <div class="page-title">
    <h2 class="title">إنشاء طلب تأهيل جديد</h2>
  </div>

  <div class="page-content p-3 rounded-2 bg-white">
    <div class="row g-4 row-cols-lg-5" *ngIf="qualificationRequestTypes && qualificationRequestTypes.length>0">
      <div class="col-12 col-md-6 col-lg" *ngFor="let qualificationRequestType of qualificationRequestTypes">
        <div class="card qualiication-card cursor-pointer">
          <div class="icon"><span class="material-icons-outlined">{{getIconeName(qualificationRequestType.typeCode)}}</span></div>
          <div class="card-body" (click)="navogateToCreateRequest(qualificationRequestType.typeCode)">
            <h6 class="card-title">{{qualificationRequestType.typeName}}</h6>
          </div>
        </div>
      </div>
