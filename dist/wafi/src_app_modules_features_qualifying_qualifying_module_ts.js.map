<div class="tab-data-section"
     *ngIf="wafiTraining">
    <div class="row row-gap-4">
        <div class="col-12 col-lg-6"
             *ngIf="wafiTraining && wafiTraining.marketerTrainingCertificateFile">
            <div class="key">شهادة اجتياز دورة التسويق للبيع على الخارطة من الهيئة العامة للعقار</div>
            <div class="value">
                <span class="icon material-icons-outlined">content_copy</span>
                <a [href]="baseUrl + wafiTraining.marketerTrainingCertificateFile.filePath" target="_blank">
                    {{wafiTraining.marketerTrainingCertificateFile.fileDescription}}</a>
            </div>
        </div>

        <div class="col-12 col-lg-6"
             *ngIf="wafiTraining && wafiTraining.realEstateDevelopmentTrainingCertificateFile">
            <div class="key">شهادة اجتياز دورة التطوير عقاري لمشاريع البيع على الخارطة</div>
            <div class="value">
                <span class="icon material-icons-outlined">content_copy</span>
                <a [href]="baseUrl + wafiTraining.realEstateDevelopmentTrainingCertificateFile.filePath" target="_blank">
                    {{wafiTraining.realEstateDevelopmentTrainingCertificateFile.fileDescription}}</a>
            </div>
        </div>
    </div>
</div>
