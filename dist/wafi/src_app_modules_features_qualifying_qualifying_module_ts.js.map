<div class="cetificate"
     dir="rtl">

  <div class="cetificate-layout">
    <div class="cert-header">
      <div class="logo">
        <img src="assets/images/qualifying/certs/contribution-developer-certificate/contribution-logo.svg"
             class="img-fluid"
             alt="">
      </div>

      <img src="/assets/images/qualifying/certs/contribution-developer-certificate/top-pattern.svg"
           class="top-pattern"
           alt="">
    </div>

    <div class="data text-center">
      <h4 class="title text-darkblue">شهادة تأهيل مطور عقاري</h4>
      <p class="text fw-bold text-teal">لممارسة نشاط مساهمات عقارية</p>
      <p class="text text-gray mt-4">يسر الهيئة العامة للعقار أن تمنح هذه الشهادة</p>
      <p class="text fw-bold text-green">ل {{certificateData.facilityName}}</p>
      <span class="date text-teal">وذلك بتاريخ {{certificateData.committeeDecisionDate | date:'yyyy/MM/dd'}} م</span>
    </div>

    <div class="cert-number">
      <p class="text text-center">شهادة رقم {{certificateData.certificateNumber}}</p>
    </div>

    <div class="cert-footer">
      <img src="/assets/images/qualifying/certs/footer.svg"
           class="img-fluid"
           alt="">
    </div>

    <img src="/assets/images/qualifying/certs/accountant-certificate/center-pattern.png"
         class="center-pattern"
         alt="">
  </div>

</div>
