<form [formGroup]="nationalAddressesForm">
    <div class="row align-items-end row-gap-3 mb-3">
    <div class="col-12 col-lg-6">
        <label for="" class="form-label">نوع محل الوساطة</label>
        <div class="col-12">
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio"  [value]="1"  formControlName="brokerDocumentTypeId">
                <label class="form-check-label" >صك ملكية</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio"  [value]="2"  formControlName="brokerDocumentTypeId">
                <label class="form-check-label">عقد إيجار</label>
            </div>
        </div>
        <div>
            <p style="font-size: 10px; color: #b02a37;" *ngIf="controls.brokerDocumentTypeId?.hasError('required')&& showValidation">حقل مطلوب</p>
        </div>
    </div>
    <div class="col-12 col-lg-6">
        <label for="" class="form-label">رقم محل الوساطة
        </label>
        <input type="text" class="form-control" formControlName="documentNumber">
        <div>
            <p style="font-size: 10px; color: #b02a37;" *ngIf="controls.documentNumber?.hasError('required')&& showValidation">حقل مطلوب</p>
        </div>
    </div>
<!--     *ngIf="controls.licenseNumber?.hasError('required') && showValidation"
 -->    </div>
    <div class="row align-items-end row-gap-3 mb-3">
        <div class="col-12 col-lg-6">
            <label for="" class="form-label">رقم المبنى</label>
            <input type="text" class="form-control" formControlName="buildingNumber">
            <div>
                <p style="font-size: 10px; color: #b02a37;" *ngIf="controls.buildingNumber?.hasError('required')&& showValidation">حقل مطلوب</p>
            </div>
        </div>
        <div class="col-12 col-lg-6">
            <label for="" class="form-label">اسم الشارع</label>
            <input type="text" class="form-control" formControlName="streetName">
            <div>
                <p style="font-size: 10px; color: #b02a37;" *ngIf="controls.streetName?.hasError('required')&& showValidation">حقل مطلوب</p>
            </div>
        </div>
    </div>

    <div class="row align-items-end row-gap-3 mb-3">
        <div class="col-12 col-lg-6">
            <label for="" class="form-label">اسم الحي</label>
            <input type="text" class="form-control" formControlName="neighborhoodName">
            <div>
                <p style="font-size: 10px; color: #b02a37;" *ngIf="controls.neighborhoodName?.hasError('required')&& showValidation">حقل مطلوب</p>
            </div>
        </div>
        <div class="col-12 col-lg-6">
            <label for="" class="form-label">الرمز البريدي</label>
            <input type="text" class="form-control" formControlName="postalCode">
            <div>
                <p style="font-size: 10px; color: #b02a37;" *ngIf="controls.postalCode?.hasError('required')&& showValidation">حقل مطلوب</p>
            </div>
        </div>
    </div>

    <div class="row align-items-end row-gap-3 mb-3">
        <div class="col-12 col-lg-6">
            <label for="" class="form-label">رقم الوحدة</label>
            <input type="text" class="form-control" formControlName="unitNumber">
            <div>
                <p style="font-size: 10px; color: #b02a37;" *ngIf="controls.unitNumber?.hasError('required')&& showValidation">حقل مطلوب</p>
            </div>
        </div>
        <div class="col-12 col-lg-6">
            <label for="" class="form-label">الرمز الإضافي</label>
            <input type="text" class="form-control" formControlName="additionalNumber">
        </div>
    </div>

    <div class="row align-items-end row-gap-3 mb-3">
        <div class="col-12 col-lg-6">
            <label for="" class="form-label">اسم المنطقة</label>
            <select class="form-select" formControlName="areasId">
                <option label="-- اختار اسم المنطقة --"></option>
                <option *ngFor="let area of areasDropDownList" [value]="area.id">{{area.areaName}}</option>
            </select>
            <div>
                <p style="font-size: 10px; color: #b02a37;" *ngIf="controls.areasId?.hasError('required')&& showValidation">حقل مطلوب</p>
            </div>
        </div>
        <div class="col-12 col-lg-6">
            <label for="" class="form-label">اسم المدينة</label>
            <select class="form-select" formControlName="citiesId">
                <option label="-- اختار اسم المدينة --"></option>
                <option *ngFor="let city of citiesDropDownList" [value]="city.id">{{city.cityName}}</option>
            </select>
            <div>
                <p style="font-size: 10px; color: #b02a37;" *ngIf="controls.citiesId?.hasError('required')&& showValidation">حقل مطلوب</p>
            </div>
        </div>

    </div>


    <!-- <div mat-dialog-actions align="end">
        <button type="button" mat-flat-button color="primary" (click)="save()" [disabled]="nationalAddressesForm.invalid">حفظ البيانات</button>
    </div> -->
</form>
