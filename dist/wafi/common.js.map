  <main class="form-signin" id="form-signin">
    <div class="text-center">
      <img
        class="mb-4"
        src="assets/images/auth/verificationCode.svg"
        alt=""
        width="337"
        height="365"
      />
      <h1 class="h3 mb-3 fw-normal" style="color: #076f42">إدخل رمز التحقق</h1>
      <h2 class="h5 mb-3 form-label">
        من فضلك تفقد  الهاتف ,لقد تم ارسال رمز التحقق
      </h2>
    </div>
    <form id="form-verificationCodeForm">
      <div class="form-group mb-4 text-center">
        <app-otp-input></app-otp-input>  
      </div>

      <div class="text-center">
        <button
          class="w-50 btn btn-primary"
          [disabled]="otpValue?.length != otpConfig.length" id="btn-onSubmit"
          (click)="onSubmit()"
        >
          استمرار
        </button>
        
      </div>
    </form>
    <div class="text-center mt-3">
      <button class="btn btn-primary" type="button" (click)="resendOTP()">إعادة إرسال رمز التحقق</button>
    </div>
  </main>
