<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    <li
      class="breadcrumb-item"
      *ngFor="let breadcrumb of breadcrumbs$ | async; let isLast = last"
      [ngClass]="{ active: isLast }"
    >
      <a *ngIf="!isLast" [routerLink]="breadcrumb.url">{{
        breadcrumb.label
      }}</a>
      <span *ngIf="isLast">{{ breadcrumb.label }}</span>
    </li>
    <!-- <li class="breadcrumb-item active" aria-current="page">
      {{ selectedRequest?.qualificationType?.typeName
        }}{{ selectedRequest?.requestCode }}
    </li> -->
  </ol>
</nav>
