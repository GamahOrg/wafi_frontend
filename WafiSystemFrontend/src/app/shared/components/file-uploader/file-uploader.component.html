<div class="file-upload"
     >
  <div class="upload-drop-zone">
    <div class="upload-text">
      <!-- <p>أسحب الملف إلي هذا الحقل</p>
      <p>أو</p> -->
    </div>
    <div class="upload-button">
      <ng-container *ngIf="data.multiple; else singleInputFile">
        <input type="file"
               hidden
               #InputMultipleFiles
               multiple
               (change)="selectFiles($event)" />
        <button type="button"
                mat-flat-button
                (click)="InputMultipleFiles.click()">
          <!-- <mat-icon fontIcon="cloud_upload"></mat-icon> -->
          {{data.buttonText?data.buttonText: "اختر ملف" }}
        </button>
      </ng-container>
      <ng-template #singleInputFile>
        <input type="file"
               hidden
               #inputSingleFile
               accept="{{data.allowedExtensions?.join(',')}}"
               (change)="selectFiles($event)" />
        <button type="button"
                mat-flat-button
                (click)="inputSingleFile.click()">
          <!-- <mat-icon fontIcon="cloud_upload"></mat-icon> -->
          {{data.buttonText?data.buttonText: "اختر ملف"}}
        </button>
      </ng-template>
    </div>
    <div class="upload-hints">
      <p>الصيغة {{data.allowedExtensionsText}} و {{this.data.size}}  كيلو بايت بحد أقصى</p>
      <!-- <p>العرض يجب أن يكون 1115 بيكسل</p> -->
    </div>

    <div *ngFor="let fileName of selectedFilesName">
      {{fileName}}
      <!-- <span class="delete"><i class="material-icons text-danger">close</i></span> -->
    </div>

    <div *ngIf="currentFile"
         class="progress my-3">
      <div class="progress-bar progress-bar-striped bg-success progress-bar-animated"
           role="progressbar"
           attr.aria-valuenow="{{ progress }}"
           aria-valuemin="0"
           aria-valuemax="100"
           [ngStyle]="{ width: progress + '%' }">
        {{ progress }}%
      </div>
    </div>

    <div *ngIf="message"
         class="alert alert-secondary"
         role="alert">
      {{ message }}
    </div>
    <div *ngIf="extensionErrorMessage"
         class="alert alert-secondary"
         role="alert">
      {{ extensionErrorMessage }}
    </div>
    <div>
      <button class="btn btn-primary mx-2"
              [disabled]="!selectedFiles"
              (click)="upload()">
        {{data.uploadAllLabel? data.uploadAllLabel : 'رفع الكل'}}
      </button>
      <button class="btn btn-outline-secondary"
              [disabled]="!selectedFiles"
              (click)="deleteAll()">
        {{data.removeAllLabel?data.removeAllLabel:'مسح الكل'}}
      </button>
    </div>
