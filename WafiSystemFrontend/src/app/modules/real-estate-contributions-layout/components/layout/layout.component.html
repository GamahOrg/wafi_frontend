<div class="layout d-flex align-items-stretch rega" [dir]="bodyDirection">
  <!-- <app-loader></app-loader> -->

  <app-pilot-launch-hint></app-pilot-launch-hint>

  <aside
    class="sidebar d-flex flex-column row-gap-3 col-10 col-md-4 col-lg-3 col-xl-2"
    [class]="currentLang"
    [ngClass]="{ opened: showSideBar }"
  >
    <span
      class="sidebar-toggle"
      [class]="currentLang"
      (click)="showSideBar = !showSideBar"
    >
      <i class="material-icons">{{ showSideBar ? "close" : "menu" }}</i>
    </span>
    <app-sidebar></app-sidebar>
    <div class="logo">
      <img
        src="assets/images/real-estate-contributions/layout/sidebar/logo-2030.svg"
        alt=""
      />
      <img
        class="img-fluid logo-img"
        src="assets/images/layout/sidebar/REGA_LOGO_Dark.svg"
        alt=""
      />
    </div>
  </aside>
  <main class="d-flex flex-column justify-content-between flex-grow-1">
    <app-header></app-header>
    <section class="content-area">
      <router-outlet></router-outlet>
    </section>
    <app-real-estate-contribution-footer></app-real-estate-contribution-footer>
  </main>
</div>
