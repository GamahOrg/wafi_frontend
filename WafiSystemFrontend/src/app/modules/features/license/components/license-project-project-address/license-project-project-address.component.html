<div class="tab-data-section" *ngIf="address">
    
    <div class="row row-gap-3 row-gap-xl-4 row-gap-xxl-5" *ngIf="address.areas">
        <div class="col-12 col-lg-6">
            <div class="value">
                <span class="icon material-icons">map</span>
                {{address?.areas?.areaName}}
            </div>
        </div>

        <div class="col-12 col-lg-6" *ngIf="address.cities">
            <div class="value">
                <span class="icon material-icons">location_city</span>
                {{address?.cities?.cityName}}
            </div>
        </div>

        <div class="col-12 col-lg-6">
            <div class="value">
                <span class="icon material-icons">domain</span>
                {{address?.neighborhoodName}}
            </div>
        </div>

        <div class="col-12 col-lg-6">
            <div class="value">
                <span class="icon material-icons">signpost</span>
                {{address?.streetName}}
            </div>
        </div>

        <div class="col-12 col-lg-6">
            <div class="value">
                <span class="icon material-icons">location_on</span>
                {{address?.longitude}}
            </div>
        </div>

        <div class="col-12 col-lg-6">
            <div class="value">
                <span class="icon material-icons">location_on</span>
                {{address?.latitude}}
            </div>
        </div>
    </div>
</div>
