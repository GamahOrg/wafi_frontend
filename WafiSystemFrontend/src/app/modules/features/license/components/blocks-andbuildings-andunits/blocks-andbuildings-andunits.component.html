<div class="d-flex flex-column h-100">
  <div class="tab-data-header">
    <div class="icon"><span class="material-icons">list_alt</span></div>
    <h6 class="title">{{localization.BlocksAndbuildingsAndunitsComponent}}</h6>
  </div>
  <div class="tab-data-section"
       *ngIf="accordionContent?.accordionComponentList">
    <div class="tab-data-section-title-subtitle">
      <h6 class="title">
        {{localization.totalNumberOfZones}}
        {{accordionContent.accordionComponentList.length}}
        <button class="btn btn-link"
                (click)="openDialog()">
          <span class="material-icons-outlined">add_circle_outline</span>
          {{localization.addingNewZone}}
        </button>
      </h6>
      <h6 class="subtitle">
        {{localization.addingZoneDetailsHint}}
      </h6>
    </div>
  
    <div class="row row-gap-4">
      <div class="col-12 ">
        <app-accordion></app-accordion>
      </div>
    </div>
  </div>
  <div class="tab-data-section"
       *ngIf="accordionContent?.accordionComponentList?.length==0">
    <div class="row row-gap-4">
      <div class="col-12 ">
        <app-no-data class="mx-auto"
                     (onNoDataButtonClicked)="openDialog()"></app-no-data>
      </div>
    </div>
  </div>
  <app-next-and-previus-buttons></app-next-and-previus-buttons>
</div>
