<div class="tab-data-section">
  <div class="table-responsive">
    <table class="table table-light">
      <thead>
      <tr>
        <!-- <th>{{localization.delegatorIdentityNumber}}</th>
        <th>{{localization.DeveloperName}}</th> -->
        <!-- <th>{{localization.DeveloperEmail}}</th> -->
         <th>{{localization.licenseNumber}}</th> 
        <th>{{localization.projectName}}</th>
        <th>{{localization.AgreementFile}}</th>
        <th></th>

      </tr>
      </thead>
      <tbody>
      <ng-container *ngIf="list && list.length !== 0">
        <tr *ngFor="let iterate of list">
          <!-- <td>{{ iterate.delegatorIdentityNumber }}</td>
          <td>{{ iterate.delegatorName }}</td> -->
          <!-- <td>{{ iterate.delegatorEmail }}</td> -->
           <td>{{ iterate.licenseNumber }}</td> 
          <td>{{ iterate.projectName }}</td>
          <td>
            <span class="icon material-icons-outlined">content_copy</span>
            <a target="_blank" [href]="baseUrl + iterate.subDeveloperAgreementFile.filePath">
              {{iterate.subDeveloperAgreementFile.fileDescription}}</a>
          </td>
          <td>
            <div class="d-flex align-items-center justify-content-end column-gap-2">
              <button mat-icon-button color="warn" (click)="delete(iterate)">
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          </td>
        </tr>
      </ng-container>
      </tbody>
    </table>
    <ng-container *ngIf=" !list || list.length === 0">
      <p class="text-danger text-center p-3">{{localization.NoData}}</p>
    </ng-container>
  </div>
</div>
