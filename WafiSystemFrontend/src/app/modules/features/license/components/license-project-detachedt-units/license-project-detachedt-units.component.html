<div class="row row-gap-4"
*ngIf="detachedUnits && detachedUnits.length>0">
<div class="col-12 ">
<div class="table-responsive">
 <table class="table table-light">
   <thead>
     <tr>
       <th>{{localization.subUnitsType}}</th>
       <th>{{localization.subUnitCount}}</th>
     </tr>
   </thead>
   <tbody>
     <tr *ngFor="let subUnit of detachedUnits; let i = index;">
       <td>{{subUnit.subUnitType.name}}</td>
       <td>{{subUnit.subUnitCount}}</td>
     </tr>
   </tbody>
 </table>
</div>
</div>
</div>
