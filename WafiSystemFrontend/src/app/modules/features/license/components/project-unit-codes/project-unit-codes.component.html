<div class="d-flex flex-column h-100">
  <div class="tab-data-header">
    <div class="icon"><span class="material-icons">list_alt</span></div>
    <h6 class="title fw-normal">{{localization.ProjectUnitCodesComponent}}</h6>
  </div>
  <div class="tab-data-section"
       *ngIf="accordionContent?.accordionComponentList">
    <div class="tab-data-section-title-subtitle">
      <h6 class="subtitle">
        يمكنك إضافة اكواد داخل الوحدة
      </h6>
      <div class="subtitle">
        <button type="button" class="btn btn-primary" (click)="openCodesFileDialog()">إضافة ملف اكواد الوحدات</button>
      </div>
    </div>

    <div class="row row-gap-3 row-gap-xl-4 row-gap-xxl-5">
      <div class="col-12 ">
        <app-accordion *ngIf="accordionContent?.accordionComponentList?.length"></app-accordion>
        <app-no-data [showCompleteBtn]="false"
                     *ngIf="!accordionContent?.accordionComponentList?.length"></app-no-data>
      </div>
    </div>
  </div>
  <app-next-and-previus-buttons></app-next-and-previus-buttons>
  <!-- <div class="form-actions mt-auto">
    <button class="btn btn-outline-primary"
              (click)="back()">{{localization.previous}}</button>
    <button class="btn btn-outline-primary"
            (click)="next()">{{localization.next}}</button>
  </div> -->
</div>
