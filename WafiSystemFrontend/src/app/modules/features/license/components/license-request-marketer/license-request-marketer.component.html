<div class="table-responsive">
    <table class="table table-light">
        <thead>
            <tr>
                <th>{{localization.licenseNumber}}</th>
                <th>{{localization.AgreementFile}}</th>
            </tr>
        </thead>
        <tbody  *ngIf="LicenseProjectRealStateMarketers && LicenseProjectRealStateMarketers.length>0">
            <tr *ngFor="let sub of LicenseProjectRealStateMarketers">
                <td>{{sub.licenseNumber}}</td>
                <td  *ngFor="let file of sub.licenseProjectRealStateMarketerAgreementFiles">
                    <span class="icon material-icons-outlined">content_copy</span>
                    <a target="_blank" [href]="baseUrl + file.agreementFile.filePath">
                      {{file.agreementFile.fileDescription}}</a>
                  </td> 
            </tr>
        </tbody>
    </table>
</div>
