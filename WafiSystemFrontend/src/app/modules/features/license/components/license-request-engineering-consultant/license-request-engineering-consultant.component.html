<h6 class="title fw-normal">ملفات الاتفاقيه</h6>
<div class="col-12 col-lg-12">
  <div class="form-group mb-4">
    <div
      class="value"
      *ngFor="
        let proposedFile of LicenseProjectEngineeringConsultants[0]
          ?.licenseProjectEngineeringConsultantFiles
      "
    >
      <span class="icon material-icons-outlined">content_copy</span>
      <a
        *ngIf="proposedFile && proposedFile.id"
        id="link-proposedScheduleFile"
        [href]="baseUrl + proposedFile.filePath"
        target="_blank"
      >
        {{ proposedFile.fileDescription }}</a
      >
    </div>
  </div>
</div>
<div class="table-responsive">
  <table class="table table-light">
    <thead>
      <tr>
        <th>المدينه</th>
        <th>رقم رخصه الاستشاري الهندسي</th>
        <th>شروط اختيارية</th>
        <th>الإشراف على الموظفين</th>
      </tr>
    </thead>
    <tbody
      *ngIf="
        LicenseProjectEngineeringConsultants &&
        LicenseProjectEngineeringConsultants.length > 0
      "
    >
      <tr *ngFor="let eng of LicenseProjectEngineeringConsultants">
        <td>{{ eng?.city?.cityName }}</td>
        <td>{{ eng.engineeringConsultantLicenseNumber }}</td>
        <td [innerHTML]="eng.optionalTerms"></td>
        <td>{{ eng.superviseStaffPMNumber }}</td>
      </tr>
    </tbody>
  </table>
</div>
