<div class="row row-gap-4">
    <div class="col-3">
                <div class="col-6 justify-content-end align-items-center">
                    <button type="button" style="float: left;" color="primary" mat-flat-button
                        class="addbtn  btn btn-primary d-flex align-items-center column-gap-1 float-left"
                        (click)="openDialog()">
                        إضافة  شكوي  
                    </button>
                </div>
    </div>
    <div class="table-responsive mb-3">
        <table class="table">
            <thead>
                <tr>
                    <th scope="col">النوع</th>
                    <th scope="col">الحالة</th>
                       <th scope="col">اسم مقدم الشكوي او البلاغ</th>
                       <th scope="col">رقم الهوية الوطنية</th>
                         <th scope="col">اسم الشركة</th>
                        <th scope="col">رقم السجل التجاري</th>
                        <th scope="col">العمليات</th>
                </tr>
            </thead>
            <tbody *ngFor="let request of reqList?.results">
                <tr *ngIf="request">
                    <td *ngIf="request.complaintRequestType">
                        <span class="text-dark" *ngIf="request.complaintRequestType.name">{{request.complaintRequestType.name}}
                        </span>
                    </td>
                     <td *ngIf="request.complaintRequestStatus">
                        <span class="text-dark" *ngIf="request.complaintRequestStatus.name">{{request.complaintRequestStatus.name}}
                        </span>
                    </td>
                   <td *ngIf="request.customerName">
                        <span class="text-dark">{{request.customerName}}
                        </span>
                   </td>
                    <td *ngIf="request.nidNumber">
                        <span class="text-dark">{{request.nidNumber}}
                        </span>
                    </td>
                    
                      <td *ngIf="request.facilityName">
                        <span class="text-dark">{{request.facilityName}}
                        </span>
                    </td>
                    <td *ngIf="request.commercialRegisterNumber">
                        <span class="text-dark">{{request.commercialRegisterNumber}}
                        </span>
                    </td>
                    <td>
                     
                        <div class="d-flex align-items-center">
                            <button type="button" class="btn btn-primary" (click)="openShowDialog(request)" > عرض </button>
                            &nbsp;
                            <button type="button" class="btn btn-danger" *ngIf="request.complaintRequestStatus.id===1" (click)="delete(request.id)" > حذف </button>

                    </div>
                    </td>
                    
                </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-auto">
        <app-pagination></app-pagination>
    </div>
    <ng-container *ngIf="reqList?.totalCount === 0">
        <div class="mt-4">
            <app-no-data [showCompleteBtn]="false"></app-no-data>
        </div>
    </ng-container>
</div>
