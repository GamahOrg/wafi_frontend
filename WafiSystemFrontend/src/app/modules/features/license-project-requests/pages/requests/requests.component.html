<div class="page">
  <div class="page-title">
    <h2 class="title">إنشاء طلب جديد</h2>
  </div>

  <div class="page-content p-3 rounded-2 bg-white">
    <div class="row g-4 row-cols-lg-5" *ngIf="requestTypes && requestTypes.length>0">
      <div class="col-12 col-md-6 col-lg-4" *ngFor="let requestType of requestTypes">
        <div class="card qualiication-card cursor-pointer">
          <div class="icon"><span class="material-icons-outlined"></span></div>
          <div class="card-body" (click)="navigateToCreateRequest(requestType.id)">
            <h6 class="card-title">{{requestType.name}}</h6>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
