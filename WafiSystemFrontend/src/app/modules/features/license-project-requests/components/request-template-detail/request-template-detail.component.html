<div class="tab-data-section bg-white">
    <div class="col-12 col-lg-6">
      <div class="key">اسم المشروع</div>
      <div class="value">
        {{ requestDetails && requestDetails[0].header.projectName }}
      </div>
    </div>
    <br>
    <div class="row row-gap-4">  
      <div class="col-12 col-lg-6" *ngFor="let changeRequestDetails of requestDetails">
        <div class="key">{{changeRequestDetails.licenseProjectRequestTemplateFile.displayName}}</div>
        <div class="value">
          <a
            [href]="baseUrl + changeRequestDetails?.file?.filePath"
            target="_blank"
          >
            {{ changeRequestDetails?.file?.fileDescription }}
          </a>
        </div>
      </div>
    </div>
  </div>
