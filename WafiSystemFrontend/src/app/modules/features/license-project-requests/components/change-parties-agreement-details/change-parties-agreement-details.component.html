<div class="tab-data-section bg-white">
  <div class="col-12 col-lg-6">
    <div class="key">اسم المشروع</div>
    <div class="value">
      {{ changeRequestDetails?.projectName }}
    </div>
  </div>
  <br>
    <div class="row row-gap-4">
  
      <!-- Application Form File -->
      <div class="col-12 col-lg-6">
        <div class="key">نموذج الطلب، موضحاً به البنود التي تم تعديلها والأسباب</div>
        <div class="value">
          <a
            [href]="baseUrl + changeRequestDetails?.applicationFormFile?.filePath"
            target="_blank"
          >
            {{ changeRequestDetails?.applicationFormFile?.fileDescription }}
          </a>
        </div>
      </div>
      <div class="col-12 col-lg-6">
        <div class="key">نسخة من الاتفاقية الجديدة المبرمة</div>
        <div class="value">
          <a
            [href]="baseUrl + changeRequestDetails?.newAgreementCopy?.filePath"
            target="_blank"
          >
            {{ changeRequestDetails?.newAgreementCopy?.fileDescription }}
          </a>
        </div>
      </div>
    </div>
  </div>
