<div class="tab-data-header">
  <div class="icon"><span class="material-icons">list_alt</span></div>
  <h6 class="title fw-normal">البيانات من المطور</h6>

  <button *ngIf="showButton" (click)="openDialog()" mat-raised-button class="edit-icon">
    <span class="material-icons"> edit
    </span>
  </button>
</div>

<div class="tab-data-section">
  <div class="row row-gap-3 row-gap-xl-4 row-gap-xxl-5">
  <div class="col-12 col-md-6">
    <div class="key">مبررات و مشفوعات الغاء الرخصة</div>
    <div class="value">
      {{ projectActiveRequestDetails.justificationsAndReasons }}
    </div>
  </div>
  <div class="col-12 col-md-6">
    <div *ngIf="
        projectActiveRequestDetails.licenseProjectActivationRequestFiles !=
        null
      " class="key">
      مستندات تثبت مبررات ضبط اوضاع المشروع و اعادة التفعيل
    </div>
    <div *ngFor="
        let file of projectActiveRequestDetails.licenseProjectActivationRequestFiles
      ">
      <a [href]="baseUrl + file.filePath" id="link-licenseProjectActivationRequestFiles" target="_blank">
        {{ file.fileDescription }}
      </a>
    </div>
  </div>
</div>
</div>
