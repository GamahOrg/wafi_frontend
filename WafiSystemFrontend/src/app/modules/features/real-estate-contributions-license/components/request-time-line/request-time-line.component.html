<div class="card h-100">
    <div class="card-body">

        <div class="timeline"
             *ngIf="requestLogs">
            <div class="timeline-header d-none d-xl-block">
                <div class="row row-cols-5 row-gap-2">
                    <div class="col-12 col-md-4 col-xl">
                        <span class="title">الحدث</span>
                    </div>
                    <div class="col-12 col-md-4 col-xl-2">
                        <span class="title">التاريخ</span>
                    </div>
                    <div class="col-12 col-md-4 col-xl-2">
                        <span class="title">الوقت</span>
                    </div>
                </div>
            </div>

            <ng-container *ngFor="let log of requestLogs">
                <div class="timeline-item"
                     *ngIf="!log.hiddenForCustomer">
                    <div class="row row-cols-5 row-gap-2">
                        <div class="col-12 col-md-4 col-xl">
                            <span class="label d-block d-xl-none">الحدث</span>
                            <span class="status">{{log.description}}</span>
                        </div>
                        <div class="col-12 col-md-4 col-xl-2">
                            <span class="label d-block d-xl-none">التاريخ</span>
                            <span class="date">{{log.createdOn | date:'yyyy-MM-dd'}}</span>
                        </div>
                        <div class="col-12 col-md-4 col-xl-2">
                            <span class="label d-block d-xl-none">الوقت</span>
                            <span class="time">{{log.createdOn | date:'shortTime'}}</span>
                        </div>
                    </div>
                </div>
            </ng-container>
        </div>

        <!-- <ng-container *ngIf="requestLogs">

                    <span class="value">

                    </span>
                </div>
                
                <div class="notes">

            </div>
        </div>
        </ng-container> -->

        <p class="text-danger"
           *ngIf="!requestLogs">لا يوجد سجلات على الطلب</p>
    </div>
</div>
