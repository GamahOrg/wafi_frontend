<div class="d-flex flex-column h-100">
    <div class="tab-data-header">
      <div class="icon"><span class="material-icons">list_alt</span></div>
      <h6 class="title fw-normal">{{localization.title}}</h6>
      <button mat-raised-button
              class="edit-icon"
              (click)="openDialog()"><span class="material-icons">اضافة</span></button>
    </div>
    <div class="tab-data-section">
      <div class="table-responsive">
        <table class="table table-light">
          <thead>
            <tr>
              <th>{{localization.licenseBeneficiaryContractFormId}}</th>
              <th>{{localization.itemNumber}}</th>
              <th> {{localization.itemText}}</th>
              <th class="w-25"></th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let beneficiary of beneficiaryContractFormAdditionalTerms; let i = index">
              <td>
                {{beneficiary?.licenseBeneficiaryContractForm?.description}}
              </td>
              <td>{{beneficiary?.itemNumber}}</td>
              <td>{{beneficiary?.itemText}}</td>
              <td>
                <div class="d-flex align-items-center justify-content-end column-gap-2">
                   <button mat-icon-button
                          color="warn"
                          (click)="delete(beneficiary.id,i)"><mat-icon>delete</mat-icon></button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <app-next-and-previus-buttons></app-next-and-previus-buttons>
    
  </div>
