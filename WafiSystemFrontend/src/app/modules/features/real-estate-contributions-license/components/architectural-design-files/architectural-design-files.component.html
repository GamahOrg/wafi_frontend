<ng-container *ngIf="architecturalDesign && architecturalDesign.id">
  <div class="d-flex flex-column h-100">
    <div class="tab-data-header">
      <div class="icon"><span class="material-icons">list_alt</span></div>
      <h6 class="title fw-normal">{{localization.title}}</h6>
    </div>
    <div class="tab-data-section">
      <div class="row mb-3">
        <div class="col-12 col-lg-6">
          <div class="form-group mb-4">
            <label class="form-label">{{localization.licenseProjectPlanAccordingApprovedStandardsFiles}}</label>
            <div class="value"
                 *ngFor="let approvedStandardsFile of architecturalDesign.licenseProjectPlanAccordingApprovedStandardsFiles">
<!--               <span class="icon material-icons-outlined">content_copy</span> -->
              <a *ngIf="approvedStandardsFile && approvedStandardsFile.planFile"
                 [href]="baseUrl + approvedStandardsFile.planFile.filePath" target="_blank">
                {{approvedStandardsFile.planFile.fileDescription}}</a>
            </div>
            <app-file-uploader [data]="multipleFileUploaderData"
                               (fileUploaded)="onApprovedStandardsFilesUploaded($event)"></app-file-uploader>
             <!-- <mat-error *ngIf="showValidation">{{localization.requiredErrorMsg}}</mat-error> -->
          </div>
        </div>

        <div class="col-12 col-lg-6">
          <div class="form-group mb-4">
            <label class="form-label">{{localization.licenseProjectDesignFiles}}</label>
            <div class="value"
                 *ngFor="let designFile of architecturalDesign.licenseProjectDesignFiles">
     <!--          <span class="icon material-icons-outlined">content_copy</span> -->
              <a *ngIf="designFile && designFile.designFile"
                 [href]="baseUrl + designFile.designFile.filePath" target="_blank">
                {{designFile.designFile.fileDescription}}</a>
            </div>
            <app-file-uploader [data]="multipleFileUploaderData"
                               (fileUploaded)="onDesignFilesUploaded($event)"></app-file-uploader>
             <mat-error *ngIf="showValidation">{{localization.requiredErrorMsg}}</mat-error> 
          </div>
        </div>
      </div>
    </div>
    <app-next-and-previus-buttons></app-next-and-previus-buttons>
    <!-- <div class="form-actions mt-auto">
      <button class="btn btn-outline-primary"
              (click)="back()">{{localization.previous}}</button>

      <button class="btn btn-outline-primary"
              (click)="save(true)">{{localization.next}}</button>

    </div> -->
  </div>
</ng-container>
