        <div class="col-12 col-lg-6">
            <div class="value">
                <span class="icon material-icons">signpost</span>
                {{address.address}}
            </div>
        </div>

        <div class="col-12 col-lg-6">
            <div class="value">
                <span class="icon material-icons">location_on</span>

        <div class="col-12 col-lg-6">
            <div class="value">
                <span class="icon material-icons">location_on</span>
                {{address.latitude}}
