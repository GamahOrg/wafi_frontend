
<div class="tab-data-section">
  <div class="table-responsive">
    <table class="table table-light">
      <thead>
      <tr>
        <th>{{localization.LicenseNumber}}</th>
        <th>{{localization.AgreementFile}}</th>

      </tr>
      </thead>
      <tbody>
      <ng-container *ngIf="list && list.length !== 0">
        <tr *ngFor="let iterate of list">
           <td>{{ iterate.licenseNumber }}</td>

           <td  *ngFor="let file of iterate.licenseProjectRealStateMarketerAgreementFiles">
            <span class="icon material-icons-outlined">content_copy</span>
            <a target="_blank" [href]="baseUrl + file.agreementFile.filePath">
              {{file.agreementFile.fileDescription}}</a>
          </td> 
          <td>
            <div class="d-flex align-items-center justify-content-end column-gap-2">
              <button mat-icon-button color="warn" (click)="delete(iterate)">
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          </td>
        </tr>
      </ng-container>
      </tbody>
    </table>
    <ng-container *ngIf=" !list || list.length === 0">
      <p class="text-danger text-center p-3">{{localization.NoData}}</p>
    </ng-container>
  </div>
</div>
