<div class="page">
  <div class="page-title">
    <h2 class="title">إنشاء طلب ترخيص جديد</h2>
  </div>

  <div class="page-content d-flex flex-column gap-3">
    <div class="licenses-group p-3 rounded-2 bg-white" id="g-sale" *ngIf="SysLicenseRequestTypeGrouping.sale.length > 0">
      <div class="licenses-group-data">
        <div class="row row-gap-4 w-75 mx-auto">
          <div class="col-12 col-lg-6" *ngFor="let sale of SysLicenseRequestTypeGrouping.sale">
            <div class="card license-card h-100" (click)="navogateToCreateRequest(sale.typeCode)">
              <div class="card-header">
                <div class="icon">
                  <span class="material-icons-outlined">add_business</span>
                </div>
                <div class="title overflow-hidden">
                  <h6 class="text-center">{{sale.name}}</h6>
                </div>
              </div>
              <div class="card-body">
                <p class="card-text">{{sale.description}}</p>
                <span class="arrow"><i class="material-icons">west</i></span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="licenses-group p-3 rounded-2 bg-white" id="g-rent" *ngIf="SysLicenseRequestTypeGrouping.rent.length > 0">
      <div class="licenses-group-data">
        <div class="row row-gap-4 w-75 mx-auto">
          <div class="col-12 col-lg-6" *ngFor="let rent of SysLicenseRequestTypeGrouping.rent">
            <div class="card license-card h-100" (click)="navogateToCreateRequest(rent.typeCode)">
              <div class="card-header">
                <div class="icon">
                  <span class="material-icons-outlined">add_business</span>
                </div>
                <div class="title overflow-hidden">
                  <h6 class="text-center">{{rent.name}}</h6>
                </div>
              </div>
              <div class="card-body">
                <p class="card-text">{{rent.description}}</p>
                <span class="arrow"><i class="material-icons">west</i></span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="licenses-group p-3 rounded-2 bg-white" id="g-marketing" *ngIf="SysLicenseRequestTypeGrouping.marketing.length > 0">
      <div class="licenses-group-data">
        <div class="row row-gap-4 w-75 mx-auto">
          <div class="col-12 col-lg-6" *ngFor="let market of SysLicenseRequestTypeGrouping.marketing">
            <div class="card license-card h-100" (click)="navogateToCreateRequest(market.typeCode)">
              <div class="card-header">
                <div class="icon">
                  <span class="material-icons-outlined">add_business</span>
                </div>
                <div class="title overflow-hidden">
                  <h6 class="text-center">{{market.name}}</h6>
                </div>
              </div>
              <div class="card-body">
                <p class="card-text">{{market.description}}</p>
                <span class="arrow"><i class="material-icons">west</i></span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="licenses-group p-3 rounded-2 bg-white" id="g-show" *ngIf="SysLicenseRequestTypeGrouping.showing.length > 0">
      <div class="licenses-group-data">
        <div class="row row-gap-4 w-75 mx-auto">
          <div class="col-12 col-lg-6" *ngFor="let show of SysLicenseRequestTypeGrouping.showing">
            <div class="card license-card h-100" (click)="navogateToCreateRequest(show.typeCode)">
              <div class="card-header">
                <div class="icon">
                  <span class="material-icons-outlined">add_business</span>
                </div>
                <div class="title overflow-hidden">
                  <h6 class="text-center">{{show.name}}</h6>
                </div>
              </div>
              <div class="card-body">
                <p class="card-text">{{show.description}}</p>
                <span class="arrow"><i class="material-icons">west</i></span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
